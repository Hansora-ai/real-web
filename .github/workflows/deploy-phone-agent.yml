# Sends the phone worker (workers/automation-phone) to LiveKit Cloud.
# Runs when phone code changes on main (merging a phone pull request deploys
# it), or when started by hand. Other branches never change the live line.
name: Deploy phone agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['workers/automation-phone/**', 'lib/automation/**', '.github/workflows/deploy-phone-agent.yml']

concurrency:
  group: deploy-phone-agent
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      AGENT_ID: CA_yH5CZHNwc2MB
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Check the worker
        working-directory: workers/automation-phone
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: Install LiveKit CLI
        run: curl -sSL https://get.livekit.io/cli | bash

      # The Dockerfile copies lib/ and workers/automation-phone/ from the repo
      # root, so the upload holds exactly those, with the Dockerfile at its root.
      - name: Prepare upload
        run: |
          test -n "$LIVEKIT_URL" && test -n "$LIVEKIT_API_KEY" && test -n "$LIVEKIT_API_SECRET" || { echo "LIVEKIT_URL, LIVEKIT_API_KEY and LIVEKIT_API_SECRET secrets are required"; exit 1; }
          subdomain=$(echo "$LIVEKIT_URL" | sed -E 's#^[a-z]+://##; s#\.livekit\.cloud.*$##')
          mkdir -p "$RUNNER_TEMP/phone/workers/automation-phone"
          cp -r lib "$RUNNER_TEMP/phone/lib"
          cp workers/automation-phone/package.json workers/automation-phone/package-lock.json "$RUNNER_TEMP/phone/workers/automation-phone/"
          cp -r workers/automation-phone/src "$RUNNER_TEMP/phone/workers/automation-phone/src"
          [ -d workers/automation-phone/test ] && cp -r workers/automation-phone/test "$RUNNER_TEMP/phone/workers/automation-phone/test" || true
          cp workers/automation-phone/Dockerfile "$RUNNER_TEMP/phone/Dockerfile"
          printf '[project]\n  subdomain = "%s"\n\n[agent]\n  id = "%s"\n' "$subdomain" "$AGENT_ID" > "$RUNNER_TEMP/phone/livekit.toml"

      - name: Deploy
        working-directory: ${{ runner.temp }}/phone
        run: lk agent deploy --url "$LIVEKIT_URL" --api-key "$LIVEKIT_API_KEY" --api-secret "$LIVEKIT_API_SECRET"

      - name: Status
        working-directory: ${{ runner.temp }}/phone
        run: lk agent status --url "$LIVEKIT_URL" --api-key "$LIVEKIT_API_KEY" --api-secret "$LIVEKIT_API_SECRET"
