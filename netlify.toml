[build]
  publish = "public"
  functions = "netlify/runtime-functions"
  command = "npm run build:functions"

# The compatibility adapter and LiveKit SDK require Node 22.
[build.environment]
  NODE_VERSION = "22.22.0"

[functions]
  node_bundler = "esbuild"

[functions."business-dashboard"]
  timeout = 60

# (kept) Function-specific settings
[functions."run-heygen-avatar"]
  timeout = 60

[functions."heygen-check"]
  timeout = 60

[functions."run-henshin"]
  timeout = 60
  included_files = ["public/vendor/henshin/ffmpeg-core.wasm"]

[functions."run-kling-40"]
  timeout = 60
  included_files = ["public/vendor/henshin/ffmpeg-core.wasm"]

[functions."kling4-check"]
  timeout = 60

[functions."kling4-sweep"]
  timeout = 60

[functions."henshin-check"]
  timeout = 60

[functions."run-seedance-2"]
  timeout = 60
  included_files = ["public/vendor/henshin/ffmpeg-core.wasm"]
[functions."run-seedance-25"]
  timeout = 60
  included_files = ["public/vendor/henshin/ffmpeg-core.wasm"]
[functions."run-seedance-25-final"]
  timeout = 60
  included_files = ["public/vendor/henshin/ffmpeg-core.wasm"]
[functions."run-seedance-cheap"]
  timeout = 60
  included_files = ["public/vendor/henshin/ffmpeg-core.wasm"]
[functions."run-seedance-25-cheap"]
  timeout = 60
  included_files = ["public/vendor/henshin/ffmpeg-core.wasm"]
[functions."reapi-check"]
  timeout = 60
[functions."run-wan-3"]
  timeout = 60
  included_files = ["public/vendor/henshin/ffmpeg-core.wasm"]
[functions."reapi-sweep"]
  timeout = 60

[functions."henshin-finish-background"]
  included_files = ["public/vendor/henshin/ffmpeg-core.wasm"]

[functions."henshin-templates"]
  timeout = 60
  included_files = ["public/vendor/henshin/ffmpeg-core.wasm"]

[functions."kie-create"]
  timeout = 26

[functions."safe-run"]
  timeout = 60

[functions."run-gemini-omni-flash-1-1"]
  timeout = 45

[functions."sales-chat"]
  timeout = 60

[functions."hansora-mcp"]
  timeout = 60

# Unlimited generation queue dispatcher (runs once per minute)
[functions."dispatch-unlimited-queue"]
  schedule = "* * * * *"

[functions."automation-flow-jobs"]
  schedule = "* * * * *"

# Deletes customer photos, videos and voice notes after the retention period (once a day, 03:20 UTC)
[functions."automation-media-cleanup"]
  schedule = "20 3 * * *"

# Re-reads connected Google Sheets (product catalogs) every hour
[functions."automation-catalog-sync"]
  schedule = "7 * * * *"

# Re-reads website links in AI knowledge older than a week (once a day, 04:40 UTC)
[functions."automation-knowledge-refresh"]
  schedule = "40 4 * * *"

[[headers]]
  for = "/*"
  [headers.values]
  Access-Control-Allow-Origin = "*"

# --- Kept: Scheduled Function for the no-webhook finisher ---
[[scheduled]]
  path = "/.netlify/functions/hf-sweeper"
  schedule = "*/1 * * * *"

# --- Mobile bottom banner Edge Function (injects the phone-only bottom nav into every HTML page) ---
[[edge_functions]]
path = "/*"
function = "inject-bottom-nav-inline"

# Automation pages: CSS/JS are reused from the browser for 5 minutes, then shown instantly from cache while the
# browser checks for a newer copy in the background (no waiting on every page switch). Files carry ?v= versions.
[[headers]]
  for = "/automation-*.js"
  [headers.values]
  Cache-Control = "public, max-age=300, stale-while-revalidate=604800"
[[headers]]
  for = "/automation-*.css"
  [headers.values]
  Cache-Control = "public, max-age=300, stale-while-revalidate=604800"

[functions."automation-test-chat"]
  timeout = 26

# Buying stage of quiet chats (30 min without messages), once per conversation change
[functions."automation-sales-stage"]
  schedule = "*/10 * * * *"

# Friendly address for the ChatGPT plugin / AI-app connect page.
[[redirects]]
  from = "/chatgpt-plugin"
  to = "/mcp-setup.html"
  status = 200

# Russian and Armenian versions are served by the same page, which picks its language from the address.
[[redirects]]
  from = "/mcp-setup_ru.html"
  to = "/mcp-setup.html"
  status = 200

[[redirects]]
  from = "/mcp-setup_arm.html"
  to = "/mcp-setup.html"
  status = 200

# Financial data is fetched only through a verified owner API; never cache reports.
[[headers]]
  for = "/business.html"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
