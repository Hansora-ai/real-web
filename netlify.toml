[build]
  publish = "public"
  functions = "netlify/functions"
  node_version = "18"

[functions]
  node_bundler = "esbuild"

# (kept) Function-specific settings
[functions."kie-create"]
  timeout = 26
  memory = 512

[[headers]]
  for = "/*"
  [headers.values]
  Access-Control-Allow-Origin = "*"

# --- Added: Scheduled Function for the no‑webhook finisher ---
# Path must match: netlify/functions/hf-sweeper.js
[[scheduled]]
  path = "/.netlify/functions/hf-sweeper"
  # Every minute (adjust as needed, e.g., "*/2 * * * *" for every 2 minutes)
  schedule = "*/1 * * * *"
