[build]
  publish = "public"
  functions = "netlify/runtime-functions"
  command = "npm run build:functions"

# The compatibility adapter and LiveKit SDK require Node 22.
[build.environment]
  NODE_VERSION = "22.22.0"

[functions]
  node_bundler = "esbuild"

# (kept) Function-specific settings
[functions."kie-create"]
  timeout = 26

[functions."safe-run"]
  timeout = 60

[functions."run-gemini-omni-flash-1-1"]
  timeout = 45

[functions."sales-chat"]
  timeout = 60

[functions."hansora-mcp"]
  timeout = 60

# Unlimited generation queue dispatcher (runs once per minute)
[functions."dispatch-unlimited-queue"]
  schedule = "* * * * *"

[functions."automation-flow-jobs"]
  schedule = "* * * * *"

# Deletes customer photos, videos and voice notes after the retention period (once a day, 03:20 UTC)
[functions."automation-media-cleanup"]
  schedule = "20 3 * * *"

# Re-reads connected Google Sheets (product catalogs) every hour
[functions."automation-catalog-sync"]
  schedule = "7 * * * *"

# Re-reads website links in AI knowledge older than a week (once a day, 04:40 UTC)
[functions."automation-knowledge-refresh"]
  schedule = "40 4 * * *"

[[headers]]
  for = "/*"
  [headers.values]
  Access-Control-Allow-Origin = "*"

# --- Kept: Scheduled Function for the no-webhook finisher ---
[[scheduled]]
  path = "/.netlify/functions/hf-sweeper"
  schedule = "*/1 * * * *"

# --- Mobile bottom banner Edge Function (injects the phone-only bottom nav into every HTML page) ---
[[edge_functions]]
path = "/*"
function = "inject-bottom-nav-inline"
