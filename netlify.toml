# Root config that points at the real-web app
[build]
base      = "real-web"
publish   = "public"             # resolves to real-web/public
functions = "netlify/functions"  # resolves to real-web/netlify/functions
node_version = "18"

[build.environment]
AWS_LAMBDA_JS_RUNTIME = "nodejs20.x"

[functions]
node_bundler = "esbuild"

[functions."kie-create"]
timeout = 26
memory  = 512

[[headers]]
for = "/*"
  [headers.values]
  Access-Control-Allow-Origin = "*"

[[scheduled]]
path     = "/.netlify/functions/hf-sweeper"
schedule = "*/1 * * * *"

# Edge function that injects the mobile bar
[[edge_functions]]
path     = "/*"
function = "inject-bottom-nav-inline"
