<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contacts — Hansora Automation</title><link rel="icon" href="/favicon.png" type="image/png"><link rel="apple-touch-icon" href="/favicon.png">
  <meta name="description" content="Everyone who talked to your AI employee, with tags and saved details.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08090b">
  <script src="automation-theme.js?v=20261008"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="automation-header.css?v=20261008c"><link rel="stylesheet" href="automation-ui.css?v=20261008b"><link rel="stylesheet" href="automation-contacts.css?v=20261001">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="automation-client.js?v=20261008b"></script><script defer src="automation-ui.js?v=20261008b"></script><script defer src="automation-header.js?v=20261008c"></script><script defer src="automation-contacts.js?v=20261004-channels"></script>
</head>
<body class="ui" data-automation-page="contacts">
  <div data-automation-header></div>
  <main class="ui-page">
    <div id="contacts-loading" aria-label="Loading"><div class="ui-skeleton" style="height:420px;border-radius:16px"></div></div>
    <div class="ui-alert" id="contacts-error" role="alert" hidden></div>
    <div id="contacts-app" class="ui-enter" hidden>
      <nav class="ui-crumbs" aria-label="Breadcrumb"><a id="contacts-back" href="automation-dashboard.html">← AI employee</a></nav>
      <header class="ui-page-head"><div><h1>Contacts</h1><p>Everyone who wrote to you, with the tags and details your automations saved.</p></div><span class="ui-badge" id="contacts-count">0 contacts</span></header>
      <section class="ui-card contacts-card">
        <div class="contacts-toolbar">
          <label class="contacts-search"><span data-icon="search"></span><input id="contacts-search" type="search" placeholder="Search name, @username, email, phone"></label>
          <select class="ui-select" id="contacts-channel" aria-label="Channel"><option value="">All channels</option><option value="instagram_dm">Instagram</option><option value="whatsapp">WhatsApp</option><option value="telegram">Telegram</option><option value="messenger">Messenger</option><option value="phone">Phone</option></select>
          <select class="ui-select" id="contacts-tag" aria-label="Tag"><option value="">All tags</option></select>
        </div>
        <div class="contacts-table" role="table" aria-label="Contacts">
          <div class="contacts-row head" role="row"><span>Contact</span><span>Tags</span><span>Saved details</span><span>Last seen</span><span></span></div>
          <div id="contacts-rows"></div>
        </div>
        <p class="ui-empty" id="contacts-empty" hidden>No contacts match.</p>
      </section>
    </div>
  </main>
</body>
</html>
