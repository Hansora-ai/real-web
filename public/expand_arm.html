    .board-head{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:74px;padding:16px 20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.018)}.board-title{font-size:clamp(24px,3vw,42px);font-weight:900;line-height:1}.board-sub{color:var(--muted);font-size:14px;margin-top:6px}.refresh{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.045);color:#fff;padding:10px 14px;font-weight:800}.canvas{padding:20px}.examples{display:grid;grid-template-columns:1fr 1fr;gap:16px}.example-card{border:1px solid var(--line);background:#171a20;border-radius:18px;overflow:hidden}.example-media{aspect-ratio:16/9;background:radial-gradient(circle at 30% 20%,rgba(99,102,241,.32),transparent 45%),radial-gradient(circle at 80% 80%,rgba(56,189,248,.22),transparent 45%),#0b0d12;display:grid;place-items:center;color:rgba(255,255,255,.62);font-weight:850;text-align:center;padding:0}.example-media img{width:100%;height:100%;object-fit:cover}.example-body{padding:14px}.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,190px));gap:14px}.result-card{position:relative;border:1px solid var(--line);background:#171a20;border-radius:18px;overflow:hidden}.result-card[data-tool="different_angles"]{grid-column:span 2;max-width:390px}.result-media{aspect-ratio:3/4;background:#020617;display:grid;place-items:center;color:rgba(255,255,255,.58);font-size:13px;text-align:center;padding:12px}.result-card[data-tool="different_angles"] .result-media{aspect-ratio:16/9}.result-card[data-tool="expand"] .result-media,.result-card[data-tool="face_swap"] .result-media{aspect-ratio:3/4}.result-media img{width:100%;height:100%;object-fit:cover}.processing-state{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center}.processing-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}.processing-orb{width:48px;height:48px;border-radius:18px;background:linear-gradient(135deg,#ff25c8,#8b5cf6,#38bdf8);box-shadow:0 0 30px rgba(255,37,200,.52);animation:orbSpin 1.35s linear infinite}@keyframes orbSpin{to{transform:rotate(360deg)}}.result-body{padding:12px}.safe{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{width:10px;height:10px;border-radius:999px;background:#fbbf24;box-shadow:0 0 0 5px rgba(251,191,36,.14);display:inline-block}.dot.ready{background:#86efac;box-shadow:0 0 0 5px rgba(134,239,172,.14)}.dot.failed{background:#f87171;box-shadow:0 0 0 5px rgba(248,113,113,.14)}.get{width:100%;border:0;border-radius:999px;background:linear-gradient(135deg,#7c3aed,#6366f1);color:#fff;padding:10px 12px;font-weight:900;font-size:12px}.preview-open{cursor:pointer}.loader{width:26px;height:26px;border-radius:999px;border:3px solid rgba(148,163,184,.42);border-top-color:#a855f7;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

    @media(max-width:900px){body{overflow:auto}main.shell{display:flex;flex-direction:column;height:auto;padding:12px}.left{overflow:visible}.right{overflow:visible}.board-head{align-items:flex-start;flex-direction:column}.examples{grid-template-columns:1fr}.result-grid{display:flex;overflow-x:auto;gap:12px;scroll-snap-type:x mandatory;padding-bottom:10px}.result-card{flex:0 0 42vw;max-width:190px;scroll-snap-align:start}.result-card[data-tool="different_angles"]{flex-basis:76vw;max-width:360px}.upload-grid{grid-template-columns:1fr 1fr}}

<body>
  <div id="sharedHeader"></div>
  <main class="shell">
    <section class="panel left" id="generatorCard">
      <div>
        <div class="title">Ստեղծում</div>
        <div class="small mt-1">Full Angles or Expand</div>
      </div>

      <div class="tabs">
        <button id="anglesBtn" type="button" class="tab active">Full Angles</button>
        <button id="expandBtn" type="button" class="tab">Expand</button>
      </div>

      <div class="info">
        <div class="label">Պատկերներ</div>
        <input id="imageInput" type="file" accept="image/*" multiple class="hidden" />
        <div id="uploadGrid" class="upload-grid two"></div>
        <div class="small mt-2" id="uploadHint">Վերբեռնեք 1–2 պատկեր։ Միայն պատկերներ։</div>
      </div>

      <div id="aspectBlock" class="info">
        <div class="label">Չափս</div>
        <div class="chips" id="aspectChips">
          <button type="button" data-aspect="auto" class="chip active">Ավտո</button>
          <button type="button" data-aspect="1:1" class="chip">1:1</button>
          <button type="button" data-aspect="16:9" class="chip">16:9</button>
          <button type="button" data-aspect="9:16" class="chip">9:16</button>
          <button type="button" data-aspect="4:3" class="chip">4:3</button>
          <button type="button" data-aspect="3:4" class="chip">3:4</button>
        </div>
      </div>

      <div class="mt-auto space-y-3">
        <button id="runBtn" type="button" class="run">Գեներացնել • 1.5⚡</button>
        <div id="errorBox" class="err hidden"></div>
      </div>
    </section>

    <section class="panel right">
      <div class="board-head">
        <div>
          <div class="board-title" id="boardTitle">Պատկերի գործիքներ</div>
          <div class="board-sub" id="boardSub">Վերբեռնեք ձեր պատկերը։</div>
        </div>
        <button id="refreshResultsBtn" type="button" class="refresh">Թարմացնել</button>
      </div>
      <div class="canvas">
        <div id="examplesArea" class="examples">
          <div class="example-card">
            <div class="example-media"><img src="https://qmaealblegvcwodlmeht.supabase.co/storage/v1/object/public/for%20the%20examples%20and%20news/Untitled%20folder/ChatGPT%20Image%20May%2015,%202026,%2009_12_38%20PM.png?auto=format&fit=crop&w=900&q=80" alt="Different Angles before example" /></div>
            <div class="example-body"><div class="font-black">Մինչև</div><div class="small">HANSORA AI</div></div>
          </div>
          <div class="example-card">
            <div class="example-media"><img src="https://qmaealblegvcwodlmeht.supabase.co/storage/v1/object/public/for%20the%20examples%20and%20news/Untitled%20folder/file_00000000f7e071f78f43a5f997a7ca2e.png?auto=format&fit=crop&w=1200&q=80" alt="Different Angles after example" /></div>
            <div class="example-body"><div class="font-black">Հետո</div><div class="small">Գեներացումից հետո արդյունքը կհայտնվի այստեղ։</div></div>
          </div>
        </div>
        <div id="resultsGrid" class="result-grid hidden"></div>
      </div>
    </section>
  </main>

  <div id="previewOverlay">
    <div class="preview-card">
      <button id="previewClose" class="preview-close" type="button">×</button>
      <img id="previewImage" alt="Նախադիտում" />
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://qmaealblegvcwodlmeht.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtYWVhbGJsZWd2Y3dvZGxtZWh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg2MjkzNzMsImV4cCI6MjA3NDIwNTM3M30.bUV6W0zBtkd_6gtfPGBSpskybUmpLC-1znljoDpYy4c';
  const supabaseClient = window.__HANSORA_SB__ || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  window.__HANSORA_SB__ = supabaseClient; window.hansoraSupabase = supabaseClient;
  const $ = (id)=>document.getElementById(id);
  let currentUser=null,currentCredits=0,mode='different_angles',selectedImages=[],aspectRatio='auto',pollTimer=null,pendingUploadSlot=null;
  const COST = 1.5;
  const EXAMPLES = {
    different_angles: {
      before: 'https://qmaealblegvcwodlmeht.supabase.co/storage/v1/object/public/for%20the%20examples%20and%20news/Untitled%20folder/ChatGPT%20Image%20May%2015,%202026,%2009_12_38%20PM.png?auto=format&fit=crop&w=900&q=80',
      after: 'https://qmaealblegvcwodlmeht.supabase.co/storage/v1/object/public/for%20the%20examples%20and%20news/Untitled%20folder/file_00000000f7e071f78f43a5f997a7ca2e.png?auto=format&fit=crop&w=1200&q=80'
    },
    expand: {
      before: 'https://qmaealblegvcwodlmeht.supabase.co/storage/v1/object/public/for%20the%20examples%20and%20news/Untitled%20folder/ChatGPT%20Image%20May%2015,%202026,%2009_02_37%20PM.png?auto=format&fit=crop&w=900&q=80',
      after: 'https://qmaealblegvcwodlmeht.supabase.co/storage/v1/object/public/for%20the%20examples%20and%20news/Untitled%20folder/ChatGPT%20Image%20May%2015,%202026,%2008_59_04%20PM.png?auto=format&fit=crop&w=1200&q=80'
    },
    face_swap: {
      before: 'https://qmaealblegvcwodlmeht.supabase.co/storage/v1/object/public/for%20the%20examples%20and%20news/Untitled%20folder/ChatGPT%20Image%20May%2019,%202026,%2005_39_48%20PM.png?auto=format&fit=crop&w=900&q=80',
      after: 'https://qmaealblegvcwodlmeht.supabase.co/storage/v1/object/public/for%20the%20examples%20and%20news/Untitled%20folder/ChatGPT%20Image%20May%2019,%202026,%2005_54_58%20PM.png?auto=format&fit=crop&w=1200&q=80'
    }
  };
  function parseCredits(value){const n=Number(String(value??'').replace(/[^\d.-]/g,''));return Number.isFinite(n)?n:0}
  function formatCredit(n){n=Number(n||0);return Number.isInteger(n)?String(n):n.toFixed(1).replace(/\.0$/,'')}
  function setCreditsEverywhere(value){currentCredits=parseCredits(value);document.querySelectorAll('#navCredits').forEach(n=>{n.textContent=`${formatCredit(currentCredits)}⚡`});if(window.HansoraHeader&&typeof window.HansoraHeader.setCredits==='function')window.HansoraHeader.setCredits(currentCredits)}
  function getVisibleHeaderCredits(){let best=0;document.querySelectorAll('#navCredits').forEach(n=>{best=Math.max(best,parseCredits(n.textContent||''))});return best}
  function getSharedHeaderCredits(){try{return window.HansoraHeader&&typeof window.HansoraHeader.getCurrentCredits==='function'?parseCredits(window.HansoraHeader.getCurrentCredits()):0}catch{return 0}}
  async function readSupabaseCredits(){const {data:{user}}=await supabaseClient.auth.getUser();if(!user)return{user:null,credits:0};const {data:profile,error}=await supabaseClient.from('profiles').select('credits').eq('user_id',user.id).maybeSingle();if(error)throw error;return{user,credits:parseCredits(profile&&profile.credits)}}
  async function getAvailableCredits(required=0){const localBest=Math.max(getSharedHeaderCredits(),getVisibleHeaderCredits(),parseCredits(currentCredits));if(localBest>=Number(required||0))return localBest;try{const r=await readSupabaseCredits();if(r.user){currentUser=r.user;setCreditsEverywhere(r.credits)}return Math.max(localBest,parseCredits(r.credits))}catch(e){console.warn(e)}return localBest}
  async function refreshCredits(){try{const r=await readSupabaseCredits();if(r.user){currentUser=r.user;setCreditsEverywhere(r.credits)}}catch(e){console.warn(e)}return currentCredits}
  function showError(msg){$('errorBox').textContent=msg;$('errorBox').classList.remove('hidden')}
  function clearError(){$('errorBox').textContent='';$('errorBox').classList.add('hidden')}
  function isImage(file){return String(file&&file.type||'').startsWith('image/')||/\.(png|jpe?g|webp)$/i.test(String(file&&file.name||''))}
  function shortName(name){const s=String(name||'image');return s.length>24?s.slice(0,12)+'....'+s.slice(-8):s}
  function maxImages(){return mode==='expand'?1:2}
  function modeTitle(){return mode==='different_angles'?'Different Angles':mode==='face_swap'?'Face Swap':'Expand'}
  function uploadLabel(idx){if(mode==='face_swap')return idx===0?'Սկզբնական պատկեր':'Նոր դեմք';return `Պատկեր ${idx+1}`}
  function dropLabel(){if(mode==='face_swap')return uploadLabel(selectedImages.length);return 'Ավելացնել պատկեր'}
  function uploadHint(){if(mode==='different_angles')return 'Վերբեռնեք 1–2 պատկեր։ Միայն պատկերներ։';if(mode==='face_swap')return 'Նախ վերբեռնեք սկզբնական պատկերը, ապա նոր դեմքի պատկերը։';return 'Վերբեռնեք 1 պատկեր։ Միայն պատկերներ։'}
  function syncMode(next){mode=next;$('anglesBtn').classList.toggle('active',mode==='different_angles');$('expandBtn').classList.toggle('active',mode==='expand');$('aspectBlock').classList.toggle('hidden',mode==='different_angles'||mode==='face_swap');$('uploadHint').textContent=uploadHint();$('boardTitle').textContent=modeTitle();if(selectedImages.length>maxImages())selectedImages=selectedImages.slice(0,maxImages());renderUploads();renderExamples()}
  function renderExamples(){if(!$('resultsGrid').classList.contains('hidden'))return;const ex=EXAMPLES[mode]||EXAMPLES.different_angles;$('examplesArea').innerHTML=`<div class="example-card"><div class="example-media"><img src="${escapeHtml(ex.before)}" alt="${escapeHtml(modeTitle())}՝ սկզբնական պատկեր" /></div><div class="example-body"><div class="font-black">Մինչև</div><div class="small">Սկզբնական պատկեր</div></div></div><div class="example-card"><div class="example-media"><img src="${escapeHtml(ex.after)}" alt="${escapeHtml(modeTitle())}՝ արդյունք" /></div><div class="example-body"><div class="font-black">Հետո</div><div class="small">HANSORA AI</div></div></div>`}
  function visibleUploadSlots(){if(mode==='face_swap')return 2;if(mode==='expand')return 1;return selectedImages.length>0?2:1}
  function renderUploads(){const grid=$('uploadGrid');grid.innerHTML='';for(let idx=0;idx<visibleUploadSlots();idx++){const item=selectedImages[idx];if(item){const div=document.createElement('div');div.className='thumb';div.innerHTML=`<img src="${escapeHtml(item.preview)}" alt="${escapeHtml(uploadLabel(idx))}" /><button type="button" class="remove" data-remove="${idx}">×</button><div class="file-name">${escapeHtml(uploadLabel(idx))} • ${escapeHtml(shortName(item.file.name))}</div>`;grid.appendChild(div);continue}const drop=document.createElement('div');drop.className='drop';drop.dataset.slot=idx;drop.innerHTML=`<div><div class="plus">+</div><div class="font-black">${escapeHtml(mode==='face_swap'?uploadLabel(idx):'Ավելացնել պատկեր')}</div><div class="small">Միայն պատկերներ</div></div>`;grid.appendChild(drop);wireDrop(drop)}grid.querySelectorAll('[data-remove]').forEach(btn=>btn.addEventListener('click',e=>{const i=Number(e.currentTarget.dataset.remove);const item=selectedImages[i];if(item&&item.preview)URL.revokeObjectURL(item.preview);selectedImages.splice(i,1);renderUploads()}))}
  function wireDrop(drop){const input=$('imageInput');drop.addEventListener('click',()=>{pendingUploadSlot=Number(drop.dataset.slot||selectedImages.length);input.click()});['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>{const files=Array.from(e.dataTransfer&&e.dataTransfer.files||[]);addFiles(files,Number(drop.dataset.slot||selectedImages.length))})}
  function addFiles(files,startSlot){clearError();const valid=Array.from(files||[]).filter(isImage);if(!valid.length){showError('Վերբեռնեք միայն պատկերային ֆայլեր։');return}let slot=Number.isFinite(startSlot)?startSlot:selectedImages.length;for(const file of valid){while(slot<maxImages()&&selectedImages[slot])slot++;if(slot>=maxImages())break;selectedImages[slot]={file,preview:URL.createObjectURL(file)};slot++}selectedImages=selectedImages.slice(0,maxImages());renderUploads()}
  async function ensureUser(){const {data:{user}}=await supabaseClient.auth.getUser();currentUser=user||null;if(!currentUser)throw new Error('Նախ մուտք գործեք։');return currentUser}
  async function submit(){clearError();const btn=$('runBtn'),old=btn.textContent;try{const user=await ensureUser();const chosen=selectedImages.filter(Boolean);if(chosen.length<1)throw new Error('Նախ վերբեռնեք պատկերը։');if(mode==='different_angles'&&chosen.length>2)throw new Error('Different Angles-ը ընդունում է 1–2 պատկեր։');if(mode==='expand'&&chosen.length!==1)throw new Error('Expand-ը ընդունում է 1 պատկեր։');if(mode==='face_swap'&&(!selectedImages[0]||!selectedImages[1]))throw new Error('Face Swap-ի համար անհրաժեշտ է 2 պատկեր՝ նախ սկզբնական պատկերը, ապա նոր դեմքը։');const available=await getAvailableCredits(COST);if(available<COST)throw new Error(`Կրեդիտները բավարար չեն։ Անհրաժեշտ է ${formatCredit(COST)} կրեդիտ։`);if(!window.kieUploadBridge||typeof window.kieUploadBridge.upload!=='function')throw new Error('upload_bridge_missing');const session=await supabaseClient.auth.getSession();const token=session?.data?.session?.access_token||'';if(!token)throw new Error('Կրկին մուտք գործեք։');btn.disabled=true;btn.textContent='Վերբեռնվում է...';const uploaded=[];for(const item of chosen){const up=await window.kieUploadBridge.upload(item.file);if(!up||!up.publicUrl)throw new Error('upload_failed');uploaded.push(up.publicUrl)}const runId=`${user.id}-image-tools-${Date.now()}`;const body={uid:user.id,run_id:runId,tool:mode,imageUrls:uploaded,fileName:chosen.map(x=>x.file.name).join(', '),fileType:'image',aspectRatio:mode==='different_angles'?'16:9':mode==='face_swap'?'auto':aspectRatio};addPending(runId);btn.textContent='Ուղարկվում է...';const resp=await fetch('/.netlify/functions/run-image-tools',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify(body)});const data=await resp.json().catch(()=>({}));if(!data.submitted)throw new Error(data.error||'submit_failed');await refreshCredits();if(window.HansoraHeader&&typeof window.HansoraHeader.startCreditsPolling==='function')window.HansoraHeader.startCreditsPolling(90000,1500);startPolling()}catch(err){showError(String(err.message||err))}finally{btn.disabled=false;btn.textContent=old}}
  function showResults(){ $('examplesArea').classList.add('hidden'); $('resultsGrid').classList.remove('hidden') }
  function maybeShowExamples(rows){if(rows.length){showResults()}else{$('resultsGrid').classList.add('hidden');$('examplesArea').classList.remove('hidden');renderExamples()}}
  function addPending(runId){showResults();const div=document.createElement('div');div.className='result-card';div.dataset.runId=runId;div.dataset.tool=mode;div.innerHTML=`<div class="result-media"><div class="processing-state processing-card"><div class="processing-orb"></div><div>Մշակվում է...</div></div></div><div class="result-body"><div class="flex items-center justify-between gap-2"><div class="font-black safe">${escapeHtml(modeTitle())}</div><span class="dot"></span></div><div class="small safe mt-1">Գեներացվում է...</div></div>`;$('resultsGrid').prepend(div)}
  function isUsableUrl(url){const v=String(url||'').trim().toLowerCase();return /^https?:\/\//.test(v)&&!v.includes('callback')}
  function collectUrls(row){const meta=row.meta||{};const arr=[];if(row.result_url)arr.push(row.result_url);if(meta.result_url)arr.push(meta.result_url);if(Array.isArray(meta.result_urls))arr.push(...meta.result_urls);if(Array.isArray(meta.urls))arr.push(...meta.urls);return [...new Set(arr.filter(isUsableUrl))]}
  function downloadName(name){const base=String(name||'hansora-image-tools').replace(/\.[a-z0-9]{2,5}$/i,'').replace(/[^a-z0-9._-]+/gi,'-').replace(/^-+|-+$/g,'').slice(0,80)||'hansora-image-tools';return `${base}.png`}
  async function downloadMedia(url,name,btn){const old=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent='Ներբեռնվում է...'}try{const res=await fetch(url,{mode:'cors'});if(!res.ok)throw new Error('download_failed');const blob=await res.blob();const objectUrl=URL.createObjectURL(blob);const a=document.createElement('a');a.href=objectUrl;a.download=downloadName(name);document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),1200)}catch(e){const a=document.createElement('a');a.href=url;a.download=downloadName(name);document.body.appendChild(a);a.click();a.remove()}finally{if(btn){btn.disabled=false;btn.textContent=old||'Ներբեռնել'}}}
  function openPreview(url){$('previewImage').src=url;$('previewOverlay').classList.add('show')}
  function closePreview(){$('previewOverlay').classList.remove('show');$('previewImage').src=''}
  async function loadRecentHistory(){if(!currentUser)return;const {data,error}=await supabaseClient.from('user_generations').select('provider,kind,prompt,result_url,meta,created_at').eq('user_id',currentUser.id).eq('kind','image_tools').order('created_at',{ascending:false}).limit(12);if(error)return;const rows=data||[];$('resultsGrid').innerHTML='';maybeShowExamples(rows);rows.forEach(row=>{const meta=row.meta||{},urls=collectUrls(row),url=urls[0]||'',status=url?'ready':String(meta.status||'processing'),tool=String(meta.tool||'different_angles'),name=tool==='expand'?'Expand':tool==='face_swap'?'Face Swap':'Different Angles',fileName=meta.file_name||name;const media=url?`<div class="result-media preview-open"><img src="${escapeHtml(url)}" alt="արդյունք" /></div>`:`<div class="result-media"><div class="processing-state${status==='failed'?'':' processing-card'}">${status==='failed'?'<div>Սխալ</div>':'<div class="processing-orb"></div><div>Մշակվում է...</div>'}</div></div>`;const div=document.createElement('div');div.className='result-card';div.dataset.tool=tool;div.innerHTML=`${media}<div class="result-body"><div class="flex items-center justify-between gap-2"><div class="font-black safe">${escapeHtml(name)}</div><span class="dot ${url?'ready':status==='failed'?'failed':''}"></span></div><div class="small safe mt-1">${escapeHtml(fileName)}</div>${url?'<div class="mt-3"><button class="get" type="button">Ներբեռնել</button></div>':''}</div>`;if(url){div.querySelector('.preview-open').addEventListener('click',()=>openPreview(url));div.querySelector('.get').addEventListener('click',(e)=>downloadMedia(url,fileName,e.currentTarget))}$('resultsGrid').appendChild(div)})}
  function shouldCheckRow(row){const meta=row&&row.meta?row.meta:{};const status=String(meta.status||'').toLowerCase();if(status==='failed'||status==='error'||status==='refunded')return false;return collectUrls(row).length===0&&!!(meta.run_id||meta.runId)&&!!(meta.task_id||meta.taskId)}
  async function hitCheck(row){if(!currentUser||!shouldCheckRow(row))return false;const meta=row.meta||{};const runId=meta.run_id||meta.runId||'',taskId=meta.task_id||meta.taskId||'';try{await fetch(`/.netlify/functions/image-tools-check?uid=${encodeURIComponent(currentUser.id)}&run_id=${encodeURIComponent(runId)}&taskId=${encodeURIComponent(taskId)}`,{method:'GET',cache:'no-store',headers:{'Accept':'application/json'}});return true}catch{return false}}
  async function checkPending(){if(!currentUser)return 0;const {data,error}=await supabaseClient.from('user_generations').select('result_url,meta,created_at').eq('user_id',currentUser.id).eq('kind','image_tools').order('created_at',{ascending:false}).limit(30);if(error)return 0;const rows=(data||[]).filter(shouldCheckRow);let checked=0;await Promise.all(rows.map(async row=>{if(await hitCheck(row))checked++}));return checked}
  function startPolling(){if(pollTimer)clearInterval(pollTimer);let ticks=0;const runOnce=async()=>{ticks++;const p=await checkPending();await loadRecentHistory();if((p===0&&ticks>2)||ticks>80){clearInterval(pollTimer);pollTimer=null}};runOnce();pollTimer=setInterval(runOnce,3000)}
  async function refreshReadyResults(){if(!currentUser)return;await loadRecentHistory();const pending=await checkPending();if(pending>0){await loadRecentHistory();startPolling()}}
  function escapeHtml(str){return String(str||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  async function init(){renderUploads();$('imageInput').addEventListener('change',()=>{addFiles($('imageInput').files,pendingUploadSlot);pendingUploadSlot=null;$('imageInput').value=''});$('anglesBtn').addEventListener('click',()=>syncMode('different_angles'));$('expandBtn').addEventListener('click',()=>syncMode('expand'));document.querySelectorAll('[data-aspect]').forEach(b=>b.addEventListener('click',()=>{aspectRatio=b.dataset.aspect;document.querySelectorAll('[data-aspect]').forEach(x=>x.classList.toggle('active',x===b))}));$('runBtn').addEventListener('click',submit);$('refreshResultsBtn').addEventListener('click',async()=>{await refreshReadyResults()});$('previewClose').addEventListener('click',closePreview);$('previewOverlay').addEventListener('click',e=>{if(e.target===$('previewOverlay'))closePreview()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePreview()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&currentUser){refreshReadyResults().catch(()=>{})}});window.addEventListener('focus',()=>{if(currentUser){refreshReadyResults().catch(()=>{})}});const {data:{user}}=await supabaseClient.auth.getUser();currentUser=user||null;if(currentUser){loadRecentHistory().catch(()=>{});refreshCredits().catch(()=>{});refreshReadyResults().catch(()=>{})}if(window.HansoraHeader&&typeof window.HansoraHeader.init==='function'){try{window.HansoraHeader.init({supabaseClient})}catch{}}syncMode('different_angles')}
  init();
</script>
