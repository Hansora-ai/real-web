  <style>
    :root{
      --base-bg:#050714;
      --base-line:#15182a;
      --brand:#6366f1;
      --brand-soft:rgba(99,102,241,.12);
    }
    body{
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(99,102,241,.18), transparent 60%),
        radial-gradient(1200px 600px at 100% 100%, rgba(56,189,248,.14), transparent 60%),
        var(--base-bg);
      color:#e5e7eb;
      font-family:system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }
    .bg-base-bg{background:var(--base-bg)}
    .border-base-line{border-color:var(--base-line)}
    .btn-soft{
      border-radius:9999px;
      border:1px solid rgba(148,163,184,.35);
      background:radial-gradient(circle at 0 0,#1f2937, #020617);
      color:#e5e7eb;
    }
    .btn-soft:hover{
      border-color:rgba(129,140,248,.9);
      background:radial-gradient(circle at 0 0,#111827,#020617);
    }
    .btn-brand{
      border-radius:9999px;
      border:0;
      background:linear-gradient(135deg,#6366f1,#8b5cf6);
      color:white;
      box-shadow:0 10px 30px rgba(79,70,229,.55);
    }
    .btn-brand:hover{
      background:linear-gradient(135deg,#7c7ff6,#a855f7);
      box-shadow:0 14px 40px rgba(79,70,229,.75);
    }
    .chip{
      border-radius:9999px;
      border:1px solid rgba(148,163,184,.4);
      background:rgba(15,23,42,.9);
      color:#e5e7eb;
    }
    .chip-active{
      background:linear-gradient(135deg,#6366f1,#8b5cf6);
      border-color:transparent;
      color:white;
      box-shadow:0 8px 22px rgba(79,70,229,.6);
    }
    .shadow-soft{box-shadow:0 18px 55px rgba(0,0,0,.75)}
    #navAvatar{
      background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 128 128%22><defs><linearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22><stop offset=%220%25%22 stop-color=%2291c1ff%22/><stop offset=%22100%25%22 stop-color=%225a8cff%22/></linearGradient></defs><circle cx=%2264%22 cy=%2264%22 r=%2264%22 fill=%22url(%23g)%22/><circle cx=%2264%22 cy=%2250%22 r=%2222%22 fill=%22white%22 fill-opacity=%22.9%22/><path d=%22M20 108a44 30 0 0 1 88 0%22 fill=%22white%22 fill-opacity=%22.9%22/></svg>');
      background-size:cover;
      background-position:center;
    }
    textarea#promptBox{
      resize:none;
    }
    .result-card-loader{
      width:24px;
      height:24px;
      border-radius:9999px;
      border:3px solid rgba(148,163,184,.5);
      border-top-color:#a855f7;
      animation:spin 1s linear infinite;
    }
    @keyframes spin{
      to{ transform:rotate(360deg); }
    }
    .clamp-2{
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
  
    /* Mobile compact UI tweaks (UI only) */
    @media (max-width: 767px) {
      /* Make generator card compact */
      #generatorCard { padding: 12px !important; }
      #generatorCard .sm\:space-y-3 { row-gap: 10px !important; }
      /* Hide large pill blocks on mobile (use compact pickers instead) */
      #aspectBlock, #durationBlock { display: none !important; }
      /* Thumbs scroll instead of overflow */
      #imageThumbs { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      #imageThumbs > div { flex: 0 0 auto; }
      /* Run button full width + centered */
      #runBtn { width: 100% !important; min-height: 48px !important; }
      /* Reduce vertical gaps under upload row */
      #uploadBtn { margin-top: 6px !important; }
      /* Reduce extra spacing in Cost+Run block */
      #costLabel { margin-bottom: 4px !important; }
    
      /* Mobile redesign: remove hero + make page fully scrollable (settings in flow) */
      body{ background: var(--base-bg) !important; }
      #heroSection{ display:none !important; }
      #generatorDock{ position: static !important; inset: auto !important; padding: 12px 16px 0 !important; }
      #generatorDock > #generatorCard{ width: 100% !important; max-width: 100% !important; }
      main{ padding-bottom: 16px !important; }
      /* Keep generator compact and avoid big gaps */
      #generatorCard{ border-radius: 24px !important; }
      #generatorCard .space-y-3{ row-gap: 10px !important; }

      /* Make whole mobile page scroll (not only main) */
      body{ overflow-y:auto !important; }
      main{ overflow: visible !important; flex: 0 0 auto !important; }

      
      /* Results section (mobile): 2:3 viewport + horizontal swipe (peek next card) */
      #resultsSection{ display:block !important; padding-top: 12px !important; padding-bottom: 24px !important; }

      /* Container is a 2:3 window that scrolls horizontally */
      #resultsStrip{
        border: 1px solid rgba(255,255,255,.10) !important;
        background: rgba(2,6,23,.45) !important;
        border-radius: 22px !important;

        padding: 10px !important;

        aspect-ratio: 2 / 3;
        width: 100% !important;

        display: flex !important;
        gap: 12px !important;

        overflow-x: auto !important;
        overflow-y: hidden !important;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        scroll-snap-type: x mandatory;
        scroll-padding-left: 10px;

        /* makes the next card "peek" ~25% */
        padding-right: 22% !important;
      }

      #resultsStrip.empty{
        justify-content: center !important;
        align-items: center !important;
      }

      /* Each thumb becomes a 2:3 card (newest full, next card peeks) */
      #resultsStrip .result-thumb{
        position: relative;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.10);
        background: rgba(15,23,42,.55);

        flex: 0 0 78%;
        aspect-ratio: 2 / 3;
        scroll-snap-align: start;
      }
#resultsStrip .result-thumb img,
      #resultsStrip .result-thumb video{
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: rgba(2,6,23,.85);
        display:block;
      }
      #resultsStrip .thumb-badge{
        position:absolute;
        top:8px;
        left:8px;
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,.12);
        background: rgba(2,6,23,.70);
        color: rgba(255,255,255,.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      #resultsStrip .thumb-status{
        position:absolute;
        bottom:8px;
        left:8px;
        right:8px;
        display:flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: rgba(255,255,255,.78);
      }
      #resultsStrip .thumb-status-extended{
        flex-direction: column;
        align-items: stretch;
        padding: 8px 10px;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,.10);
        background: rgba(2,6,23,.72);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      #resultsStrip .thumb-row{
        display:flex;
        align-items:flex-end;
        justify-content: space-between;
        gap: 10px;
      }
      #resultsStrip .thumb-meta{
        display:flex;
        flex-direction: column;
        min-width: 0;
        gap: 2px;
      }
      #resultsStrip .thumb-model{
        font-size: 11px;
        font-weight: 600;
        color: rgba(255,255,255,.88);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 220px;
      }
      #resultsStrip .thumb-prompt{
        font-size: 10px;
        color: rgba(255,255,255,.65);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 220px;
      }
      #resultsStrip .thumb-actions{
        display:flex;
        align-items:center;
        justify-content:flex-end;
        gap: 8px;
        flex-shrink: 0;
      }
      #resultsStrip .thumb-state{
        font-size: 10px;
        color: rgba(255,255,255,.75);
      }
      #resultsStrip .thumb-state.ready{ color: rgba(110,231,183,.95); }
      #resultsStrip .thumb-state.failed{ color: rgba(248,113,113,.95); }
      #resultsStrip .thumb-get{
        font-size: 10px;
        padding: 5px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,.14);
        background: rgba(99,102,241,.22);
        color: rgba(255,255,255,.92);
      }
      #resultsStrip .thumb-get:active{ transform: translateY(1px); }

      #resultsStrip .empty-placeholder{
        width:100%;
        height:100%;
        border-radius: 18px;
        border: 1px dashed rgba(255,255,255,.18);
        display:flex;
        align-items:center;
        justify-content:center;
        text-align:center;
        color: rgba(255,255,255,.55);
        padding: 14px;
      }
      #resultsStrip .empty-placeholder .inner{
        max-width: 220px;
      }
      #resultsStrip .empty-placeholder .icon{
        width: 54px;
        height: 54px;
        margin: 0 auto 10px;
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,.12);
        background: rgba(99,102,241,.12);
        display:flex;
        align-items:center;
        justify-content:center;
        color: rgba(255,255,255,.80);
        font-weight: 700;
      }
      #resultsStrip .result-card-loader{
        position:absolute;
        inset:0;
        display:flex;
        align-items:center;
        justify-content:center;
      }

}

    .opt-btn{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:9999px;
      border:1px solid rgba(255,255,255,.15);

    }
    .opt-btn:active{ transform: translateY(1px); }

    /* Fullscreen preview overlay (click media shows, download only via Get) */
    #previewOverlay{
      position:fixed;
      inset:0;
      z-index:60;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 18px;
    }
    #previewOverlay.show{ display:flex; }
    #previewOverlay .preview-card{
      width: min(920px, 100%);
      max-height: min(88vh, 900px);
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(2,6,23,.88);
      box-shadow: 0 30px 90px rgba(0,0,0,.75);
      overflow:hidden;
      position: relative;
    }
    #previewOverlay .preview-close{
      position:absolute;
      top:10px;
      right:10px;
      width:40px;
      height:40px;
      border-radius:999px;

      background: rgba(0,0,0,.45);
      color: rgba(255,255,255,.9);

      align-items:center;
      justify-content:center;

    }
    #previewOverlay .preview-media{
      width:100%;
      height:100%;
      max-height: min(88vh, 900px);
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,.35);
    }
    #previewOverlay img,
    #previewOverlay video{
      max-width:100%;
      max-height: min(88vh, 900px);
      object-fit: contain;
    }

    /* Workspace redesign: left creation panel + model browser */

    .preset-card{

      min-height:260px;

      inset:0;
      background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.72));

      width:100%;

// --- MidJourney multi-image support via nb-check (no callback changes) ---
function __mjCacheKey(runId){ return `mj_urls_${runId}`; }
function __mjLoadCached(runId){
  try{ const v = localStorage.getItem(__mjCacheKey(runId)); if(!v) return null;
    const a = JSON.parse(v); return Array.isArray(a) ? a : null;
  }catch(_e){ return null; }
}
function __mjSaveCached(runId, urls){
  try{ if(!runId || !Array.isArray(urls) || !urls.length) return;
    localStorage.setItem(__mjCacheKey(runId), JSON.stringify(urls.slice(0,4)));
  }catch(_e){}
}
function __mjTryExtractAllImageUrls(obj){
  const out=[]; const seen=new Set();
  const push=(u)=>{ if(typeof u!=='string') return; if(!/^https?:\/\//i.test(u)) return;
    if(seen.has(u)) return; seen.add(u); out.push(u); };
  const walk=(x,depth=0)=>{
    if(!x || depth>7) return;
    if(typeof x==='string'){ push(x); return; }
    if(Array.isArray(x)){ for(const it of x) walk(it, depth+1); return; }
    if(typeof x==='object'){
      for(const k of ['image_urls','images','result_urls','results','output','outputs','data','urls','url']){
        if(Object.prototype.hasOwnProperty.call(x,k)) walk(x[k], depth+1);
      }
      let n=0;
      for(const k in x){
        if(!Object.prototype.hasOwnProperty.call(x,k)) continue;
        if(n++>60) break;
        walk(x[k], depth+1);
      }
    }
  };
  walk(obj);
  return out.slice(0,4);
}
async function __mjFetchNbCheck(params){
  // params: { taskId?, uid?, runId? }
  const taskId = params && params.taskId ? String(params.taskId) : '';
  const uid = params && params.uid ? String(params.uid) : '';
  const runId = params && params.runId ? String(params.runId) : '';
  let url = '';
  if (taskId) {
    url = `/.netlify/functions/nb-check?taskId=${encodeURIComponent(taskId)}&uid=${encodeURIComponent(uid)}&run_id=${encodeURIComponent(runId)}`;
  }
  else url = `/.netlify/functions/nb-check?uid=${encodeURIComponent(uid)}&run_id=${encodeURIComponent(runId)}`;
  const r = await fetch(url, { method:'GET', headers:{ 'Accept':'application/json' } });
  const t = await r.text();
  let js; try{ js = JSON.parse(t); }catch{ js = { raw:t }; }
  return { ok:r.ok, status:r.status, js };
}

    async function __extractResultUrls(row) {
  // MidJourney: if DB row doesn't carry all 4 URLs, use nb-check (taskId preferred) + local cache.
  // For all models: attempt to extract multiple URLs from meta in a best-effort way.
  const dedupe = (arr) => {
    const out = [];
    const seen = new Set();
    (arr || []).forEach((u) => {
      if (typeof u !== 'string') return;
      const s = u.trim();
      if (!s) return;
      if (!/^https?:\/\//i.test(s)) return;
      if (seen.has(s)) return;
      seen.add(s);
      out.push(s);
    });
    return out;
  };

  try {
    const prov = String((row && (row.provider || row.model)) || '');
    const isMJ = prov.toLowerCase().includes('midjourney') && String((row && row.kind) || '').toLowerCase() === 'image';
    const runId = (row && row.meta && row.meta.run_id) ? row.meta.run_id : (row && row.run_id) ? row.run_id : '';
    const taskId = (row && row.meta && (row.meta.task_id || row.meta.taskId)) ? (row.meta.task_id || row.meta.taskId) : '';
    const meta = row && row.meta ? row.meta : null;

    // --- MidJourney: try cache first
    if (isMJ && runId) {
      const cached = __mjLoadCached(runId);
      if (cached && cached.length) return cached.slice(0, 4);
    }

    // --- Extract from meta (deep walk)
    let urls = [];
    try {
      if (meta) {
        // Prefer explicit arrays in common fields
        const candidates = [];
        const pushMany = (arr) => { if (Array.isArray(arr)) arr.forEach((u) => candidates.push(u)); };
        pushMany(meta.images);
        pushMany(meta.image_urls);
        pushMany(meta.result_urls);
        // Some providers store arrays nested
        if (meta.result && meta.result.images) pushMany(meta.result.images);
        if (meta.output && meta.output.images) pushMany(meta.output.images);

        // Deep walk as fallback (covers meta.result_url, meta.urls, nested objects, etc.)
        const walked = __mjTryExtractAllImageUrls(meta); // returns up to 4, already filters to URLs
        urls = dedupe([...(candidates || []), ...(walked || [])]);
      }
    } catch (_e) {}

    // --- Fallback to row.result_url (single)
    if ((!urls || !urls.length) && row && typeof row.result_url === 'string' && row.result_url.trim()) {
      urls = dedupe([row.result_url]);
    }

    // --- MidJourney: if still missing URLs, call nb-check and merge
    if (isMJ && runId && (!urls || urls.length < 4)) {
      try {
        const nb = await __mjFetchNbCheck({ taskId, uid: (currentUser ? currentUser.id : ''), runId });
        if (nb && nb.ok) {
          const more = __mjTryExtractAllImageUrls(nb.js);
          const merged = dedupe([...(urls || []), ...(more || [])]);
          if (merged && merged.length) {
            __mjSaveCached(runId, merged);
            return merged.slice(0, 4);
          }
        }
      } catch (_e) {}
    }

    // Return up to 4 (MJ) or as-is (other models typically 1)
    return (urls || []).slice(0, 4);
  } catch (e) {
    return [];
  }
}



const __activePolls = new Map(); // runId -> token

function startPollGeneration(runId, controllers, taskId) {
  if (!runId || !controllers || !controllers.length) return;
  if (__activePolls.has(runId)) return; // already polling this run
  const token = { cancelled: false };
  __activePolls.set(runId, token);
  // Fire and forget; cleanup when done
  pollGeneration(runId, controllers, token, taskId)
    .catch((e) => console.warn('pollGeneration wrapper exception', e))
    .finally(() => {
      __activePolls.delete(runId);
    });
}

function startSora2Poll(taskId, uid, runId, controllers) {
  if (!taskId || !uid || !runId || !controllers || !controllers.length) return;
  const key = 'sora2:' + runId;
  if (__activePolls.has(key)) return;
  const token = { cancelled: false };
  __activePolls.set(key, token);
  sora2Poll(taskId, uid, runId, controllers, token).finally(() => {
    __activePolls.delete(key);
  });
}

// Poll Sora 2 via Netlify function sora2-check (15 minutes max)
async function sora2Poll(taskId, uid, runId, controllers, token) {
  const deadline = Date.now() + (15 * 60 * 1000);
  while (Date.now() < deadline) {
    if (token && token.cancelled) return;
    try {
      const r = await fetch('/.netlify/functions/sora2-check?taskId=' + encodeURIComponent(taskId) + '&uid=' + encodeURIComponent(uid) + '&run_id=' + encodeURIComponent(runId), { cache: 'no-store' });
      const j = await r.json().catch(() => null);
      if (j && j.ok && (j.video_url || j.result_url)) {
        const url = j.video_url || j.result_url;
        for (let i = 0; i < controllers.length; i++) {
          controllers[i].apply({ status: 'ready', result_url: url });
        }
        return;
      }
      if (j && j.failed) {
        for (let i = 0; i < controllers.length; i++) {
          controllers[i].apply({ status: 'failed', result_url: null });
        }
        return;
      }
    } catch (e) {}
    await new Promise(res => setTimeout(res, 1500));
  }
  // timeout -> mark as processing still (do not fail automatically)
}


async function pollGeneration(runId, controllers, token, taskId) {
  if (!currentUser || !runId || !controllers || !controllers.length) return;
  const maxMs = 900000;
  const started = Date.now();
  while (Date.now() - started < maxMs) {
    await new Promise((r) => setTimeout(r, 3000));
    if (token && token.cancelled) return;
    try {
      if (taskId) {
        const nb = await __mjFetchNbCheck({ taskId, uid: currentUser.id, runId });
        const nbStatus = String(nb?.js?.status || '').toLowerCase();
        const nbFailed = !!nb?.js?.failed || nbStatus.includes('fail') || nbStatus.includes('error') || nbStatus.includes('cancel');
        if (nbFailed) {
          const message = nb?.js?.error ? `❌ Generation failed: ${nb.js.error}` : '❌ Generation failed. Credits refunded.';
          showStatus(message, 'error');
          await refreshCredits();
          for (let i = 0; i < controllers.length; i++) {
            controllers[i].apply({ status: 'failed', result_url: null });
          }
          return;
        }
      }

      const { data, error } = await supabaseClient
        .from('user_generations')
        .select('provider, kind, prompt, result_url, meta, created_at')
        .eq('user_id', currentUser.id)
        .eq('meta->>run_id', runId)
        .order('created_at', { ascending: false })
        .limit(1)
        .maybeSingle();

      if (error) {
        console.warn('pollGeneration error', error);
        break;
      }
      if (!data) continue;

      const status = data.meta && data.meta.status ? data.meta.status : (data.result_url ? 'ready' : 'processing');
      const urls = await __extractResultUrls(data);

      // Apply to 1..N placeholder cards
      const expected = controllers.length || 1;
      if (urls && urls.length) {
        // For multi-output models (e.g., Midjourney image), keep missing slots in "processing"
        // until we have all expected URLs (or until timeout).
        for (let i = 0; i < expected; i++) {
          const u = urls[i] || null;
          controllers[i].apply({
            status: u ? status : 'processing',
            result_url: u
          });
        }
      } else {
        for (let i = 0; i < expected; i++) {
          controllers[i].apply({ status: status });
        }
      }

      // Stop conditions:
      // - Fail/Error: stop immediately
      // - Single-output: stop when we have any URL
      // - Multi-output: stop only when we have all expected URLs
      const isFail = status.toLowerCase().includes('fail') || status.toLowerCase().includes('error');
      if (isFail) {
        await refreshCredits();
        watchCreditsLive(30000);
        return;
      }

      if (urls && urls.length) {
        if (expected <= 1) {
          await refreshCredits();
          return;
        }

        let filled = 0;
        for (let i = 0; i < expected; i++) if (urls[i]) filled++;
        if (filled >= expected) {
          // Ensure all are marked ready at the end
          for (let i = 0; i < expected; i++) {
            controllers[i].apply({ status: status, result_url: urls[i] || null });
          }
          await refreshCredits();
          return;
        }
      }
    } catch (e) {
      console.warn('pollGeneration exception', e);
      break;
    }
  }
}

    function openMobilePicker(type) {
      const overlay = document.getElementById('mobileOptionOverlay');
      const title = document.getElementById('mobileOptionTitle');
      const list = document.getElementById('mobileOptionList');
      if (!overlay || !title || !list || !currentModel) return;

      let options = [];
      let current = null;

      if (type === 'aspect') {
        options = (currentModel.aspectOptions || []).slice();
        current = String(currentAspect || '');
        title.textContent = 'Aspect ratio';
      } else if (type === 'duration') {
        // Only allow for proper video models
        if (!(currentModel.category === 'video' && Array.isArray(currentModel.durations) && currentModel.durations.length)) return;
        options = currentModel.durations.map((v) => String(v));
        current = String(currentDuration != null ? currentDuration : '');
        title.textContent = 'Duration';
      } else {
        return;
      }

      list.innerHTML = '';
      options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className =
          'w-full flex items-center justify-between rounded-2xl border border-white/10 bg-slate-900/40 px-4 py-3 text-sm hover:bg-slate-900/60';
        const left = document.createElement('span');

        const right = document.createElement('span');
        right.className = 'text-white/60';
        right.textContent = String(opt) === String(current) ? 'Selected' : '';
        btn.appendChild(left);
        btn.appendChild(right);

        btn.addEventListener('click', () => {

            currentAspect = opt;
            // sync desktop pills if present
            const aspectPills = document.getElementById('aspectPills');
            if (aspectPills) {
              Array.from(aspectPills.children).forEach((child) => {
                child.classList.toggle('chip-active', child.textContent === opt);
              });
            }
          } else if (type === 'duration') {
            currentDuration = opt;
            updateRunButtonLabel();

            if (durationPills) {
              Array.from(durationPills.children).forEach((child) => {

      });

    // Wire mobile picker events (UI only)
    // NOTE: This script tag appears before the picker HTML in the document,
    // so we must (re)bind after DOMContentLoaded as well.
    function wireMobilePickersOnce() {
      if (wireMobilePickersOnce._done) return;

      const arBtn = document.getElementById('mobileAspectBtn');
      const durBtn = document.getElementById('mobileDurationBtn');
      const closeBtn = document.getElementById('mobileOptionClose');
      const bg = document.getElementById('mobileOptionOverlayBg');
      const overlay = document.getElementById('mobileOptionOverlay');

      // If the picker HTML is not in the DOM yet, try again after DOMContentLoaded.
      if (!overlay) return;

      if (arBtn) arBtn.addEventListener('click', () => openMobilePicker('aspect'));
      if (durBtn) durBtn.addEventListener('click', () => openMobilePicker('duration'));
      if (closeBtn) closeBtn.addEventListener('click', closeMobilePicker);
      if (bg) bg.addEventListener('click', closeMobilePicker);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeMobilePicker();
      });

      wireMobilePickersOnce._done = true;
    }

      // For select multi-image models, append new files instead of replacing existing ones.
      if (__MULTI_APPEND_IMAGE_MODELS.has(currentModel.id) && max > 1) {

    // Drag & Drop support: drop images anywhere on the generator bar to upload
    (function __enableGeneratorDragDrop() {
      const dock = document.getElementById('generatorCard') || document.getElementById('generatorDock');
      if (!dock) return;

      const prevent = (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
      };

      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach((t) => {
        dock.addEventListener(t, prevent);
      });

      dock.addEventListener('drop', (ev) => {
        try {
          const dt = ev.dataTransfer;
          const dropped = Array.from((dt && dt.files) ? dt.files : []).filter(
            (f) => (f && f.type && f.type.startsWith('image/'))
          );
          if (!dropped.length) return;
          if (!currentModel) return;

          // Do not interfere with frame-based video models (start/last frame) or Aleph video upload UI
          if (currentModel.useFrames || currentModel.needsVideo) return;

          const max = currentModel.maxFiles || 1;

          // Multi-image models: append; single-image models: replace
          if (__MULTI_APPEND_IMAGE_MODELS.has(currentModel.id) && max > 1) {
            uploadedFiles = (uploadedFiles || []).concat(dropped).slice(0, max);
          } else {
            uploadedFiles = dropped.slice(0, max);
          }

          __renderImageThumbs();

          // Allow dropping the same file again later in some browsers
          const imageInput = document.getElementById('imageInput');
          if (imageInput) imageInput.value = '';
        } catch (e) {
          console.warn('drag-drop upload failed', e);
        }
      });
    })();




    function wireUploadTileClicks() {
      const pairs = [
        ['framesUploadWrap', 'startFrameInput', 0],
        ['framesUploadWrap', 'lastFrameInput', 1],
        ['alephUploadWrap', 'alephVideoInput', 0],
        ['alephUploadWrap', 'alephImageInput', 1],
      ];
      pairs.forEach(([wrapId, inputId, index]) => {
        const wrap = document.getElementById(wrapId);
        const input = document.getElementById(inputId);
        const tile = wrap && wrap.children ? wrap.children[index] : null;
        if (!tile || !input || tile.dataset.tileWired) return;
        tile.dataset.tileWired = 'true';
        tile.addEventListener('click', (event) => {
          if (event.target && event.target.closest && event.target.closest('button')) return;
          input.click();
        });
        if (wrapId === 'framesUploadWrap') {
          const frameKind = index === 0 ? 'start' : 'last';
          ['dragenter', 'dragover'].forEach((type) => {
            tile.addEventListener(type, (event) => {
              event.preventDefault();
              event.stopPropagation();
              tile.classList.add('drag-over');
            });
          });
          ['dragleave', 'drop'].forEach((type) => {
            tile.addEventListener(type, (event) => {
              event.preventDefault();
              event.stopPropagation();
              tile.classList.remove('drag-over');
            });
          });
          tile.addEventListener('drop', (event) => {
            const files = Array.from((event.dataTransfer && event.dataTransfer.files) || []);
            const file = files.find((item) => item && item.type && item.type.startsWith('image/'));
            if (!file) {
              showStatus('Drop an image file here.', 'error');
              return;
            }
            applyFrameFile(frameKind, file);
          });
        }
      });
    }

    function renderSingleThumb(file, containerEl, onRemove) {
      containerEl.innerHTML = '';
      if (!file) return;

    
      const url = URL.createObjectURL(file);
      const wrapper = document.createElement('div');
      wrapper.className = 'relative h-16 w-16 md:h-20 md:w-20 rounded-xl overflow-hidden border border-white/20';
      const img = document.createElement('img');
      img.src = url;
      img.className = 'h-full w-full object-cover';
      const closeBtn = document.createElement('button');
      closeBtn.type = 'button';
      closeBtn.className = 'absolute top-1 right-1 h-5 w-5 rounded-full bg-black/80 text-[11px] leading-none flex items-center justify-center z-20';
      closeBtn.textContent = '×';
      closeBtn.addEventListener('click', () => {
        onRemove();
        wrapper.remove();
      });
      wrapper.appendChild(img);
      wrapper.appendChild(closeBtn);
      containerEl.appendChild(wrapper);
    }

    function clearLastFrame() {
      lastFrameFile = null;
      document.getElementById('lastFrameInput').value = '';
      document.getElementById('lastFrameThumb').innerHTML = '';
    }

    function applyFrameFile(kind, file) {
      if (kind === 'start') {
        startFrameFile = file;
        document.getElementById('startFrameInput').value = '';
        renderSingleThumb(startFrameFile, document.getElementById('startFrameThumb'), () => {
          startFrameFile = null;
          document.getElementById('startFrameInput').value = '';
          clearLastFrame();
        });
        return;
      }

      if (!startFrameFile && file) {
        document.getElementById('lastFrameInput').value = '';
        showStatus('Last frame requires a Start frame first.', 'error');
        return;
      }

      lastFrameFile = file;
      document.getElementById('lastFrameInput').value = '';
      renderSingleThumb(lastFrameFile, document.getElementById('lastFrameThumb'), () => {
        clearLastFrame();
      });
    }

    document.getElementById('startFrameInput').addEventListener('change', (e) => {

      const file = (e.target.files || [])[0] || null;
      alephVideoFile = file;
      const container = document.getElementById('alephVideoThumb');
      container.innerHTML = '';

      // cleanup previous object URL
      try { if (__alephVideoObjURL) URL.revokeObjectURL(__alephVideoObjURL); } catch {}
      __alephVideoObjURL = null;

      if (!alephVideoFile) return;

      const wrapper = document.createElement('div');
      wrapper.className = 'relative h-16 w-16 md:h-20 md:w-20 rounded-xl overflow-hidden border border-white/20 bg-slate-900 flex items-center justify-center';

      // Image preview (first frame)
      const img = document.createElement('img');
      img.className = 'absolute inset-0 h-full w-full object-cover';
      img.alt = 'video preview';
      wrapper.appendChild(img);

      const label = document.createElement('span');
      label.className = 'absolute bottom-1 left-1 text-[9px] text-white/80 px-1.5 py-0.5 rounded bg-black/60';
      label.textContent = 'VIDEO';
      wrapper.appendChild(label);

      const closeBtn = document.createElement('button');
      closeBtn.type = 'button';
      closeBtn.className = 'absolute top-1 right-1 h-5 w-5 rounded-full bg-black/80 text-[11px] leading-none flex items-center justify-center z-20';
      closeBtn.textContent = '×';
      closeBtn.addEventListener('click', () => {
        alephVideoFile = null;
        document.getElementById('alephVideoInput').value = '';
        try { if (__alephVideoObjURL) URL.revokeObjectURL(__alephVideoObjURL); } catch {}
        __alephVideoObjURL = null;
        wrapper.remove();
      });
      wrapper.appendChild(closeBtn);
      container.appendChild(wrapper);

      // Extract first frame preview
      try {
        const objUrl = URL.createObjectURL(alephVideoFile);
        __alephVideoObjURL = objUrl;

        const v = document.createElement('video');
        v.preload = 'auto';
        v.muted = true;
        v.playsInline = true;
        v.setAttribute('playsinline', '');
        v.setAttribute('muted', '');
        v.src = objUrl;
        // Safari needs the video in the DOM to reliably decode the first frame
        v.style.position = 'fixed';
        v.style.left = '-9999px';
        v.style.top = '-9999px';
        v.style.width = '1px';
        v.style.height = '1px';
        v.style.opacity = '0';
        v.style.pointerEvents = 'none';
        document.body.appendChild(v);

        const cleanupVideo = () => {
          try { v.pause(); } catch {}
          try { v.remove(); } catch {}
        };

        const grab = () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = v.videoWidth || 256;
            canvas.height = v.videoHeight || 256;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
            img.src = canvas.toDataURL('image/jpeg', 0.82);
          } catch {}
        };

        v.addEventListener('loadedmetadata', async () => {
          try { await v.play(); } catch {}
          try { v.pause(); } catch {}
          try {
            const t = Math.min(0.1, Math.max(0, (v.duration || 1) * 0.02));
            v.currentTime = t;
          } catch {
            grab();
            cleanupVideo();
          }
        }, { once: true });

        v.addEventListener('seeked', () => {
          grab();
          cleanupVideo();
        }, { once: true });

        v.addEventListener('error', () => {
          // fallback: keep dark tile with VIDEO label
          cleanupVideo();
        }, { once: true });

        try { v.load(); } catch {}
      } catch {
        // ignore preview failures
      }
    });

    document.getElementById('alephImageInput').addEventListener('change', (e) => {
      const file = (e.target.files || [])[0] || null;
      alephImageFile = file;
      renderSingleThumb(alephImageFile, document.getElementById('alephImageThumb'), () => {
        alephImageFile = null;
        document.getElementById('alephImageInput').value = '';
      });
    });


    async function uploadImagesAndGetUrls(files) {
      const list = Array.isArray(files) ? files : (uploadedFiles || []);
      if (!list.length) return [];
      if (!window.kieUploadBridge || typeof window.kieUploadBridge.upload !== 'function') {
        throw new Error('upload_bridge_missing');
      }
      const urls = [];
      const maxUploadMB = (typeof currentModel !== 'undefined' && currentModel && (currentModel.id === 'nano-banana-pro' || currentModel.id === 'nano-banana-2')) ? (currentModel.id === 'nano-banana-2' ? 30 : 25) : 10;
      const maxUploadBytes = maxUploadMB * 1024 * 1024;
      for (const file of list) {
        if (file.size > maxUploadBytes) {
          throw new Error('file_too_large');
        }
        const up = await window.kieUploadBridge.upload(file);
        if (!up || !up.publicUrl) {
          throw new Error('upload_failed');
        }
        urls.push(up.publicUrl);
      }
      return urls;
    }

    function buildBodyForModel(model, ctx) {
      const { uid, runId, urls, prompt, aspect, duration, resolution, genId, soraQuality } = ctx;
      switch (model.id) {
        case 'nano-banana':
          return { urls, prompt: prompt || '.', format: 'png', size: aspect || 'auto', run_id: runId };
        case 'nano-banana-pro':
          return { urls, prompt: prompt || '.', format: 'png', size: aspect || '1:1', resolution: (resolution || '1K'), run_id: runId };
        case 'nano-banana-2':
          return { urls, prompt: prompt || '.', format: 'png', size: aspect || 'auto', resolution: (resolution || '1K'), google_search: true, run_id: runId };
        case 'seedream-4-5':
          return { urls, prompt: prompt || '.', format: 'png', size: aspect || '1:1', run_id: runId };
        case 'gpt-image-1':
          return { prompt, aspect_ratio: aspect || '1:1', image_urls: urls && urls.length ? urls : undefined, run_id: runId };
        case 'imagen':
          return { prompt, model: 'ultra', aspect_ratio: aspect || '1:1', run_id: runId };
        case 'midjourney':
          return {
            prompt,
            image_url: urls && urls[0] ? urls[0] : undefined,
            // send both keys for backward/forward compatibility
            aspect_ratio: aspect || '2:3',
            aspectRatio: aspect || '2:3',
            run_id: runId
          };
        case 'mj-video':
          return {
            uid,
            prompt,
            imageUrl: (urls && urls[0]) ? urls[0] : '',
            aspectRatio: aspect || '1:1',
            run_id: runId
          };
        case 'veo3-fast':
        case 'veo3':
          return {
            uid,
            user_id: uid,
            prompt,
            aspectRatio: aspect || '16:9',
            duration: duration ? Number(duration) : 8,
            imageUrl: (urls && urls[0]) ? urls[0] : '',
            model: model.id === 'veo3-fast' ? 'veo3_fast' : 'veo3',
            run_id: runId
          };
        case 'veo31-fast':
        case 'veo31':
          return {
            uid,
            prompt,
            aspectRatio: aspect || '16:9',
            duration: duration ? Number(duration) : 8,
            firstFrameUrl: (urls && urls[0]) ? urls[0] : '',
            lastFrameUrl: (urls && urls[1]) ? urls[1] : '',
            imageUrl: '',
            model: model.id === 'veo31-fast' ? 'veo3_1_fast' : 'veo3_1',
            run_id: runId
          };

        case 'runway':
          return {
            uid,
            prompt,
            aspectRatio: aspect || '16:9',
            duration: duration ? Number(duration) : 5,
            imageUrl: (urls && urls[0]) ? urls[0] : '',
            run_id: runId
          };
        case 'kling25':
          return {
            prompt,
            aspect_ratio: aspect || '1:1',
            duration: duration ? Number(duration) : 5,
            image_url: urls && urls[0] ? urls[0] : undefined,
            tail_image_url: urls && urls[1] ? urls[1] : undefined,
            run_id: runId
          };
        case 'kling26':
          return {
            prompt,
            aspect_ratio: aspect || '1:1',
            duration: duration ? Number(duration) : 5,
            sound: !!currentKlingSound,
            image_url: urls && urls[0] ? urls[0] : undefined,
            run_id: runId
          };
        case 'kling21':
          return {
            prompt,
            duration: duration ? Number(duration) : 5,
            firstFrameUrl: urls && urls[0] ? urls[0] : undefined,
            lastFrameUrl: urls && urls[1] ? urls[1] : undefined,
            run_id: runId
          };

        case 'sora2': {
          // Sora 2 payload (1:1 with working sora2 page)
          const tier = (typeof currentSoraTier !== 'undefined' && currentSoraTier) ? currentSoraTier : 'base';
          const aspectRatio = (aspect || '16:9');
          const orientation = (aspectRatio === '9:16') ? 'portrait' : 'landscape';
          return {
            uid,
            run_id: runId,
            id: genId || null,
            tier,
            prompt,
            image_urls: (urls && urls[0]) ? [urls[0]] : [],
            orientation,
            aspectRatio,
            duration: (typeof duration === 'number') ? duration : parseInt(duration || '10', 10),
            quality: soraQuality || 'high'
          };
        }

        case 'aleph':
          return {
            uid,
            prompt,
            videoUrl: urls && urls[0] ? urls[0] : undefined,
            imageUrl: urls && urls[1] ? urls[1] : undefined,
            aspectRatio: '16:9',
            run_id: runId
          };
        default:
          return { prompt, run_id: runId };
      }
    }

    async function runCurrentModel() {
      if (!currentModel) {
        showStatus('Please choose a model first.', 'error');
        return;
      }
      const promptBox = document.getElementById('promptBox');
      const rawPrompt = promptBox.value || '';
      const prompt = rawPrompt.trim();
      if (!prompt) {
        showStatus('Please enter a prompt.', 'error');
        return;
      }

      if (!currentUser) {
        showStatus('Please log in first.', 'error');
        return;
      }

      if (typeof currentModel.minCredits === 'number' && currentCredits < currentModel.minCredits) {
        showStatus('Not enough credits for this model.', 'error');
        return;
      }

      // Kling 2.6 dynamic credit requirement (depends on sound + duration)
      if (currentModel && currentModel.id === 'kling26') {
        const __dur = (currentDuration === 10 || String(currentDuration) === '10') ? 10 : 5;
        const __need = (currentKlingSound ? (__dur === 10 ? 16 : 9) : (__dur === 10 ? 9 : 5));
        if (typeof currentCredits === 'number' && currentCredits < __need) {
          showStatus('Not enough credits for this selection.', 'error');
          return;
        }
      }


            // Image / frame / video requirements
      if (currentModel.useFrames) {
        // Kling 2.1 requires start frame; Veo 3.1 start frame is optional
        if (!currentModel.startOptional && !startFrameFile) {
          showStatus('This model requires a Start frame image.', 'error');
          return;
        }
        if (lastFrameFile && !startFrameFile) {
          showStatus('Last frame requires a Start frame first.', 'error');
          return;
        }
      } else if (currentModel.needsVideo) {
        if (!alephVideoFile) {
          showStatus('This model requires a video upload.', 'error');
          return;
        }
      } else if (currentModel.needsImage && !uploadedFiles.length) {
        showStatus('This model requires at least one image.', 'error');
        return;
      }

      const runBtn = document.getElementById('runBtn');
      runBtn.disabled = true;
      showStatus('Preparing your request…');

      try {
        const urls = currentModel.useFrames
          ? await uploadImagesAndGetUrls([startFrameFile, lastFrameFile].filter(Boolean))
          : currentModel.needsVideo
          ? await uploadImagesAndGetUrls([alephVideoFile, alephImageFile].filter(Boolean))
          : await uploadImagesAndGetUrls(uploadedFiles);
        const uid = currentUser.id;
        const runId = `${uid}-${Date.now()}`;

        // Sora 2 requires a seeded user_generations row id (1:1 with working sora2 page)
        let __genId = null;
        let __soraQuality = 'high';
        if (currentModel && currentModel.id === 'sora2') {
          try {
            const ins = await supabaseClient.from('user_generations').insert({
              user_id: uid,
              provider: 'kie',
              kind: 'video',
              prompt,
              result_url: null,
              meta: { run_id: runId, status: 'processing', engine: 'sora2' }
            }).select('id').single();
            if (ins && !ins.error && ins.data && ins.data.id) __genId = ins.data.id;
          } catch (e) {
            __genId = null;
          }
        }

        const body = buildBodyForModel(currentModel, {
          uid,
          runId,
          urls,
          prompt,
          aspect: currentAspect,
          duration: currentDuration,
          genId: __genId,
          soraQuality: __soraQuality,
          resolution: currentResolution
        });

        // --- GPT-Image-1.5 safeguard: always include aspect + any uploaded image URLs ---
        // Some older builds may not hit the correct buildBodyForModel() switch-case.
        if (currentModel && typeof currentModel.id === 'string' && currentModel.id.startsWith('gpt-image')) {
          if (!body.aspect_ratio) body.aspect_ratio = (currentAspect || '1:1');
          // If user uploaded images, force-send them under multiple accepted keys.
          if (Array.isArray(urls) && urls.length) {
            body.urls = urls;
            body.image_urls = urls;
            body.input_urls = urls;
          }
        }


                const expectedOutputs = 1;
const placeholderControllers = [];
for (let i = 0; i < expectedOutputs; i++) {
  const c = addResultCard({
    run_id: runId,
    provider: currentModel.name,
    kind: currentModel.category,
    prompt,
    result_url: null,
    status: 'processing'
  }, { prepend: true });
  if (c) placeholderControllers.push(c);
}
watchCreditsLive(120000);

        // Get Supabase access token (required by Netlify functions that validate auth)
        let __accessToken = '';
        try {
          const { data: s } = await supabaseClient.auth.getSession();
          __accessToken = s && s.session && s.session.access_token ? s.session.access_token : '';
        } catch (e) {
          __accessToken = '';
        }

        const res = await fetch(currentModel.endpoint, {
          method: 'POST',
          headers: Object.assign(
            { 'Content-Type': 'application/json', 'X-USER-ID': uid },
            __accessToken ? { 'Authorization': ('Bearer ' + __accessToken) } : {}
          ),
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          const txt = await res.text().catch(() => '');
          let msg = txt || `status ${res.status}`;
          try {
            const j = JSON.parse(txt);
            if (j && (j.error || j.message)) msg = j.error || j.message;
          } catch {}
          showStatus('Error from model: ' + msg, 'error');
          if (placeholderControllers && placeholderControllers.length) {
            for (let i = 0; i < placeholderControllers.length; i++) {
              placeholderControllers[i].apply({ status: 'failed', result_url: null });
            }
          }
          await refreshCredits();
        } else {
          // Some endpoints (e.g., Sora 2) return JSON with taskId/submitted flags
          let j = null;
          try { j = await res.json(); } catch { j = null; }

          // Sora 2: require submitted + taskId, then poll sora2-check
          if (currentModel && currentModel.id === 'sora2') {
            if (!j || !j.submitted || !j.taskId) {
              const errMsg = (j && j.error) ? j.error : 'unknown_error';
              showStatus('Error from model: ' + errMsg, 'error');
              if (placeholderControllers && placeholderControllers.length) {
                for (let i = 0; i < placeholderControllers.length; i++) {
                  placeholderControllers[i].apply({ status: 'failed', result_url: null });
                }
              }
              await refreshCredits();
            } else {
              showStatus(
                `✅ Request submitted to ${currentModel.name}. You can generate another request while this one is processing.`,
                'success'
              );
              await refreshCredits();
              if (placeholderControllers && placeholderControllers.length) {
                startSora2Poll(j.taskId, uid, runId, placeholderControllers);
              }
            }
          } else {
            showStatus(
              `✅ Request submitted to ${currentModel.name}. You can generate another request while this one is processing.`,
              'success'
            );
            await refreshCredits();
            if (placeholderControllers && placeholderControllers.length) {
              const taskId = j && (j.taskId || j.id || (j.data && (j.data.taskId || j.data.id)));
              startPollGeneration(runId, placeholderControllers, taskId);
            }
          }
        }
      } catch (err) {
        console.error(err);
        if (err && err.message === 'file_too_large') {
          const limitMb = (typeof currentModel !== 'undefined' && currentModel && currentModel.id === 'nano-banana-pro') ? 25 : 10;
          showStatus(`One of the images is larger than ${limitMb}MB.`, 'error');
        } else if (err && err.message === 'upload_bridge_missing') {
          showStatus('Upload bridge is missing on this page.', 'error');
        } else {
          showStatus('Unexpected error while submitting the job.', 'error');
        }
        await refreshCredits();
      } finally {
        runBtn.disabled = false;
      }
    }

    document.getElementById('runBtn').addEventListener('click', (e) => {
      e.preventDefault();
      runCurrentModel();
    });

    // boot
    (async () => {
      await loadUser();
      wireWorkspaceRedesign();
      wireUploadTileClicks();
      setMode('image');
      updateModelButtonLabels();
      configureControlsForModel();
      wireWorkspaceRedesign();
      wireUploadTileClicks();
    })();
  </script>
