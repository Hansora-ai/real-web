<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orders & bookings — Hansora Automation</title>
  <meta name="description" content="Orders, bookings and leads collected by your AI employee.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08090b">
  <script src="automation-theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="automation-header.css"><link rel="stylesheet" href="automation-ui.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="automation-client.js"></script><script defer src="automation-ui.js"></script><script defer src="automation-header.js"></script><script defer src="automation-operations.js?v=20260930-places"></script>
</head>
<body class="ui" data-automation-page="operations">
  <div data-automation-header></div>
  <main class="ui-page wide">
    <div id="operations-loading" aria-label="Loading"><div class="ui-grid cols-4"><div class="ui-skeleton" style="height:104px;border-radius:16px"></div><div class="ui-skeleton" style="height:104px;border-radius:16px"></div><div class="ui-skeleton" style="height:104px;border-radius:16px"></div><div class="ui-skeleton" style="height:104px;border-radius:16px"></div></div><div class="ui-skeleton" style="height:420px;border-radius:16px;margin-top:16px"></div></div>
    <div class="ui-alert" id="operations-error" role="alert" hidden style="margin-bottom:16px"></div>
    <div id="operations-app" class="ui-enter" hidden>
      <nav class="ui-crumbs" aria-label="Breadcrumb"><a id="operations-back" href="automation-dashboard.html">← AI employee</a></nav>
      <header class="ui-page-head"><div><h1>Orders &amp; bookings</h1><p>Everything your AI employee collected, ready for your team.</p></div><button class="ui-btn primary" id="new-record" type="button" data-icon="sparkle">Add manually</button></header>
      <section class="ui-grid cols-4 ui-enter" aria-label="Summary">
        <article class="ui-card ui-metric"><div class="ui-metric-label">Orders this month<span data-icon="bag"></span></div><div class="ui-metric-value" id="metric-orders">0</div></article>
        <article class="ui-card ui-metric"><div class="ui-metric-label">Upcoming bookings<span data-icon="calendar"></span></div><div class="ui-metric-value" id="metric-bookings">0</div></article>
        <article class="ui-card ui-metric"><div class="ui-metric-label">Open leads<span data-icon="spark"></span></div><div class="ui-metric-value" id="metric-leads">0</div></article>
        <article class="ui-card ui-metric highlight"><div class="ui-metric-label">Open value<span data-icon="wallet"></span></div><div class="ui-metric-value" id="metric-value">0</div></article>
      </section>
      <div class="ui-records" style="margin-top:16px">
        <section class="ui-card ui-records-list">
          <div class="ui-records-toolbar">
            <div class="ui-filter-pills" id="operations-tabs"><button class="active" data-kind="all" type="button">All</button><button data-kind="order" type="button">Orders</button><button data-kind="booking" type="button">Bookings</button><button data-kind="lead" type="button">Leads</button><button data-kind="day" type="button">Day view</button></div>
            <div class="ui-records-tools"><select class="ui-select sm" id="status-filter" aria-label="Status"><option value="all">Any status</option><option value="new">New</option><option value="in_progress">In progress</option><option value="waiting">Waiting</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><label class="ui-search"><span class="sr-only">Search</span><span data-icon="search"></span><input id="operations-search" type="search" placeholder="Search"></label></div>
          </div>
          <div id="records-list" class="ui-records-rows"></div>
          <div id="day-view" class="day-view" hidden>
            <div class="day-view-bar"><button class="ui-btn ghost sm" id="day-prev" type="button" aria-label="Previous day">◀</button><input class="ui-input" id="day-date" type="date" aria-label="Day"><button class="ui-btn ghost sm" id="day-next" type="button" aria-label="Next day">▶</button><span class="ui-faint" id="day-summary"></span></div>
            <div id="day-slots" class="day-slots"></div>
          </div>
        </section>
        <aside class="ui-card ui-record-detail" id="record-detail">
          <div class="ui-empty" id="detail-empty"><span data-icon="bag" style="width:28px;height:28px;display:grid"></span>Select a record to see the details.</div>
          <div id="detail-content" hidden>
            <div class="ui-record-head"><span class="ui-kind" id="detail-kind"></span><h2 id="detail-title"></h2><p id="detail-customer"></p><button class="ui-link" id="open-conversation" type="button">Open conversation →</button></div>
            <div class="ui-record-controls detail-status-row"><label class="ui-field"><span class="ui-label">Status</span><select class="ui-select" id="detail-status"><option value="new">New</option><option value="in_progress">In progress</option><option value="waiting">Waiting</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></label><label class="ui-field"><span class="ui-label">Assigned to</span><input class="ui-input" id="detail-owner" maxlength="120" placeholder="Nobody yet" list="owner-options"><datalist id="owner-options"></datalist></label></div>
            <section class="ui-record-section"><h3>Details</h3><div class="ui-kv" id="detail-fields"></div></section>
            <section class="ui-record-section"><h3>Summary</h3><p class="ui-side-summary" id="detail-summary"></p></section>
            <section class="ui-record-section"><h3>Team note</h3><textarea class="ui-textarea" id="detail-note" rows="3" placeholder="Only your team sees this"></textarea><div style="display:flex;align-items:center;gap:10px;margin-top:8px"><button class="ui-btn secondary sm" id="save-note" type="button">Save note</button><span class="ui-save-state" id="save-state"></span></div></section>
          </div>
        </aside>
      </div>
      <dialog class="ui-dialog" id="record-dialog">
        <form method="dialog" id="record-form">
          <div class="ui-dialog-head"><h2>Add manually</h2><button class="ui-btn ghost icon sm" data-close-record aria-label="Close" type="button">✕</button></div>
          <div class="ui-form-grid">
            <div class="ui-field"><label class="ui-label" for="record-type">Type</label><select class="ui-select" id="record-type"><option value="order">Order</option><option value="booking">Booking</option><option value="lead">Lead</option></select></div>
            <div class="ui-field"><label class="ui-label" for="record-customer">Customer</label><input class="ui-input" id="record-customer" required placeholder="Customer name"></div>
            <div class="ui-field full"><label class="ui-label" for="record-title">What do they need?</label><input class="ui-input" id="record-title" required placeholder="White cabinet 120 × 200 cm"></div>
            <div class="ui-field"><label class="ui-label" for="record-phone">Phone</label><input class="ui-input" id="record-phone" type="tel" placeholder="+1 555 010 0000"></div>
            <div class="ui-field"><label class="ui-label" for="record-value">Value</label><div class="ui-money"><input class="ui-input" id="record-value" type="number" min="0" step="0.01" placeholder="150"><select class="ui-select" id="record-currency" aria-label="Currency"><option>USD</option><option>EUR</option><option>GBP</option><option>AMD</option><option>RUB</option><option>AED</option><option>GEL</option><option>TRY</option><option>UAH</option><option>PLN</option><option>CAD</option><option>AUD</option><option>INR</option></select></div></div>
            <div class="ui-field booking-only" hidden><label class="ui-label" for="record-when">Date and time</label><input class="ui-input" id="record-when" type="datetime-local"></div>
            <div class="ui-field booking-only" hidden><label class="ui-label" for="record-duration">Length</label><select class="ui-select" id="record-duration"><option value="30">30 minutes</option><option value="60" selected>1 hour</option><option value="90">1.5 hours</option><option value="120">2 hours</option></select></div>
            <div class="ui-field booking-only" id="record-people-field" hidden><label class="ui-label" for="record-people">People</label><input class="ui-input" id="record-people" type="number" min="1" max="5000" step="1" value="1" inputmode="numeric"></div>
            <div class="ui-field booking-only" id="record-place-field" hidden><label class="ui-label" for="record-place" id="record-place-label">Place</label><select class="ui-select" id="record-place"><option value="">Any free</option></select></div>
          </div>
          <div class="ui-dialog-actions"><button class="ui-btn ghost" data-close-record type="button">Cancel</button><button class="ui-btn primary" id="save-record" value="default" type="submit">Add</button></div>
        </form>
      </dialog>
    </div>
  </main>
</body>
</html>
