<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — HANSORA AI</title>
  <meta name="description" content="Sign in or create your Hansora account." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%235b5ce2'/%3E%3Ctext x='50' y='60' font-size='54' text-anchor='middle' fill='white' font-family='Arial'%3EH%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{ --base-bg:#0b0d13; --base-line:#1a1f2b; --brand:#6366f1; }
    body{background:radial-gradient(1200px 600px at 20% 0%, rgba(99,102,241,.15), transparent 60%),
                       radial-gradient(1200px 600px at 100% 100%, rgba(56,189,248,.12), transparent 60%),
                       var(--base-bg); color:#e5e7eb}
    .bg-base-bg{background:var(--base-bg)}
    .border-base-line{border-color:var(--base-line)}
    .btn{border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.06)}
    .btn:hover{background:rgba(255,255,255,.1)}
    .btn-brand{background:var(--brand); border-color:transparent; color:white}
    .btn-brand:hover{background:#7c7ff6}
    .shadow-soft{box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .hero-glow{position:absolute; inset:-20%; background:
      radial-gradient(800px 400px at 0% 0%, rgba(99,102,241,.25), transparent 60%),
      radial-gradient(800px 400px at 100% 100%, rgba(56,189,248,.18), transparent 60%);
      filter: blur(40px); opacity:.6; pointer-events:none}
    a{transition:all .15s}
    input{background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08)}
    label{color:#cbd5e1}
  </style>
</head>
<body class="min-h-screen flex items-center justify-center relative">
  <div class="hero-glow"></div>

  <!-- Auth Card -->
  <main class="w-full max-w-md mx-auto px-4">
    <div class="rounded-2xl border border-white/10 bg-base-bg shadow-soft p-6 md:p-8">
      <div class="flex flex-col items-center gap-2 mb-6">
        <div class="h-12 w-12 rounded-full bg-white/10 grid place-items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20Zm1 5v5.586l3.293 3.293-1.414 1.414L11 13.414V7h2Z"/></svg>
        </div>
        <h1 class="text-2xl md:text-3xl font-semibold">Create Without Limits</h1>
        <p class="text-sm text-zinc-400 -mt-1">Sign in to continue</p>
      </div>

      <!-- Google -->
      <button id="btnGoogle" class="w-full btn border-white/10 py-3 rounded-xl flex items-center justify-center gap-3 mb-5">
        <img alt="G" class="h-5 w-5" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
        <span class="font-medium">Sign in with Google</span>
      </button>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-5">
        <div class="flex-1 h-px bg-white/10"></div>
        <span class="text-xs text-zinc-400">or</span>
        <div class="flex-1 h-px bg-white/10"></div>
      </div>

      <!-- Success panel (hidden by default) -->
      <section id="successPanel" class="hidden rounded-xl border border-white/10 bg-white/5 p-5 mb-5">
        <div class="flex items-start gap-3">
          <div class="h-9 w-9 rounded-lg bg-emerald-500/20 grid place-items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-400" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2a10 10 0 100 20 10 10 0 000-20Zm4.95 6.95l-6.364 6.364-2.536-2.536-1.414 1.414 3.95 3.95L18.364 10.364 16.95 8.95z"/>
            </svg>
          </div>
          <div>
            <h3 id="successTitle" class="text-lg font-semibold text-white">Check your email</h3>
            <p id="successText" class="text-sm text-zinc-300 mt-1">We sent a confirmation link to your inbox. Open it to continue.</p>
          </div>
        </div>
      </section>

      <!-- Email / Password form -->
      <form id="formAuth" class="space-y-4" autocomplete="on">
        <div id="rowEmail">
          <label class="block text-sm mb-1" for="email">Email</label>
          <input id="email" name="email" type="email" required class="w-full rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500/40" placeholder="you@example.com" />
        </div>
        <div id="rowPassword" class="grid grid-cols-1 gap-4">
          <div>
            <label class="block text-sm mb-1" for="password">Password</label>
            <input id="password" name="password" type="password" minlength="6" required class="w-full rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500/40" placeholder="••••••••" />
          </div>
          <div id="confirmWrap" class="hidden">
            <label class="block text-sm mb-1" for="confirm">Repeat password</label>
            <input id="confirm" name="confirm" type="password" minlength="6" class="w-full rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500/40" placeholder="••••••••" />
          </div>
        </div>

        <p id="err" class="text-sm text-red-400 min-h-[1.5rem]"></p>

        <button id="btnSubmit" type="submit" class="w-full btn-brand py-2.5 rounded-xl font-semibold">Log in</button>

        <div class="flex justify-between items-center -mt-1 mb-3">
          <span class="text-xs text-zinc-400">Minimum 6 characters</span>
          <a id="linkForgot" href="#" class="text-sm text-indigo-300 hover:text-indigo-200">Forgot password?</a>
        </div>
        <p class="text-sm text-zinc-400 text-center">
          Don’t have an account?
          <a id="linkToggle" href="#" class="underline decoration-dotted underline-offset-4">Sign up</a>
        </p>
      </form>

      <p class="text-xs text-zinc-500 text-center mt-6">
        By signing in, you agree to our
        <a href="/terms.html" class="underline">Terms of Use</a> and
        <a href="/policy.html" class="underline">Privacy Policy</a>.
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Initialize Supabase (from your project)
    const SUPABASE_URL = 'https://qmaealblegvcwodlmeht.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtYWVhbGJsZWd2Y3dvZGxtZWh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg2MjkzNzMsImV4cCI6MjA3NDIwNTM3M30.bUV6W0zBtkd_6gtfPGBSpskybUmpLC-1znljoDpYy4c';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Elements
    const form = document.getElementById('formAuth');
    const linkToggle = document.getElementById('linkToggle');
    const confirmWrap = document.getElementById('confirmWrap');
    const err = document.getElementById('err');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnGoogle = document.getElementById('btnGoogle');
    const successPanel = document.getElementById('successPanel');
    const successTitle = document.getElementById('successTitle');
    const successText  = document.getElementById('successText');
    const rowPassword = document.getElementById('rowPassword');
    const inputPassword = document.getElementById('password');
    const inputConfirm = document.getElementById('confirm');
    const linkForgot = document.getElementById('linkForgot');
    const rowEmail = document.getElementById('rowEmail');
    const inputEmail = document.getElementById('email');

    // Mode machine
    const mode = { value: 'login' }; // 'login' | 'signup' | 'reset' | 'set-new-password'

    function setMode(next) {
      mode.value = next;
      err.textContent = '';
      successPanel.classList.add('hidden');

      // defaults
      rowEmail.classList.remove('hidden');
      if (inputEmail) inputEmail.disabled = false;
      rowPassword.classList.remove('hidden');
      inputPassword.disabled = false;
      inputConfirm.disabled = false;
      confirmWrap.classList.add('hidden');
      linkToggle.classList.remove('hidden');
      if (linkForgot) linkForgot.classList.remove('hidden');

      if (next === 'signup') {
        confirmWrap.classList.remove('hidden');
        btnSubmit.textContent = 'Create account';
        linkToggle.textContent = 'Back to Log in';
        if (linkForgot) linkForgot.classList.add('hidden');
      } else if (next === 'reset') {
        // email-only
        rowPassword.classList.add('hidden');
        inputPassword.disabled = true;
        inputConfirm.disabled = true;
        btnSubmit.textContent = 'Send reset link';
        linkToggle.textContent = 'Back to Log in';
        if (linkForgot) linkForgot.classList.add('hidden');
      } else if (next === 'set-new-password') {
        rowEmail.classList.add('hidden');
        if (inputEmail) inputEmail.disabled = true;
        rowPassword.classList.remove('hidden');
        confirmWrap.classList.remove('hidden');
        inputPassword.disabled = false;
        inputConfirm.disabled = false;
        linkToggle.classList.add('hidden');
        if (linkForgot) linkForgot.classList.add('hidden');
        btnSubmit.textContent = 'Set new password';
      } else {
        // login
        btnSubmit.textContent = 'Log in';
        linkToggle.textContent = 'Sign up';
      }
    }

    // Toggle login/signup
    linkToggle.addEventListener('click', (e) => {
      e.preventDefault();
      setMode(mode.value === 'login' ? 'signup' : 'login');
    });

    // Forgot password → reset mode
    if (linkForgot) {
      linkForgot.addEventListener('click', (e) => {
        e.preventDefault();
        setMode('reset');
      });
    }

    // Google OAuth
    btnGoogle.addEventListener('click', async () => {
      try {
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: `${location.origin}/index.html` }
        });
        if (error) throw error;
      } catch (e) { err.textContent = e.message || 'Google sign-in failed.'; }
    });

    // Handle recovery link (#type=recovery)
    function getHashParams () {
      const h = new URLSearchParams(location.hash.replace(/^#/, ''));
      return Object.fromEntries(h.entries());
    }
    (async () => {
      const { type, access_token, refresh_token } = getHashParams();
      if (type === 'recovery' && access_token) {
        // setSession works best with both tokens; pass empty string if refresh is missing
        await supabase.auth.setSession({
          access_token,
          refresh_token: refresh_token || ''
        }).catch(()=>{});
        setMode('set-new-password');
      }
    })();

    // Form submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      successPanel.classList.add('hidden');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (mode.value === 'reset') {
        if (!email) { err.textContent = 'Enter your account email.'; return; }
        try {
          const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: `${location.origin}/login.html`
          });
          if (error) throw error;
          form.classList.add('hidden');
          successTitle.textContent = 'Password reset link sent';
          successText.textContent = 'We sent a secure link to your inbox. Open it to set a new password.';
          successPanel.classList.remove('hidden');
        } catch (e) { err.textContent = e.message || 'Could not send reset email. Please try again.'; }
        return;
      }

      if (mode.value === 'set-new-password') {
        const confirm = document.getElementById('confirm').value;
        if (password.length < 6) { err.textContent = 'Password must be at least 6 characters.'; return; }
        if (password !== confirm) { err.textContent = 'Passwords do not match.'; return; }
        try {
          const { error } = await supabase.auth.updateUser({ password });
          if (error) throw error;
          history.replaceState({}, document.title, location.pathname);
          form.classList.add('hidden');
          successTitle.textContent = 'Password updated';
          successText.textContent = 'Your password has been changed. Continue to Hansora.';
          successPanel.classList.remove('hidden');
          setTimeout(() => { window.location.href = '/index.html'; }, 800);
        } catch (e) { err.textContent = e.message || 'Could not update password. Please try again.'; }
        return;
      }

      if (mode.value === 'signup') {
        const confirm = document.getElementById('confirm').value;
        if (password !== confirm) { err.textContent = 'Passwords do not match.'; return; }
        if (password.length < 6) { err.textContent = 'Password must be at least 6 characters.'; return; }
        try {
          // v2 signature with options
          const { data, error } = await supabase.auth.signUp({
            email, password,
            options: { emailRedirectTo: `${location.origin}/login.html` }
          });

          // If Supabase says this email already exists (confirmed or not), show a clear inline message
          if (error && String(error.message).toLowerCase().includes('already registered')) {
            err.textContent = 'This email is already registered. Log in or use “Forgot password”.';
            return;
          }

          if (error) throw error;

          // If session created immediately, go in; else prompt to confirm
          if (data && data.session && data.session.user) {
            window.location.href = '/index.html';
          } else {
            form.classList.add('hidden');
            successTitle.textContent = 'Check your email to confirm';
            successText.textContent = 'We sent a confirmation link to your inbox. After confirming, return here to log in.';
            successPanel.classList.remove('hidden');
          }
        } catch (e) {
          err.textContent = e.message || 'Sign up failed. Please try again.';
        }
        return;
      }

      // login
      try {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = '/index.html';
      } catch (e) { err.textContent = 'Incorrect email or password.'; }
    });
  </script>
</body>
</html>
