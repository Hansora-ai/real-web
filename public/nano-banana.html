// === Live credits (Supabase Realtime) + pre-run check ===
(async function HANSORA_LIVE_CREDITS(){
  try{
    const navCreditsEl = document.getElementById('navCredits');
    const runBtn = document.getElementById('runBtn');
    function renderCredits(c){
      if (navCreditsEl) navCreditsEl.textContent = (c ?? 0) + '⚡';
      if (runBtn) {
        const ok = true;
        runBtn.disabled=false;
        runBtn.classList.toggle('opacity-50', !ok);
        runBtn.classList.toggle('cursor-not-allowed', !ok);
      }
    }

    const { data: userData } = await supabase.auth.getUser();
    const user = userData?.user;
    if(!user) return;

    // initial fetch
    const { data: prof } = await supabase
      .from('profiles')
      .select('credits')
      .eq('user_id', user.id)
      .maybeSingle();
    renderCredits(prof?.credits ?? 0);

    // subscribe to updates
    supabase.channel('credits_live_' + user.id)
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles', filter: 'user_id=eq.' + user.id },
        (payload) => { renderCredits(payload.new?.credits ?? 0); }
      )
      .subscribe();

    // patch __run to guard when credits are 0 (without changing its internals)
    const __origRun = window.__run;
    window.__run = async function(){
      try{
        const { data: prof2 } = await supabase
          .from('profiles')
          .select('credits')
          .eq('user_id', user.id)
          .maybeSingle();
        const c = prof2?.credits ?? 0;
        if (c < 0.5) {
          console.warn('No credits left.');
          alert('Not enough credits (need 0.5).'); 
          return;
        }
      }catch{}
      return __origRun ? __origRun() : undefined;
    };
  }catch(e){ console.warn('credits live failed', e); }
})();
</script>
<script>
(function(){
  function ready(fn){ if(document.readyState!=='loading') fn(); else document.addEventListener('DOMContentLoaded', fn); }
  ready(async function(){
    try{
      if (typeof supabase === 'undefined' || !supabase.auth) return;

      async function __refreshCredits(){
        try{
          const ures = await supabase.auth.getUser();
          const user = ures?.data?.user; if(!user) return null;
          const { data: prof } = await supabase.from('profiles').select('credits').eq('user_id', user.id).maybeSingle();
          const c = prof?.credits ?? 0;
          const nav = document.getElementById('navCredits'); if (nav) nav.textContent = (c ?? 0) + '⚡';
          const runBtn = document.getElementById('runBtn'); if (runBtn){
            const zero = false;
            runBtn.disabled = zero;
            runBtn.classList.toggle('opacity-50', zero);
            runBtn.classList.toggle('cursor-not-allowed', zero);
          }
          return c;
        }catch(e){ console.warn('refreshCredits failed', e); return null; }
      }

      // On load
      await __refreshCredits();

      // Wrap chargeOneCredit (client debit) to repaint after debit
      if (typeof window.chargeOneCredit === 'function'){
        const __origCharge = window.chargeOneCredit;
        window.chargeOneCredit = async function(){
          const out = await __origCharge();
          await __refreshCredits();
          return out;
        };
      }

      // Also poll briefly after Run to catch server-side debit
      if (typeof window.__run === 'function'){
        const __origRun = window.__run;
        window.__run = async function(){
          const ret = await __origRun();
          // poll for 15s every 1.5s
          const id = setInterval(__refreshCredits, 1500);
          setTimeout(()=>clearInterval(id), 15000);
          return ret;
        };
      }
    }catch(e){ console.warn('live credits wrapper error', e); }
  });
})();

// Credits + URL extraction helpers
async function chargeOneCredit(){const {data}=await supabase.auth.getUser();if(!data.user)return;const prof=await supabase.from('profiles').select('credits').eq('user_id',data.user.id).maybeSingle();const cur=prof?.data?.credits??0;if(cur < 0.5)throw new Error('Not enough credits (need 0.5).');await supabase.from('profiles').update({credits:cur-0.5}).eq('user_id',data.user.id);}

function derivePublicUrl(up){
  if (!up) return null;
  if (up.publicUrl) return up.publicUrl;
  try{
    if (up.bucket && up.objectPath && up.uploadUrl){
      const u = new URL(up.uploadUrl);
      const enc = up.objectPath.split('/').map(encodeURIComponent).join('/');
      return `${u.protocol}//${u.host}/storage/v1/object/public/${encodeURIComponent(up.bucket)}/${enc}`;
    }
  }catch(e){}
  return null;
}

// ADDED: make sure DB gets a row even if webhook is late/blocked
async function backfillRow(uid, rid, taskId, url){

    await fetch(

        body: JSON.stringify({

          result:{ images:[{ url }] }
        })
      }
    );
  }catch{}
}

// Best-effort: create a submitted row immediately so Usage shows even if user leaves.
async function backfillSubmitted(uid, rid, taskId){

    await fetch('/.netlify/functions/kie-callback?uid='+encodeURIComponent(uid)+'&run_id='+encodeURIComponent(rid)+'&taskId='+encodeURIComponent(taskId||''),{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ status:'submitted', result:{ images:[] } })
    });
  }catch{}
}

// Option A: poll nb-check (does NOT rely on webhook)
async function nbCheckPoll(taskId, uid, rid){
  if(!taskId) return;
  const start = Date.now();
  while(!__done && Date.now() - start < 180000){ // up to 3 min
    try{
      const r = await fetch('/.netlify/functions/nb-check?taskId='+encodeURIComponent(taskId), {
        headers: { 'X-USER-ID': uid }
      });

      let j;
      try { j = await r.json(); }
      catch {
        const txt = await r.text();
        try { j = JSON.parse(txt); } catch { j = { raw: txt }; }
      }

      const status = String(j.status || j.data?.status || j.result?.status || j.state || '').toLowerCase();
      if(['success','succeeded','completed','done'].includes(status)){
        const url = await (async function tryExtractImageUrl(o){
          if(!o) return null;
          if(typeof o==='string'&&/^https?:\/\//.test(o)) return o;
          if(o.imageUrl) return o.imageUrl;
          if(o.outputUrl) return o.outputUrl;
          if(o.url) return o.url;
          if(o.data) { const x=await tryExtractImageUrl(o.data); if(x) return x; }
          if(o.result) { const x=await tryExtractImageUrl(o.result); if(x) return x; }
          if(Array.isArray(o.images)&&o.images[0]?.url) return o.images[0].url;
          if(Array.isArray(o.resultUrls) && o.resultUrls[0]) return o.resultUrls[0];
          if(Array.isArray(o.output)&&o.output[0]?.url) return o.output[0].url;
          return null;
        })(j);
        if(url){
          onResult(url);               // show immediately
          backfillRow(uid, rid, taskId, url); // ensure Supabase row exists
        }
        break;
      }
      if(['failed','error'].includes(status)){
        showStatus('❌ Generation failed.','text-rose-300');
        break;
      }
    }catch{}
    await new Promise(r=>setTimeout(r,1500));
  }
}

// Main run
window.__run=async function(){
  const {data:authData}=await supabase.auth.getUser();
  if(!authData.user){ alert('Please log in or register first.'); return; }

  // HARD CREDIT CHECK (surgical): prevent run if credits insufficient
  try{
    const { data: prof } = await supabase.from('profiles').select('credits').eq('user_id', authData.user.id).maybeSingle();
    const cur = prof?.credits ?? 0;
    if (cur < 0.5) {
      showStatus('Not enough credits (need 0.5).','text-rose-300');
      runBtn.disabled = false; runBtn.textContent = "Run (cost: 0.5⚡)";
      return;
    }
  }catch(_){ /* ignore, but don't proceed if unknown? proceed cautiously */ }

  __done=false;
  const files=[...filesEl.files];
  if(!files.length){alert('Choose at least one image.');return;}
  if(files.length>4){alert('Max 4 images.');return;}
  for(const f of files){if(f.size>10*1024*1024){alert('File too large: '+f.name);return;}}

  runBtn.disabled=true;runBtn.textContent='Uploading…';
  showStatus('Uploading images…','text-zinc-400');
  resultBox.innerHTML='<span class="text-xs text-zinc-500 animate-pulse">Generating… this can take ~20–60s</span>';

  try{
    const uid=authData.user.id;
    const rid=uid+'-'+Date.now();

    // ==== FIX: await all uploads, then proceed ====
    if (!window.kieUploadBridge || typeof window.kieUploadBridge.upload !== 'function') {
      throw new Error('upload_bridge_missing');
    }

    const uploadOne = async (f) => {
      const up = await window.kieUploadBridge.upload(f);
      const url = derivePublicUrl(up);
      if (!url) throw new Error('no_public_url');
      // Best effort warm HEAD to reduce signed-url cache lag
      try { await fetch(url, { method: 'HEAD', cache: 'no-store' }); } catch {}
      return url;
    };

    const settled = await Promise.allSettled(files.map(uploadOne));
    const urls = settled.filter(x => x.status === 'fulfilled' && x.value).map(x => x.value);

    // guard: if no URLs were produced, stop here
    if (urls.length === 0) {
      showStatus('Upload failed: no image URLs to send','text-rose-300');
      runBtn.disabled = false; runBtn.textContent = 'Run (cost: 0.5⚡)';
      return;
    }

    runBtn.textContent='Submitting…';
    showStatus('Submitting…','text-zinc-400');

    // create job
    const res=await fetch('/.netlify/functions/run-nano-banana',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-USER-ID':uid},
      body:JSON.stringify({urls, prompt: (promptEl.value||'.'), format:'png', size:(document.getElementById('size')?.value||'auto'), run_id: rid})
    });

    if (res.status === 202 || res.ok) {
      await chargeOneCredit();
    } else {
      const errT = await res.text().catch(()=> '');
      throw new Error('Create failed: ' + errT);
    }

    const resJson = await res.json().catch(()=> ({}));
    const taskId = resJson?.taskId || resJson?.data?.taskId || resJson?.id || null;

    // store pending ticket so we can resume after refresh
    try { localStorage.setItem('nb_pending', JSON.stringify({ pending:true, taskId, run_id: rid, startedAt: Date.now(), ttl:200 })); } catch{}

    // ensure Usage shows even if user navigates away
    backfillSubmitted(uid, rid, taskId);

    showStatus('✅ Submitted. Waiting for result…','text-emerald-300');
    runBtn.textContent='Processing…';

    // subscribe to Supabase (if webhook inserts there)
    channel = supabase.channel('nb_results_' + rid)
      .on(
        'postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'nb_results', filter: 'run_id=eq.' + rid },
        (payload) => {
          const url = payload?.new?.image_url;
          if (url) onResult(url);
        }
      )
      .subscribe();

    // start polling taskId (and backfill DB when done)
    nbCheckPoll(taskId, uid, rid);

    // fallback: poll table directly in case realtime is blocked
    const started = Date.now();
    while (!__done && Date.now() - started < 200000) { // up to 120s
      await new Promise(r => setTimeout(r, 1500));
      const { data: row } = /* Imagen-style: no DB restore from user_generations */

      const url = row?.image_url || null;
      if (url) { onResult(url); break; }
    }

    if (!__done) {
      const __MSG='❌ Generation failed. Credits refunded. Try again or contact us.';
      try{ await refundHalfCreditOnce(taskId); }catch{}
      try{ localStorage.setItem('nb_last_run', JSON.stringify({ id, uid, result_url:null, failed:false })); }catch{}
      showStatus(__MSG,'text-rose-300');
    }

  }catch(e){
    showStatus('❌ '+(e.message||String(e)),'text-rose-300')
  }finally{
    runBtn.disabled=false;runBtn.textContent='Run (cost: 0.5⚡)';
  }
};
</script>
<!-- Delete buttons + safe validation (additive, non-destructive) -->
<script>
(function(){
  function ready(fn){ if(document.readyState!=='loading') fn(); else document.addEventListener('DOMContentLoaded', fn); }

  ready(function(){
    var filesEl = document.getElementById('files') || document.querySelector('input[type=file][id*="file"]');
    var thumbsEl = document.getElementById('thumbs') || document.querySelector('#thumbs, .thumbs, [data-role="thumbs"]');
    var promptEl = document.getElementById('prompt') || document.querySelector('textarea[name="prompt"], #promptEl');

    if (!filesEl || !thumbsEl) return;

    function enhanceThumbs(){
      // Wrap plain IMG nodes with a relative container + delete button.
      var imgs = Array.from(thumbsEl.querySelectorAll('img'));
      imgs.forEach(function(img, idx){
        if (img.closest('.nb-thumb-wrap')) return; // already wrapped

        var wrap = document.createElement('span');
        wrap.className = 'nb-thumb-wrap relative inline-block';
        img.parentNode.insertBefore(wrap, img);
        wrap.appendChild(img);

        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'absolute -top-2 -right-2 h-7 w-7 rounded-full bg-black/70 border border-white/20 text-white/80 hover:text-white hover:bg-black/90 flex items-center justify-center';
        del.setAttribute('aria-label','Remove image');
        del.innerHTML = '&times;';

        del.addEventListener('click', function(){
          try {
            var dt = new DataTransfer();
            Array.from(filesEl.files).forEach(function(f, i){
              if (i !== idx) dt.items.add(f);
            });
            filesEl.files = dt.files;
          } catch(e){ /* ignore */ }

          // Remove UI thumb and re-index remaining
          wrap.remove();
          // Re-run to re-bind indexes
          setTimeout(enhanceThumbs, 0);
        });

        wrap.appendChild(del);
      });
    }

    // After the built-in change handler updates the thumbs, enhance them.
    filesEl.addEventListener('change', function(){ setTimeout(enhanceThumbs, 0); });

    // Run once in case thumbs already exist on load (hot re-render etc.)
    setTimeout(enhanceThumbs, 0);

    // Safe validation without touching original __run
    if (typeof window.__run === 'function'){
      var __origRun = window.__run;
      window.__run = async function(){
        try{
          var hasImg = filesEl && filesEl.files && filesEl.files.length > 0;
          var promptVal = (promptEl && promptEl.value ? promptEl.value : '').trim();
          if (!hasImg || !promptVal){
            alert('Please upload at least one image and enter a prompt.');
            return;
          }
        }catch(e){ /* ignore */ }
        return __origRun();
      };
    }
  });
})();
</script>

<script>
// Server-first: fetch the most recent run from Supabase on load and render it.
// This guarantees we show the *latest* run (even if user left the page).
document.addEventListener('DOMContentLoaded', async function serverFirstLatest(){
  try{
    const ures = await supabase.auth.getUser();
    const user = ures?.data?.user;
    if (!user) return;

    const { data: row } = /* Imagen-style: no DB restore from user_generations */

    if (!row) return;

    const st = String(row.status || '').toLowerCase();
    const url = row.result_url || null;

    // If terminal success -> render image and persist
    if (url){
      if (!window.__done) {
        window.__renderedFromServer = true;
        onResult(url);
        try { localStorage.setItem('nb_last_run', JSON.stringify({ id, uid, result_url:null, failed:false })); } catch{}
        try {
          const pend = JSON.parse(localStorage.getItem('nb_pending') || 'null');
          if (pend && pend.run_id === row && row.created_at) localStorage.removeItem('nb_pending');
        } catch {}
      }
      return;
    }

    // If terminal failed -> render failure + persist
    if (st === 'failed'){
      window.__renderedFromServer = true;
      const msg = '❌ Generation failed. Credits refunded. Try again or contact us.';
      showStatus(msg, 'text-rose-300');
      try { localStorage.setItem('nb_last_run', JSON.stringify({ id, uid, result_url:null, failed:false })); } catch{}
      try {
        const pend = JSON.parse(localStorage.getItem('nb_pending') || 'null');
        if (pend && pend.run_id === row && row.created_at) localStorage.removeItem('nb_pending');
      } catch {}
      return;
    }

    // Otherwise (pending): seed nb_pending to resume auto-poll from server
    try {
      const startedAt = new Date(row.created_at).getTime();
      localStorage.setItem('nb_pending', JSON.stringify({ pending:true, taskId:null, run_id: row && row.created_at, startedAt, ttl:200 }));
    } catch {}
  }catch(e){ console.warn('serverFirstLatest error', e); }
});
</script>
<script>
async function refundHalfCreditOnce(taskId){
  try{
    const key = 'nb_refunded_' + (taskId || 'unknown');
    if (localStorage.getItem(key)) return false;
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return false;
    const { data: prof } = await supabase.from('profiles').select('credits').eq('user_id', user.id).maybeSingle();
    const cur = prof?.credits ?? 0;
    const next = Math.round((cur + 0.5) * 1000) / 1000;
    await supabase.from('profiles').update({ credits: next }).eq('user_id', user.id);
    const nav = document.getElementById('navCredits'); if (nav) nav.textContent = next + '⚡';
    localStorage.setItem(key, '1');
    return true;
  }catch(e){ console.warn('refundHalfCreditOnce failed', e); return false; }
}

document.addEventListener('DOMContentLoaded', function restoreLastRun(){
  try{
    // Skip drawing old cache if a pending ticket exists or server already rendered
    if (localStorage.getItem('nb_pending')) return;
    const raw = localStorage.getItem('nb_last_run');
    if (!raw) return;
    const last = JSON.parse(raw);
    const box = document.getElementById('resultBox');
    const dl  = document.getElementById('downloadLink');
    if (!box) return;
    if (last.ok && last.url){
      const img = new Image();
      img.onload = function(){ box.innerHTML=''; img.className='w-full h-full object-contain'; box.appendChild(img); };
      img.src = last.url;
      if (dl) {
        const __name = (last.url.split('/').pop()||'generation');
        dl.href='/.netlify/functions/download-proxy?url='+encodeURIComponent(last.url)+'&name='+encodeURIComponent(__name);
        dl.setAttribute('download', __name);
        dl.classList.remove('hidden');
        dl.textContent='Download';
      }
    } else if (last.msg){
      box.innerHTML = '<span class="text-xs text-rose-300">'+ last.msg +'</span>';
    }
  }catch{}
});

document.addEventListener('DOMContentLoaded', function resumeFromPending(){
  try{
    const raw = localStorage.getItem('nb_pending');
    if (!raw) return;
    const p = JSON.parse(raw);
    const ttlMs = (p.ttl || 200) * 1000;
    const remaining = ttlMs - (Date.now() - (p.startedAt || 0));
    if (remaining <= 0){
      (async () => {
        await refundHalfCreditOnce(p.taskId);
        const msg = '❌ Generation failed. Credits refunded. Try again or contact us.';
        showStatus(msg, 'text-rose-300');
        try { localStorage.setItem('nb_last_run', JSON.stringify({ id, uid, result_url:null, failed:false })); } catch{};
        try { localStorage.removeItem('nb_pending'); } catch{};
      })();
      return;
    }
    (async () => {
      const started = Date.now();
      while (!window.__done && Date.now() - started < remaining){
        await new Promise(r => setTimeout(r, 1500));
        try{
          const { data: row } = /* Imagen-style: no DB restore from user_generations */
          const url = row?.image_url || null;
          const st = (row?.status || '').toLowerCase();
          if (url){
            window.onResult(url);
            try { localStorage.setItem('nb_last_run', JSON.stringify({ id, uid, result_url:null, failed:false })); } catch{};
            try { localStorage.removeItem('nb_pending'); } catch{};
            break;
          }
          if (st === 'failed'){
            await refundHalfCreditOnce(p.taskId);
            const msg = '❌ Generation failed. Credits refunded. Try again or contact us.';
            showStatus(msg, 'text-rose-300');
            try { localStorage.setItem('nb_last_run', JSON.stringify({ id, uid, result_url:null, failed:false })); } catch{};
            try { localStorage.removeItem('nb_pending'); } catch{};
            break;
          }
        }catch(e){}
      }
      if (!window.__done){
        await refundHalfCreditOnce(p.taskId);
        const msg = '❌ Generation failed. Credits refunded. Try again or contact us.';
        showStatus(msg, 'text-rose-300');
        try { localStorage.setItem('nb_last_run', JSON.stringify({ id, uid, result_url:null, failed:false })); } catch{};
        try { localStorage.removeItem('nb_pending'); } catch{};
      }
    })();
  }catch(e){ console.warn('resumeFromPending error', e); }
});
</script>


<script>
// ==== Imagen-style minimal persistence for Nano Banana ====
(function(){
  const KEY = 'nb_last_run';
  function __nbSaveState(state){ try{ localStorage.setItem(KEY, JSON.stringify(state||{})); }catch{} }
  function __nbLoadState(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch{ return {}; } }
  function __nbClearState(){ try{ localStorage.removeItem(KEY); }catch{} }

  // Wrap nbCheckPoll to capture (taskId, uid, run_id) on first call after submit
  if (typeof window.nbCheckPoll === 'function' && !window.nbCheckPoll.__persistWrapped){
    const __origPoll = window.nbCheckPoll;
    window.nbCheckPoll = async function(taskId, uid, run_id){
      try{
        const s = __nbLoadState();
        if (!s || !s.taskId || s.taskId !== taskId){
          __nbSaveState({ taskId, uid, run_id, result_url: null, failed:false });
        }
      }catch{}
      return await __origPoll.apply(this, arguments);
    };
    window.nbCheckPoll.__persistWrapped = true;
  }

  // Wrap onResult(url) to cache the final URL
  if (typeof window.onResult === 'function' && !window.onResult.__persistWrapped){
    const __origRes = window.onResult;
    window.onResult = function(url){
      try{
        const s = __nbLoadState(); s.result_url = url; s.failed=false; __nbSaveState(s);
      }catch{}
      return __origRes.apply(this, arguments);
    };
    window.onResult.__persistWrapped = true;
  }

  // Resume on load for the same user (prefer latest server truth but ensure resume works)
  document.addEventListener('DOMContentLoaded', async () => {
    try{
      if (typeof supabase === 'undefined' || !supabase.auth) return;
      const { data: userData } = await supabase.auth.getUser();
      const user = userData?.user;
      if(!user) return;
      const s = __nbLoadState();
      if(!s || !s.uid || s.uid != user.id) return;

      // If server-first already rendered something, skip

      // If we have a saved result -> restore it
      if (s.result_url && typeof window.onResult === 'function'){
        try{ window.onResult(s.result_url); }catch{}
        try{ showStatus && showStatus('Last result restored.', 'text-emerald-300'); }catch{}
        return;
      }
      // Else, resume polling with saved ids
      if (s.taskId && s.run_id && typeof window.nbCheckPoll === 'function'){
        try{ showStatus && showStatus('Resuming your previous run…', 'text-zinc-300'); }catch{}
        await window.nbCheckPoll(s.taskId, s.uid, s.run_id);
      }
    }catch{}
  });

  // Clear cache before a new run via Run button (non-invasive)
  document.addEventListener('DOMContentLoaded', () => {
    try{
      const btn = document.getElementById('runBtn');
      if (btn && !btn.__persistHooked){
        btn.__persistHooked = true;
        btn.addEventListener('click', function(){ try{ __nbClearState(); }catch{}; }, { capture:true });
      }
    }catch{}
  });
})();
</script>
