            <input id="files" type="file" multiple accept="image/*" class="mt-1 w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 outline-none"/>
            <div id="thumbs" class="mt-2 flex gap-2 flex-wrap"></div>
          </div>
          <div>
            <label class="text-xs text-zinc-400">Image size</label>
            <select id="size" class="mt-1 w-full rounded-lg border border-white/10 bg-base-bg/60 px-3 py-2 outline-none input-dark">
              <option value="auto" selected>Auto</option>
              <option value="square">Square</option>
              <option value="portrait_3_4">Portrait 3:4</option>
              <option value="portrait_9_16">Portrait 9:16</option>
              <option value="landscape_4_3">Landscape 4:3</option>

          <button id="runBtn" type="button" onclick="__run()" class="w-full rounded-xl btn-brand px-4 py-3 font-semibold">Run (cost: 0.5⚡)</button>

        <div id="resultBox" class="mt-3 aspect-square w-full overflow-hidden rounded-xl border border-white/10 bg-base-bg/60 flex items-center justify-center">

  <!-- Supabase init + header profile/credits (unchanged) -->
  <script>
    const SUPABASE_URL = 'https://qmaealblegvcwodlmeht.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtYWVhbGJsZWd2Y3dvZGxtZWh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg2MjkzNzMsImV4cCI6MjA3NDIwNTM3M30.bUV6W0zBtkd_6gtfPGBSpskybUmpLC-1znljoDpYy4c';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $btnLoginSignup = document.getElementById('btnLoginSignup');
    const $navUser = document.getElementById('navUser');
    const $navCredits = document.getElementById('navCredits');
    const $navAvatar = document.getElementById('navAvatar');
    const $navMenu = document.getElementById('navMenu');
    const $btnLogout = document.getElementById('btnLogout');
    const $navAvatarImg = document.getElementById('navAvatarImg');

    function showLoggedInUI(profile, user){
      $btnLoginSignup.classList.add('hidden');
      $navUser.classList.remove('hidden');
      $navUser.classList.add('flex');
      $navCredits.textContent = (profile?.credits ?? 0) + '⚡';
      if (user?.user_metadata?.avatar_url){
        $navAvatarImg.src = user.user_metadata.avatar_url;
        $navAvatarImg.classList.remove('hidden');
      }
    }
    function showLoggedOutUI(){
      $btnLoginSignup.classList.remove('hidden');
      $navUser.classList.add('hidden');
      $navUser.classList.remove('flex');
    }
    $navAvatar.addEventListener('click',()=>{ const m = document.getElementById('navMenu'); m.classList.toggle('hidden'); });
    document.addEventListener('click',(e)=>{ if(!e.target.closest('#navAvatar') && !e.target.closest('#navMenu')) document.getElementById('navMenu').classList.add('hidden'); });
    $btnLogout?.addEventListener('click', async()=>{ await supabase.auth.signOut(); showLoggedOutUI(); });

    async function getOrCreateProfile(user){
      const r = await supabase.from('profiles').select('credits').eq('user_id', user.id).maybeSingle();
      if (r.error) throw r.error;
      if (!r.data){
        const ins = await supabase.from('profiles').insert({ user_id:user.id, email:user.email, credits:3 }).select().single();
        if (ins.error) throw ins.error;
        return ins.data;
      }
      return r.data;
    }

    (async()=>{
      const { data } = await supabase.auth.getUser();
      const user = data.user;
      if (user){
        try { const p = await getOrCreateProfile(user); showLoggedInUI(p, user); }
        catch { showLoggedOutUI(); }
      }else{
        showLoggedOutUI();
      }
    })();
  </script>

  <!-- Elements + thumbs preview -->
  <script>
    const filesEl = document.getElementById('files');
    const thumbsEl = document.getElementById('thumbs');
    const promptEl = document.getElementById('prompt');
    const runBtn = document.getElementById('runBtn');
    const statusEl = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const downloadLink = document.getElementById('downloadLink');

    filesEl.addEventListener('change',()=>{
      thumbsEl.innerHTML='';
      [...filesEl.files].slice(0,4).forEach(f=>{
        const u = URL.createObjectURL(f);
        const img = new Image();
        img.src = u;
        img.className = 'h-24 w-24 object-cover rounded-lg border border-white/10';
        thumbsEl.appendChild(img);
      });
    });

    function showStatus(m,c=''){ statusEl.textContent = m; statusEl.className = 'mt-2 text-sm ' + c; }
  </script>

  <!-- Renderer (kept) -->
  <script>
    let __done = false;
    function onResult(url){
      if(__done || !url) return;
      __done = true;
      const img = new Image();
      img.onload = () => {
        resultBox.innerHTML = '';
        img.className = 'w-full h-full object-contain';
        resultBox.appendChild(img);
        const __name = (url.split('/').pop()||'generation');
        downloadLink.href='/.netlify/functions/download-proxy?url='+encodeURIComponent(url)+'&name='+encodeURIComponent(__name);
        downloadLink.setAttribute('download', __name);
        downloadLink.classList.remove('hidden');
        downloadLink.textContent='Download';
        showStatus('✅ Done.','text-emerald-300');
      };
      img.src = url;
    }
  </script>

  <!-- Persistence (exact key + onload resume) -->
  <script>
    function __imagenSaveState(state){ try{ localStorage.setItem('Nano Banan:lastRun', JSON.stringify(state||{})); }catch{} }
    function __imagenLoadState(){ try{ return JSON.parse(localStorage.getItem('Nano Banan:lastRun')||'{}'); }catch{ return {}; } }
    function __imagenClearState(){ try{ localStorage.removeItem('Nano Banan:lastRun'); }catch{} }

    // Wrap onResult to persist result_url
    (function(){
      if (typeof window.onResult === 'function' && !window.onResult.__persistWrapped){
        const __orig = window.onResult;
        window.onResult = function(url){
          try{
            const s = __imagenLoadState();
            s.result_url = url; s.failed = false;
            __imagenSaveState(s);
          }catch{}
          return __orig.apply(this, arguments);
        };
        window.onResult.__persistWrapped = true;
      }
    })();

    // On load: ONLY localStorage restore
    document.addEventListener('DOMContentLoaded', () => {
      const s = __imagenLoadState();
      if (s && s.result_url){
        if (typeof window.onResult === 'function') try{ window.onResult(s.result_url); }catch{}
      } else if (s && s.id && s.uid){
        if (typeof window.imagenCheckPoll === 'function') try{ window.imagenCheckPoll(s.id, s.uid, s.run_id); }catch{}
      }
    });

    // Clear state before a new run
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('runBtn');
      if (btn && !btn.__persistHooked){
        btn.__persistHooked = true;
        btn.addEventListener('click', function(){ try{ __imagenClearState(); }catch{}; }, { capture:true });
      }
    });
  </script>

  <!-- Poller: imagenCheckPoll(id, uid, run_id) -->
  <script>
    async function imagenCheckPoll(id, uid, run_id){
      if(!id) return;
      let tries = 0; const MAX = 180; // ~15 mins @ 5s
      while(tries < MAX){
        tries++;
        try{
          const r = await fetch('/.netlify/functions/nb-check?taskId=' + encodeURIComponent(id), {
            headers: uid ? { 'X-USER-ID': uid } : {}
          });
          let j = {}; try { j = await r.json(); } catch{}
          const status = String(j.status || j.data?.status || j.result?.status || j.state || '').toLowerCase();
          if (status === 'succeeded' || status === 'success' || status === 'completed' || status === 'done' || j.ok){
            const url =
              j.image_url ||
              (Array.isArray(j.output) ? j.output[0] : null) ||
              j.url ||
              (j.result && j.result.url) ||
              (j.data && j.data.url) || null;
            if (url){
              onResult(url);
              // persist handled by onResult wrapper
              return;
            }
          }
          if (status === 'failed' || status === 'error' || j.failed){
            showStatus('❌ Generation failed.','text-rose-300');
            return;
          }
        }catch{}
        await new Promise(res=>setTimeout(res,5000));
      }
    }
  </script>

  <!-- Run flow (no server-first, no realtime, no DB polling, no backfill/resumeFromPending) -->
  <script>
    async function chargeOneCredit(){
      const { data } = await supabase.auth.getUser();
      if (!data.user) return;
      const prof = await supabase.from('profiles').select('credits').eq('user_id', data.user.id).maybeSingle();
      const cur = prof?.data?.credits ?? 0;
      if (cur < 0.5) throw new Error('Not enough credits (need 0.5).');
      await supabase.from('profiles').update({ credits: cur - 0.5 }).eq('user_id', data.user.id);
      const nav = document.getElementById('navCredits'); if (nav) nav.textContent = (Math.round((cur-0.5)*1000)/1000) + '⚡';
    }

    function derivePublicUrl(up){
      if (!up) return null;
      if (up.publicUrl) return up.publicUrl;
      try{
        if (up.bucket && up.objectPath && up.uploadUrl){
          const u = new URL(up.uploadUrl);
          const enc = up.objectPath.split('/').map(encodeURIComponent).join('/');
          return `${u.protocol}//${u.host}/storage/v1/object/public/${encodeURIComponent(up.bucket)}/${enc}`;
        }
      }catch(e){}
      return null;
    }

    window.__run = async function(){
      const { data:authData } = await supabase.auth.getUser();
      if(!authData.user){ alert('Please log in or register first.'); return; }

      // Hard credit check
      try{
        const { data: prof } = await supabase.from('profiles').select('credits').eq('user_id', authData.user.id).maybeSingle();
        const cur = prof?.credits ?? 0;
        if (cur < 0.5) { showStatus('Not enough credits (need 0.5).','text-rose-300'); return; }
      }catch{}

      __done = false;
      const files = [...filesEl.files];
      if (!files.length){ alert('Choose at least one image.'); return; }
      if (files.length > 4){ alert('Max 4 images.'); return; }
      for (const f of files){ if (f.size > 10*1024*1024){ alert('File too large: '+f.name); return; } }

      runBtn.disabled = true; runBtn.textContent='Uploading…';
      showStatus('Uploading images…','text-zinc-400');
      resultBox.innerHTML='<span class="text-xs text-zinc-500 animate-pulse">Generating… this can take ~20–60s</span>';

      try{
        const uid = authData.user.id;
        const rid = uid + '-' + Date.now();

        if (!window.kieUploadBridge || typeof window.kieUploadBridge.upload !== 'function') {
          throw new Error('Upload bridge missing');
        }
        const uploadOne = async (f) => {
          const up = await window.kieUploadBridge.upload(f);
          const url = derivePublicUrl(up);
          if (!url) throw new Error('No public URL for '+f.name);
          try { await fetch(url, { method:'HEAD', cache:'no-store' }); } catch{}
          return url;
        };
        const settled = await Promise.allSettled(files.map(uploadOne));
        const urls = settled.filter(x=>x.status==='fulfilled' && x.value).map(x=>x.value);
        if (urls.length === 0){ showStatus('Upload failed: no image URLs','text-rose-300'); return; }

        runBtn.textContent='Submitting…'; showStatus('Submitting…','text-zinc-400');
        const res = await fetch('/.netlify/functions/run-nano-banana', {
          method:'POST',
          headers:{'Content-Type':'application/json','X-USER-ID':uid},
          body: JSON.stringify({ urls, prompt:(promptEl.value||'.'), format:'png', size:(document.getElementById('size')?.value||'auto'), run_id: rid })
        });
        if (!res.ok && res.status !== 202){
          const t = await res.text().catch(()=>'');
          throw new Error('Create failed: '+t);
        }

        await chargeOneCredit();
        const resJson = await res.json().catch(()=>({}));
        const taskId = resJson?.taskId || resJson?.data?.taskId || resJson?.id || null;

        // Save ticket to localStorage (Imagen-style)
        try{ __imagenSaveState({ id: taskId, uid, run_id: rid, result_url: null, failed:false }); }catch{}

        showStatus('✅ Submitted. Waiting for result…','text-emerald-300');
        runBtn.textContent='Processing…';

        // Start polling strictly via imagenCheckPoll
        await imagenCheckPoll(taskId, uid, rid);

      }catch(e){
        showStatus('❌ '+(e.message||String(e)), 'text-rose-300');
      }finally{
        runBtn.disabled = false; runBtn.textContent='Run (cost: 0.5⚡)';
      }
    };
  </script>

  <!-- Small UX helpers: delete thumbnails + simple validation wrapper -->
  <script>
    (function(){
      function ready(fn){ if(document.readyState!=='loading') fn(); else document.addEventListener('DOMContentLoaded', fn); }
      ready(function(){
        var filesEl = document.getElementById('files');
        var thumbsEl = document.getElementById('thumbs');
        var promptEl = document.getElementById('prompt');

        if (!filesEl || !thumbsEl) return;

        function enhanceThumbs(){
          var imgs = Array.from(thumbsEl.querySelectorAll('img'));
          imgs.forEach(function(img, idx){
            if (img.closest('.nb-thumb-wrap')) return;
            var wrap = document.createElement('span');
            wrap.className = 'nb-thumb-wrap relative inline-block';
            img.parentNode.insertBefore(wrap, img);
            wrap.appendChild(img);
            var del = document.createElement('button');
            del.type = 'button';
            del.className = 'absolute -top-2 -right-2 h-7 w-7 rounded-full bg-black/70 border border-white/20 text-white/80 hover:text-white hover:bg-black/90 flex items-center justify-center';
            del.setAttribute('aria-label','Remove image');
            del.innerHTML = '&times;';
            del.addEventListener('click', function(){
              try {
                var dt = new DataTransfer();
                Array.from(filesEl.files).forEach(function(f, i){ if (i !== idx) dt.items.add(f); });
                filesEl.files = dt.files;
              } catch(e){}
              wrap.remove();
              setTimeout(enhanceThumbs, 0);
            });
            wrap.appendChild(del);
          });
        }

        filesEl.addEventListener('change', function(){ setTimeout(enhanceThumbs, 0); });

        if (typeof window.__run === 'function'){
          var __origRun = window.__run;
          window.__run = async function(){
            try{
              var hasImg = filesEl && filesEl.files && filesEl.files.length > 0;
              var promptVal = (promptEl && promptEl.value ? promptEl.value : '').trim();
              if (!hasImg || !promptVal){
                alert('Please upload at least one image and enter a prompt.');
                return;
              }
            }catch(e){}
            return __origRun();
          };
        }
      });
    })();
  </script>
