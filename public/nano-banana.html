<!-- Live credits + wrappers (1:1 with working image feature) -->
<script>
  // === Live credits (Supabase Realtime) + pre-run check ===
  (async function HANSORA_LIVE_CREDITS(){
    try{
      const navCreditsEl = document.getElementById('navCredits');
      const runBtn = document.getElementById('runBtn');
      function renderCredits(c){
        if (navCreditsEl) navCreditsEl.textContent = (c ?? 0) + '⚡';
        if (runBtn) {
          const ok = true;
          runBtn.disabled=false;
          runBtn.classList.toggle('opacity-50', !ok);
          runBtn.classList.toggle('cursor-not-allowed', !ok);
        }
      }

      const { data: userData } = await supabase.auth.getUser();
      const user = userData?.user;
      if(!user) return;

      // initial fetch
      const { data: prof } = await supabase
        .from('profiles')
        .select('credits')
        .eq('user_id', user.id)
        .maybeSingle();
      renderCredits(prof?.credits ?? 0);

      // subscribe to updates
      supabase.channel('credits_live_' + user.id)
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles', filter: 'user_id=eq.' + user.id },
          (payload) => { renderCredits(payload.new?.credits ?? 0); }
        )
        .subscribe();

      // patch __run to guard when credits are 0 (without changing its internals)
      const __origRun = window.__run;
      window.__run = async function(){
        try{
          const { data: prof2 } = await supabase
            .from('profiles')
            .select('credits')
            .eq('user_id', user.id)
            .maybeSingle();
          const c = prof2?.credits ?? 0;
          // Minimal guard: block if below 0.5 (lowest possible cost)
          if (c < 0.5) {
            console.warn('No credits left.');
            alert('Not enough credits.');
            return;
          }
        }catch{}
        return __origRun ? __origRun() : undefined;
      };
    }catch(e){ console.warn('credits live failed', e); }
  })();
  </script>
<script>
  (function(){
    function ready(fn){ if(document.readyState!=='loading') fn(); else document.addEventListener('DOMContentLoaded', fn); }
    ready(async function(){
      try{
        if (typeof supabase === 'undefined' || !supabase.auth) return;

        async function __refreshCredits(){
          try{
            const ures = await supabase.auth.getUser();
            const user = ures?.data?.user; if(!user) return null;
            const { data: prof } = await supabase.from('profiles').select('credits').eq('user_id', user.id).maybeSingle();
            const c = prof?.credits ?? 0;
            const nav = document.getElementById('navCredits'); if (nav) nav.textContent = (c ?? 0) + '⚡';
            const runBtn = document.getElementById('runBtn'); if (runBtn){
              const zero = false;
              runBtn.disabled = zero;
              runBtn.classList.toggle('opacity-50', zero);
              runBtn.classList.toggle('cursor-not-allowed', zero);
            }
            return c;
          }catch(e){ console.warn('refreshCredits failed', e); return null; }
        }

        // On load
        await __refreshCredits();

        // Wrap chargeCost (client debit) to repaint after debit
        if (typeof window.chargeCost === 'function'){
          const __origCharge = window.chargeCost;
          window.chargeCost = async function(cost){
            const out = await __origCharge(cost);
            await __refreshCredits();
            return out;
          };
        }

        // Also poll briefly after Run to catch server-side debit
        if (typeof window.__run === 'function'){
          const __origRun = window.__run;
          window.__run = async function(){
            const ret = await __origRun();
            const id = setInterval(__refreshCredits, 1500);
            setTimeout(()=>clearInterval(id), 15000);
            return ret;
          };
        }
      }catch(e){ console.warn('live credits wrapper error', e); }
    });
  })();
  </script>

// Guarded renderer
let __done=false;
function onResult(url){
  if(__done || !url) return;
  __done = true;
  const img=new Image();
  img.onload=()=>{
    resultBox.innerHTML='';
    img.className='w-full h-full object-contain';
    resultBox.appendChild(img);
    const __name = (url.split('/').pop()||'imagen');
    downloadLink.href='/.netlify/functions/download-proxy?url='+encodeURIComponent(url)+'&name='+encodeURIComponent(__name);
    downloadLink.setAttribute('download', __name);

    showStatus('✅ Done.','text-emerald-300');
  runBtn.disabled=false; runBtn.textContent=(modelChoice.value==='ultra'?'Run (cost: 1⚡)':'Run (cost: 0.5⚡)');
    };
  img.src=url;

async function chargeCost(cost){
  const {data}=await supabase.auth.getUser(); if(!data.user) return;
  const prof=await supabase.from('profiles').select('credits').eq('user_id',data.user.id).maybeSingle();
  const cur=prof?.data?.credits??0;
  if(cur < cost) throw new Error('Not enough credits (need '+cost+').');
  await supabase.from('profiles').update({credits:cur - cost}).eq('user_id',data.user.id);
}

// Poller
async function imagenCheckPoll(id, uid, rid){
  if(!id) return;
  const start = Date.now();
  while(!__done && Date.now() - start < 180000){
    try{
      const r = await fetch('/.netlify/functions/imagen-check?id='+encodeURIComponent(id)+'&uid='+encodeURIComponent(uid||'')+'&run_id='+encodeURIComponent(rid||''));
      const j = await r.json().catch(()=>({}));
      const status = String(j.status || '').toLowerCase();
      if(status === 'succeeded' || j.ok){
        const url = j.image_url || (Array.isArray(j.output) ? j.output[0] : null);
        if(url){ onResult(url); break; }
      }
      if(status === 'failed' || status === 'canceled'){
        showStatus('❌ Generation failed.','text-rose-300');
        runBtn.disabled=false; runBtn.textContent=(modelChoice.value==='ultra'?'Run (cost: 1⚡)':'Run (cost: 0.5⚡)');
        break;
      }
    }catch{}
    await new Promise(r=>setTimeout(r,1500));
  }
  if(!__done){
    showStatus('There was an error while generating, please try again or contact us (your credits is refunded).','text-yellow-300');
    runBtn.disabled=false; runBtn.textContent=(modelChoice.value==='ultra'?'Run (cost: 1⚡)':'Run (cost: 0.5⚡)');
  }
}

// Main run
window.__run=async function(){
  const {data:authData}=await supabase.auth.getUser();
  if(!authData.user){ alert('Please log in or register first.'); return; }

  // Reset old result actions
  downloadLink.classList.add('hidden'); downloadLink.removeAttribute('href');

  __done=false;
  const prompt=(promptEl.value||'').trim();
  if(!prompt){ alert('Please enter a prompt.'); return; }

  const model = modelChoice.value === 'ultra' ? 'ultra' : 'fast';
  const cost  = model === 'ultra' ? COST_ULTRA : COST_FAST;

  // HARD CREDIT CHECK
  try{
    const { data: prof } = await supabase.from('profiles').select('credits').eq('user_id', authData.user.id).maybeSingle();
    const cur = prof?.credits ?? 0;
    if (cur < cost) {
      showStatus('Not enough credits (need '+cost+').','text-rose-300');
      runBtn.disabled = false; runBtn.textContent = (model==='ultra'?'Run (cost: 1⚡)':'Run (cost: 0.5⚡)');
      return;
    }
  }catch(_){}

  runBtn.disabled=true; runBtn.textContent='Working…';
  showStatus('Submitting…','text-zinc-400');
  resultBox.innerHTML='<span class="text-xs text-zinc-500 animate-pulse">Generating… this can take ~5–20s</span>';

  try{
    const uid=authData.user.id;
    const rid=uid+'-'+Date.now();

    const res=await fetch('/.netlify/functions/run-imagen',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-USER-ID':uid},
      body:JSON.stringify({
        prompt, aspect_ratio: ratioEl.value || '1:1',
        model, run_id: rid
      })
    });

    if (res.status === 201 || res.status === 200 || res.status === 202) {
      /* client-side debit removed */
    } else {
      const errT = await res.text().catch(()=> '');
      throw new Error('Create failed: ' + errT);
    }

    const resJson = await res.json().catch(()=> ({}));
    const id = resJson?.id || resJson?.prediction_id || resJson?.data?.id || null;

    showStatus('✅ Submitted. Waiting for result…','text-emerald-300');

    // Start polling prediction
    imagenCheckPoll(id, uid, rid);

  }catch(e){
    showStatus('❌ '+(e.message||String(e)),'text-rose-300');
  } finally{ /* keep disabled while polling; re-enabled on success/fail/timeout */ }
};

<!-- Hansora minimal persistence (append-only, safe) -->
<script>
(function(){
  function __imagenSaveState(state){
    try{ localStorage.setItem('imagen:lastRun', JSON.stringify(state||{})); }catch{}
  }
  function __imagenLoadState(){
    try{ return JSON.parse(localStorage.getItem('imagen:lastRun')||'{}'); }catch{ return {}; }
  }
  function __imagenClearState(){
    try{ localStorage.removeItem('imagen:lastRun'); }catch{}
  }
  // Wrap imagenCheckPoll to capture (id, uid, run_id) on first call after submit
  if (typeof window.imagenCheckPoll === 'function' && !window.imagenCheckPoll.__persistWrapped){
    const __origPoll = window.imagenCheckPoll;
    window.imagenCheckPoll = async function(id, uid, run_id){
      try{
        const s = __imagenLoadState();
        if (!s || !s.id || s.id !== id){
          __imagenSaveState({ id, uid, run_id, result_url: null, failed:false });
        }
      }catch{}
      return await __origPoll.apply(this, arguments);
    };
    window.imagenCheckPoll.__persistWrapped = true;
  }
  // Wrap onResult(url) to cache the final URL
  if (typeof window.onResult === 'function' && !window.onResult.__persistWrapped){
    const __origRes = window.onResult;
    window.onResult = function(url){
      try{
        const s = __imagenLoadState(); s.result_url = url; s.failed=false; __imagenSaveState(s);
      }catch{}
      return __origRes.apply(this, arguments);
    };
    window.onResult.__persistWrapped = true;
  }
  // Resume on load for the same user
  document.addEventListener('DOMContentLoaded', async () => {
    try{
      if (typeof supabase === 'undefined' || !supabase.auth) return;
      const { data: userData } = await supabase.auth.getUser();
      const user = userData?.user;
      if(!user) return;
      const s = __imagenLoadState();
      if(!s || !s.uid || s.uid !== user.id) return;
      if (s.result_url && typeof window.onResult === 'function'){
        try{ window.onResult(s.result_url); }catch{}
        try{ showStatus && showStatus('Last result restored.', 'text-emerald-300'); }catch{}
        return;
      }
      if (s.id && s.run_id && typeof window.imagenCheckPoll === 'function'){
        try{ showStatus && showStatus('Resuming your previous run…', 'text-zinc-300'); }catch{}
        await window.imagenCheckPoll(s.id, s.uid, s.run_id);
      }
    }catch{}
  });
  // Clear cache before a new run via Run button (non-invasive)
  document.addEventListener('DOMContentLoaded', () => {
    try{
      const btn = document.getElementById('runBtn');
      if (btn && !btn.__persistHooked){
        btn.__persistHooked = true;
        btn.addEventListener('click', function(){ try{ __imagenClearState(); }catch{}; }, { capture:true });
      }
    }catch{}
  });
})();
</script>

<!-- ===== Imagen: server-first restore + pending TTL resume (parity with Nano Banana) ===== -->
<script>
// Server-first: fetch the most recent Imagen run from Supabase on load and render it.
// Mirrors Nano Banana logic but scoped to provider "Imagen".
document.addEventListener('DOMContentLoaded', async function imagen_serverFirstLatest(){
  try{
    if (typeof supabase === 'undefined' || !supabase.auth) return;
    const ures = await supabase.auth.getUser();
    const user = ures?.data?.user;
    if (!user) return;

    const { data: row } = await supabase
      .from('user_generations').select('id,user_id,provider,result_url,created_at,run_id')
      .eq('user_id', user.id)
      .eq('provider','Imagen')
      .order('created_at', { ascending: false })
      .limit(1)
      .maybeSingle();

    if (!row) return;

    const url = row.result_url || null;

    if (url){
      // Terminal success from server — render and persist
      if (!window.__done && typeof window.onResult === 'function') {
        window.__renderedFromServer = true;
        window.onResult(url);
        try { localStorage.setItem('im_last_run', JSON.stringify({ ok:true, url })); } catch {}
        try {
          const pend = JSON.parse(localStorage.getItem('im_pending') || 'null');
          if (pend && pend.run_id === row.run_id) localStorage.removeItem('im_pending');
        } catch {}
      }
      return;
    }

    // If we got a row but no result_url (pending/failed), clear stale pending for same run_id
    try {
      const pend = JSON.parse(localStorage.getItem('im_pending') || 'null');
      if (pend && pend.run_id === row.run_id) localStorage.removeItem('im_pending');
    } catch {}

    // Otherwise seed pending to allow resume polling from the DB later
    try {
      const startedAt = new Date(row.created_at).getTime();
      localStorage.setItem('im_pending', JSON.stringify({ pending:true, taskId:null, run_id: row.run_id, startedAt, ttl:200 }));
    } catch {}
  }catch(e){ console.warn('imagen_serverFirstLatest error', e); }
});
</script>

<script>
// Pending TTL resume for Imagen (same shape as NB: "im_pending").
document.addEventListener('DOMContentLoaded', function imagen_resumeFromPending(){
  try{
    const raw = localStorage.getItem('im_pending');
    if (!raw) return;
    const p = JSON.parse(raw);
    const ttlMs = (p.ttl || 200) * 1000;
    const remaining = ttlMs - (Date.now() - (p.startedAt || 0));
    if (remaining <= 0){
      (async () => {
        const msg = '❌ Generation failed. Credits refunded. Try again or contact us.';
        try{ await (window.refundHalfCreditOnce ? window.refundHalfCreditOnce(p.taskId) : Promise.resolve(false)); }catch{}
        if (typeof window.showStatus === 'function') window.showStatus(msg, 'text-rose-300');
        try { localStorage.setItem('im_last_run', JSON.stringify({ ok:false, msg: msg })); } catch {}
        try { localStorage.removeItem('im_pending'); } catch {}
      })();
      return;
    }
    (async () => {
      const started = Date.now();
      while (!window.__done && Date.now() - started < remaining){
        await new Promise(r => setTimeout(r, 1500));
        try{
          const { data: row } = await supabase
            .from('user_generations').select('result_url')
            .eq('run_id', p.run_id)
            .eq('provider','Imagen')
            .maybeSingle();
          const url = row?.result_url || null;
          if (url){
            if (typeof window.onResult === 'function') window.onResult(url);
            try { localStorage.setItem('im_last_run', JSON.stringify({ ok:true, url })); } catch {}
            try { localStorage.removeItem('im_pending'); } catch {}
            break;
          }
        }catch(e){}
      }
      if (!window.__done){
        const msg = '❌ Generation failed. Credits refunded. Try again or contact us.';
        try{ await (window.refundHalfCreditOnce ? window.refundHalfCreditOnce(p.taskId) : Promise.resolve(false)); }catch{}
        if (typeof window.showStatus === 'function') window.showStatus(msg, 'text-rose-300');
        try { localStorage.setItem('im_last_run', JSON.stringify({ ok:false, msg: msg })); } catch {}
        try { localStorage.removeItem('im_pending'); } catch {}
      }
    })();
  }catch(e){ console.warn('imagen_resumeFromPending error', e); }
});
</script>

<script>
// Minimal backfill helpers (non-destructive), mirroring NB names but Imagen-safe.
async function imagen_backfillSubmitted(uid, rid, taskId){
  try{
    await fetch('/.netlify/functions/imagen-callback?uid='+encodeURIComponent(uid)+'&run_id='+encodeURIComponent(rid)+'&id='+encodeURIComponent(taskId||''),{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ status:'submitted', result:{} })
    });
  }catch{}
}
</script>

<script>
// Hook into the existing __run to set im_pending and backfill "submitted" — without changing core flow.
document.addEventListener('DOMContentLoaded', () => {
  try{
    if (typeof window.__run !== 'function') return;
    const __origRun = window.__run;
    if (window.__run.__imHooked) return;
    window.__run.__imHooked = true;

    window.__run = async function(){
      const prev = Date.now();
      const ret = await __origRun();

      // Best-effort: after submit, try to detect (id, uid, run_id) from persisted local ticket
      try{
        const s = JSON.parse(localStorage.getItem('imagen:lastRun') || '{}');
        // Some flows save only at first poll; seed im_pending immediately with a fresh run_id if possible
        if (s && s.uid && s.run_id){
          const ticket = {
            pending: true,
            taskId: s.id || s.taskId || null,
            run_id: s.run_id,
            startedAt: Date.now(),
            ttl: 200
          };
          localStorage.setItem('im_pending', JSON.stringify(ticket));
          if (s.uid && s.run_id) imagen_backfillSubmitted(s.uid, s.run_id, ticket.taskId);
        }
      }catch{}

      return ret;
    };
  }catch(e){ console.warn('im_pending hook error', e); }
});
</script>

<script>
// Small helper so Imagen can refund like NB if needed; no-ops if not used elsewhere.
window.refundHalfCreditOnce = window.refundHalfCreditOnce || (async function(taskId){
  try{
    const key = 'im_refunded_' + (taskId || 'unknown');
    if (localStorage.getItem(key)) return false;
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return false;
    const { data: prof } = await supabase.from('profiles').select('credits').eq('user_id', user.id).maybeSingle();
    const cur = prof?.credits ?? 0;
    const next = Math.round((cur + 0.5) * 1000) / 1000;
    await supabase.from('profiles').update({ credits: next }).eq('user_id', user.id);
    const nav = document.getElementById('navCredits'); if (nav) nav.textContent = next + '⚡';
    localStorage.setItem(key, '1');
    return true;
  }catch(e){ console.warn('refundHalfCreditOnce (Imagen) failed', e); return false; }
});
</script>
