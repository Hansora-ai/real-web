<script>
(function(){
  function ready(fn){ if(document.readyState!=='loading') fn(); else document.addEventListener('DOMContentLoaded', fn); }
  ready(async function(){
    try{
      if (typeof supabase === 'undefined' || !supabase.auth) return;

      async function __refreshCredits(){
        try{
          const ures = await supabase.auth.getUser();
          const user = ures?.data?.user; if(!user) return null;
          const { data: prof } = await supabase.from('profiles').select('credits').eq('user_id', user.id).maybeSingle();
          const c = prof?.credits ?? 0;
          const nav = document.getElementById('navCredits'); if (nav) nav.textContent = (c ?? 0) + '⚡';
          const runBtn = document.getElementById('runBtn'); if (runBtn){
            const zero = false;
            runBtn.disabled = zero;
            runBtn.classList.toggle('opacity-50', zero);
            runBtn.classList.toggle('cursor-not-allowed', zero);
          }
          return c;
        }catch(e){ console.warn('refreshCredits failed', e); return null; }
      }

      // On load
      await __refreshCredits();

      // Wrap chargeOneCredit (client debit) to repaint after debit
      if (typeof window.chargeOneCredit === 'function'){
        const __origCharge = window.chargeOneCredit;
        window.chargeOneCredit = async function(){
          const out = await __origCharge();
          await __refreshCredits();
          return out;
        };
      }

      // Also poll briefly after Run to catch server-side debit
      if (typeof window.__run === 'function'){
        const __origRun = window.__run;
        window.__run = async function(){
          const ret = await __origRun();
          // poll for 15s every 1.5s
          const id = setInterval(__refreshCredits, 1500);
          setTimeout(()=>clearInterval(id), 15000);
          return ret;
        };
      }
    }catch(e){ console.warn('live credits wrapper error', e); }
  });
})();
</script>

<!-- Delete buttons + safe validation (additive, non-destructive) -->
<script>
(function(){
  function ready(fn){ if(document.readyState!=='loading') fn(); else document.addEventListener('DOMContentLoaded', fn); }

  ready(function(){
    var filesEl = document.getElementById('files') || document.querySelector('input[type=file][id*="file"]');
    var thumbsEl = document.getElementById('thumbs') || document.querySelector('#thumbs, .thumbs, [data-role="thumbs"]');
    var promptEl = document.getElementById('prompt') || document.querySelector('textarea[name="prompt"], #promptEl');

    if (!filesEl || !thumbsEl) return;

    function enhanceThumbs(){
      // Wrap plain IMG nodes with a relative container + delete button.
      var imgs = Array.from(thumbsEl.querySelectorAll('img'));
      imgs.forEach(function(img, idx){
        if (img.closest('.nb-thumb-wrap')) return; // already wrapped

        var wrap = document.createElement('span');
        wrap.className = 'nb-thumb-wrap relative inline-block';
        img.parentNode.insertBefore(wrap, img);
        wrap.appendChild(img);

        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'absolute -top-2 -right-2 h-7 w-7 rounded-full bg-black/70 border border-white/20 text-white/80 hover:text-white hover:bg-black/90 flex items-center justify-center';
        del.setAttribute('aria-label','Remove image');
        del.innerHTML = '&times;';

        del.addEventListener('click', function(){
          try {
            var dt = new DataTransfer();
            Array.from(filesEl.files).forEach(function(f, i){
              if (i !== idx) dt.items.add(f);
            });
            filesEl.files = dt.files;
          } catch(e){ /* ignore */ }

          // Remove UI thumb and re-index remaining
          wrap.remove();
          // Re-run to re-bind indexes
          setTimeout(enhanceThumbs, 0);
        });

        wrap.appendChild(del);
      });
    }

    // After the built-in change handler updates the thumbs, enhance them.
    filesEl.addEventListener('change', function(){ setTimeout(enhanceThumbs, 0); });

    // Run once in case thumbs already exist on load (hot re-render etc.)
    setTimeout(enhanceThumbs, 0);

    // Safe validation without touching original __run
    if (typeof window.__run === 'function'){
      var __origRun = window.__run;
      window.__run = async function(){
        try{
          var hasImg = filesEl && filesEl.files && filesEl.files.length > 0;
          var promptVal = (promptEl && promptEl.value ? promptEl.value : '').trim();
          if (!hasImg || !promptVal){
            alert('Please upload at least one image and enter a prompt.');
            return;
          }
        }catch(e){ /* ignore */ }
        return __origRun();
      };
    }
  });
})();
</script>
<script>

<script>
// ==== Imagen-style minimal persistence for Nano Banana ====
(function(){
  const KEY = 'nb_last_run';
  function __nbSaveState(state){ try{ localStorage.setItem(KEY, JSON.stringify(state||{})); }catch{} }
  function __nbLoadState(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch{ return {}; } }
  function __nbClearState(){ try{ localStorage.removeItem(KEY); }catch{} }

  // Wrap nbCheckPoll to capture (taskId, uid, run_id) on first call after submit
  if (typeof window.nbCheckPoll === 'function' && !window.nbCheckPoll.__persistWrapped){
    const __origPoll = window.nbCheckPoll;
    window.nbCheckPoll = async function(taskId, uid, run_id){
      try{
        const s = __nbLoadState();
        if (!s || !s.taskId || s.taskId !== taskId){
          __nbSaveState({ taskId, uid, run_id, result_url: null, failed:false });
        }
      }catch{}
      return await __origPoll.apply(this, arguments);
    };
    window.nbCheckPoll.__persistWrapped = true;
  }

  // Wrap onResult(url) to cache the final URL
  if (typeof window.onResult === 'function' && !window.onResult.__persistWrapped){
    const __origRes = window.onResult;
    window.onResult = function(url){
      try{
        const s = __nbLoadState(); s.result_url = url; s.failed=false; __nbSaveState(s);
      }catch{}
      return __origRes.apply(this, arguments);
    };
    window.onResult.__persistWrapped = true;
  }

  // Resume on load for the same user (prefer latest server truth but ensure resume works)
  document.addEventListener('DOMContentLoaded', async () => {
    try{
      if (typeof supabase === 'undefined' || !supabase.auth) return;
      const { data: userData } = await supabase.auth.getUser();
      const user = userData?.user;
      if(!user) return;
      const s = __nbLoadState();
      if(!s || !s.uid || s.uid != user.id) return;

      // If server-first already rendered something, skip

      // If we have a saved result -> restore it
      if (s.result_url && typeof window.onResult === 'function'){
        try{ window.onResult(s.result_url); }catch{}
        try{ showStatus && showStatus('Last result restored.', 'text-emerald-300'); }catch{}
        return;
      }
      // Else, resume polling with saved ids
      if (s.taskId && s.run_id && typeof window.nbCheckPoll === 'function'){
        try{ showStatus && showStatus('Resuming your previous run…', 'text-zinc-300'); }catch{}
        await window.nbCheckPoll(s.taskId, s.uid, s.run_id);
      }
    }catch{}
  });

  // Clear cache before a new run via Run button (non-invasive)
  document.addEventListener('DOMContentLoaded', () => {
    try{
      const btn = document.getElementById('runBtn');
      if (btn && !btn.__persistHooked){
        btn.__persistHooked = true;
        btn.addEventListener('click', function(){ try{ __nbClearState(); }catch{}; }, { capture:true });
      }
    }catch{}
  });
})();
</script>


<script>
function __imagenSaveState(state){ try{ localStorage.setItem('Nano Banan:lastRun', JSON.stringify(state||{})); }catch{} }
function __imagenLoadState(){ try{ return JSON.parse(localStorage.getItem('Nano Banan:lastRun')||'{}'); }catch{ return {}; } }
function __imagenClearState(){ try{ localStorage.removeItem('Nano Banan:lastRun'); }catch{} }

// Wrap onResult to persist result_url
(function(){
  if (typeof window.onResult === 'function' && !window.onResult.__persistWrapped){
    const __orig = window.onResult;
    window.onResult = function(url){
      try{
        const s = __imagenLoadState(); s.result_url = url; s.failed = false; __imagenSaveState(s);
      }catch{}
      return __orig.apply(this, arguments);
    };
    window.onResult.__persistWrapped = true;
  }
})();

// On load: strict localStorage-only resume
document.addEventListener('DOMContentLoaded', () => {
  const s = __imagenLoadState();
  if (s && s.result_url) {
    if (typeof window.onResult === 'function') try{ window.onResult(s.result_url); }catch{}
  } else if (s && s.id && s.uid) {
    if (typeof window.imagenCheckPoll === 'function') try{ window.imagenCheckPoll(s.id, s.uid, s.run_id); }catch{}
  }
});

// Clear state before a new run
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('runBtn');
  if (btn && !btn.__persistHooked){
    btn.__persistHooked = true;
    btn.addEventListener('click', function(){ try{ __imagenClearState(); }catch{}; }, { capture:true });
  }
});
</script>


<script>
if (typeof window.nbCheckPoll === 'function' && !window.imagenCheckPoll){
  window.imagenCheckPoll = function(id, uid, run_id){ return window.nbCheckPoll(id, uid, run_id); };
}
</script>
