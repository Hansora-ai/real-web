<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HANSORA • Character Creator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%235b5ce2'/%3E%3Ctext x='50' y='60' font-size='54' text-anchor='middle' fill='white' font-family='Arial'%3EH%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="/header.css" rel="stylesheet" />
  <style>html.hansora-i18n-pending body{opacity:0!important;pointer-events:none!important}</style>
  <script>
    (function hansoraI18nPreload(){
      try {
        if (localStorage.getItem('hansora.language') === 'ru') {
          document.documentElement.classList.add('hansora-i18n-pending');
          setTimeout(function () {
            document.documentElement.classList.remove('hansora-i18n-pending');
          }, 5000);
        }
      } catch (_) {}
    })();
  </script>
  <script defer src="/header.js"></script>
  <style>
    :root{
      --base-bg:#050714;
      --base-line:#15182a;
      --brand:#6366f1;
      --brand-2:#8b5cf6;
      --hot:#ff25c8;
      --cyan:#38bdf8;
      --glass:rgba(8,10,22,.64);
      --glass-2:rgba(255,255,255,.055);
      --muted:rgba(229,231,235,.68);
    }
    *{ box-sizing:border-box; }
    html{ min-height:100%; background:var(--base-bg); }
    body{
      min-height:100vh;
      margin:0;
      color:#f8fafc;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",sans-serif;
      background:
        radial-gradient(1100px 560px at 50% -10%, rgba(255,37,200,.34), transparent 62%),
        radial-gradient(820px 520px at 18% 18%, rgba(99,102,241,.20), transparent 60%),
        radial-gradient(900px 620px at 92% 85%, rgba(56,189,248,.13), transparent 62%),
        linear-gradient(180deg,#050714 0%,#070817 42%,#03040a 100%);
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(90deg,transparent 0 49.9%,rgba(255,255,255,.035) 50%,transparent 50.1%),
        radial-gradient(circle at 50% 0%,rgba(255,255,255,.10),transparent 25%);
      mask-image:linear-gradient(to bottom, black 0%, transparent 62%);
      opacity:.45;
      z-index:0;
    }
    #sharedHeader{
      position:fixed;
      top:0;
      left:0;
      right:0;
      z-index:80;
    }
    .page-shell{
      position:relative;
      z-index:1;
      width:min(1460px,100%);
      margin:0 auto;
      padding:18px 22px 44px;
    }
    .top-results{
      position:relative;
      min-height:220px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:28px;
      background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
      overflow:hidden;
      box-shadow:0 26px 90px rgba(0,0,0,.38);
    }
    .top-results::before{
      content:"";
      position:absolute;
      inset:-120px 12% auto 12%;
      height:320px;
      background:radial-gradient(ellipse at center, rgba(255,37,200,.58), rgba(139,92,246,.28) 35%, transparent 72%);
      filter:blur(20px);
      opacity:.85;
    }
    .top-results::after{
      content:"";
      position:absolute;
      left:50%;
      top:0;
      width:min(500px,78vw);
      height:100%;
      transform:translateX(-50%);
      background:linear-gradient(180deg,rgba(255,122,232,.22),transparent 72%);
      clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);
      filter:blur(12px);
      opacity:.9;
    }
    .result-content{
      position:relative;
      z-index:2;
      padding:18px;
    }
    .section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      margin-bottom:14px;
    }
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:rgba(255,255,255,.70);
      font-size:12px;
      font-weight:850;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .live-dot{
      width:8px;
      height:8px;
      border-radius:999px;
      background:#d9ff3c;
      box-shadow:0 0 18px rgba(217,255,60,.9);
    }
    .section-title{
      margin:5px 0 0;
      font-size:clamp(22px,3vw,42px);
      line-height:1;
      font-weight:900;
      letter-spacing:-.04em;
    }
    .tiny-btn{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.07);
      color:rgba(255,255,255,.84);
      min-height:38px;
      border-radius:999px;
      padding:0 14px;
      font-size:12px;
      font-weight:800;
      cursor:pointer;
      transition:transform .16s ease, border-color .16s ease, background .16s ease;
    }
    .tiny-btn:hover{ transform:translateY(-1px); border-color:rgba(255,37,200,.55); background:rgba(255,37,200,.10); }
    .history-rail{
      display:grid;
      grid-template-columns:repeat(12, minmax(92px,1fr));
      gap:10px;
      overflow:auto;
      padding-bottom:3px;
      scrollbar-width:thin;
    }
    .history-card{
      position:relative;
      min-height:142px;
      border-radius:18px;
      overflow:hidden;
      background:rgba(2,6,23,.64);
      border:1px solid rgba(255,255,255,.10);
      cursor:pointer;
      transform:translateZ(0);
    }
    .history-card img{
      width:100%;
      height:100%;
      min-height:142px;
      object-fit:cover;
      display:block;
      transition:transform .3s ease, filter .3s ease;
    }
    .history-card:hover img{ transform:scale(1.045); filter:saturate(1.08); }
    .history-card::after{
      content:"";
      position:absolute;
      inset:auto 0 0 0;
      height:50%;
      background:linear-gradient(180deg,transparent,rgba(0,0,0,.72));
      pointer-events:none;
    }
    .history-label{
      position:absolute;
      left:9px;
      right:9px;
      bottom:8px;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      font-size:10px;
      color:rgba(255,255,255,.76);
      font-weight:760;
    }
    .history-empty{
      grid-column:1 / -1;
      min-height:142px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      border:1px dashed rgba(255,255,255,.12);
      border-radius:18px;
      color:rgba(255,255,255,.58);
      background:rgba(2,6,23,.34);
      padding:18px;
    }
    .creator-stage{
      position:relative;
      width:min(1120px,100%);
      margin:26px auto 0;
      padding:28px 24px 24px;
      min-height:590px;
      border-radius:34px;
      border:1px solid rgba(255,255,255,.10);
      background:
        radial-gradient(700px 420px at 50% 0%, rgba(255,37,200,.22), transparent 68%),
        linear-gradient(180deg,rgba(9,11,24,.74),rgba(3,4,11,.78));
      box-shadow:0 34px 120px rgba(0,0,0,.52), inset 0 1px 0 rgba(255,255,255,.07);
      overflow:hidden;
      isolation:isolate;
    }
    .creator-stage::before{
      content:"";
      position:absolute;
      left:50%;
      top:-12px;
      width:min(560px,80vw);
      height:410px;
      transform:translateX(-50%);
      background:linear-gradient(180deg,rgba(255,99,229,.38),rgba(99,102,241,.16),transparent);
      clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);
      filter:blur(16px);
      opacity:.82;
      z-index:-1;
      animation:beamPulse 6s ease-in-out infinite;
    }
    @keyframes beamPulse{
      0%,100%{ opacity:.68; transform:translateX(-50%) scaleX(.94); }
      50%{ opacity:1; transform:translateX(-50%) scaleX(1.04); }
    }
    .studio-note{
      text-align:center;
      color:var(--muted);
      max-width:720px;
      margin:0 auto 18px;
      font-size:14px;
      line-height:1.45;
    }
    .studio-pill{
      width:max-content;
      max-width:100%;
      margin:0 auto 10px;
      display:flex;
      align-items:center;
      gap:8px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.07);
      border-radius:999px;
      padding:7px 13px;
      color:rgba(255,255,255,.82);
      font-size:12px;
      font-weight:850;
      box-shadow:0 0 32px rgba(255,37,200,.18);
    }
    .progress-wrap{
      width:min(760px,100%);
      margin:0 auto 18px;
      border-radius:999px;
      padding:20px 34px 16px;
      background:linear-gradient(90deg,rgba(255,37,200,.22),rgba(99,102,241,.18));
      border:1px solid rgba(255,255,255,.18);
      box-shadow:0 18px 54px rgba(139,92,246,.28), inset 0 1px 0 rgba(255,255,255,.12);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }
    .progress-line{
      position:relative;
      height:3px;
      background:rgba(255,255,255,.18);
      border-radius:999px;
    }
    .progress-fill{
      position:absolute;
      left:0;
      top:0;
      height:3px;
      width:0%;
      border-radius:999px;
      background:linear-gradient(90deg,#fff,#ff8ce9,#d9ff3c);
      box-shadow:0 0 18px rgba(255,255,255,.5);
      transition:width .42s cubic-bezier(.22,1,.36,1);
    }
    .progress-steps{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      margin-top:-11px;
      position:relative;
      z-index:2;
    }
    .step-dot{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      color:rgba(255,255,255,.50);
      font-size:11px;
      font-weight:850;
    }
    .step-dot i{
      width:18px;
      height:18px;
      border-radius:999px;
      background:rgba(255,255,255,.24);
      border:2px solid rgba(255,255,255,.18);
      box-shadow:0 0 0 5px rgba(10,10,22,.25);
      transition:.25s ease;
    }
    .step-dot.active,
    .step-dot.done{ color:#fff; }
    .step-dot.active i,
    .step-dot.done i{
      background:#fff;
      border-color:#fff;
      box-shadow:0 0 0 5px rgba(255,37,200,.16),0 0 24px rgba(255,37,200,.85);
    }
    .selected-zone{
      width:min(720px,100%);
      margin:0 auto 13px;
      min-height:62px;
      border-bottom:1px solid rgba(255,255,255,.14);
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:8px;
      padding:8px 0 10px;
      flex-wrap:wrap;
    }
    .selected-empty{
      color:rgba(255,255,255,.45);
      font-size:12px;
      align-self:center;
    }
    .choice-token{
      display:inline-flex;
      align-items:center;
      gap:9px;
      min-height:42px;
      border-radius:999px;
      padding:5px 13px 5px 6px;
      color:#111827;
      font-size:14px;
      font-weight:900;
      background:linear-gradient(135deg,#ffe6fa,#ff8ce9,#ffffff);
      box-shadow:0 0 20px rgba(255,37,200,.55),0 8px 22px rgba(0,0,0,.24);
      animation:tokenPop .34s cubic-bezier(.2,1.3,.36,1) both, tokenFloat 3.8s ease-in-out infinite;
    }
    .choice-token:nth-child(2n){ transform:rotate(-3deg); animation-delay:0s,.2s; }
    .choice-token:nth-child(3n){ transform:rotate(4deg); animation-delay:0s,.36s; }
    .choice-token .mini{
      width:31px;
      height:31px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      background:linear-gradient(135deg,#111827,#8b5cf6);
      border:1px solid rgba(255,255,255,.38);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
    }
    @keyframes tokenPop{ from{ opacity:0; transform:translateY(16px) scale(.76) rotate(-8deg); } to{ opacity:1; } }
    @keyframes tokenFloat{ 0%,100%{ translate:0 0; } 50%{ translate:0 -4px; } }
    .prompt-only{
      width:min(720px,100%);
      margin:0 auto 16px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.045);
      border-radius:22px;
      padding:12px;
      transition:.22s ease;
    }
    .prompt-only.locked{
      opacity:.47;
      filter:saturate(.55);
    }
    .prompt-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:8px;
    }
    .prompt-top strong{
      font-size:13px;
      letter-spacing:-.01em;
    }
    .prompt-top span{
      color:rgba(255,255,255,.50);
      font-size:11px;
      font-weight:750;
    }
    #promptOnly{
      width:100%;
      min-height:74px;
      resize:vertical;
      border:1px solid rgba(255,255,255,.10);
      outline:none;
      border-radius:16px;
      background:rgba(2,6,23,.60);
      color:#fff;
      padding:12px;
      font-size:13px;
      line-height:1.4;
    }
    #promptOnly:focus{
      border-color:rgba(255,37,200,.55);
      box-shadow:0 0 0 4px rgba(255,37,200,.12);
    }
    #promptOnly:disabled{
      cursor:not-allowed;
      color:rgba(255,255,255,.38);
    }
    .step-head{
      width:min(840px,100%);
      margin:0 auto 14px;
      display:grid;
      grid-template-columns:110px 1fr 110px;
      align-items:center;
      gap:12px;
    }
    .nav-btn{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.065);
      color:rgba(255,255,255,.82);
      min-height:40px;
      border-radius:999px;
      padding:0 14px;
      font-size:12px;
      font-weight:850;
      cursor:pointer;
      transition:.18s ease;
    }
    .nav-btn:hover:not(:disabled){
      border-color:rgba(255,37,200,.55);
      background:rgba(255,37,200,.12);
      color:#fff;
      transform:translateY(-1px);
    }
    .nav-btn:disabled{ opacity:.35; cursor:not-allowed; }
    .step-copy{
      text-align:center;
    }
    .step-copy h2{
      margin:0;
      font-size:clamp(22px,2.4vw,32px);
      line-height:1;
      font-weight:950;
      letter-spacing:-.045em;
      text-shadow:0 0 20px rgba(255,37,200,.18);
    }
    .step-copy p{
      margin:8px auto 0;
      max-width:580px;
      color:rgba(255,255,255,.58);
      font-size:13px;
      line-height:1.35;
    }
    .options-frame{
      position:relative;
      width:min(910px,100%);
      margin:0 auto;
    }
    .option-rail{
      display:flex;
      gap:13px;
      overflow-x:auto;
      overflow-y:hidden;
      padding:8px 56px 16px;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .option-rail::-webkit-scrollbar{ display:none; }
    .option-card{
      position:relative;
      flex:0 0 176px;
      height:238px;
      border:1px solid rgba(255,255,255,.13);
      border-radius:24px;
      background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.025));
      padding:7px;
      overflow:hidden;
      cursor:pointer;
      scroll-snap-align:center;
      transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease, opacity .2s ease, filter .2s ease;
    }
    .option-card:hover{
      transform:translateY(-5px);
      border-color:rgba(255,37,200,.55);
      box-shadow:0 18px 42px rgba(0,0,0,.34),0 0 0 1px rgba(255,37,200,.18);
    }
    .option-card.selected{
      border-color:rgba(255,37,200,.96);
      box-shadow:0 0 0 2px rgba(255,37,200,.38),0 0 42px rgba(255,37,200,.34);
    }
    .prompt-mode-active .option-card{
      opacity:.34;
      filter:saturate(.35) blur(.2px);
      pointer-events:none;
    }
    .card-art{
      position:relative;
      height:178px;
      border-radius:19px;
      overflow:hidden;
      background:
        radial-gradient(circle at 22% 18%, rgba(255,255,255,.56), transparent 18%),
        radial-gradient(circle at 70% 26%, var(--c2), transparent 26%),
        linear-gradient(150deg,var(--c1),var(--c3));
    }
    .card-art::before{
      content:"";
      position:absolute;
      left:50%;
      bottom:-16px;
      width:82px;
      height:126px;
      transform:translateX(-50%);
      border-radius:42px 42px 18px 18px;
      background:linear-gradient(180deg,rgba(255,255,255,.84),rgba(15,23,42,.92) 54%,rgba(2,6,23,.98));
      box-shadow:0 0 36px rgba(255,255,255,.20);
      opacity:.82;
    }
    .card-art::after{
      content:"";
      position:absolute;
      left:50%;
      top:45px;
      width:50px;
      height:58px;
      transform:translateX(-50%);
      border-radius:50% 50% 46% 46%;
      background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(15,23,42,.95));
      box-shadow:0 12px 26px rgba(0,0,0,.28);
    }
    .card-art.image-card{
      background:#020617;
    }
    .card-art.image-card::before,
    .card-art.image-card::after{
      display:none;
    }
    .card-art img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .art-icon{
      position:absolute;
      right:10px;
      top:10px;
      z-index:2;
      width:38px;
      height:38px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,.28);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      font-size:18px;
    }
    .card-title{
      height:45px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:rgba(255,255,255,.88);
      font-size:14px;
      font-weight:900;
      letter-spacing:-.02em;
    }
    .rail-arrow{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:42px;
      height:42px;
      border-radius:999px;
      z-index:4;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(2,6,23,.76);
      color:#fff;
      font-size:24px;
      line-height:1;
      cursor:pointer;
      box-shadow:0 14px 34px rgba(0,0,0,.34);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }
    .rail-arrow:hover{ border-color:rgba(255,37,200,.6); background:rgba(255,37,200,.18); }
    .rail-arrow.prev{ left:4px; }
    .rail-arrow.next{ right:4px; }
    .details-panel{
      width:min(720px,100%);
      margin:0 auto;
      padding:8px 0 10px;
    }
    .details-panel.hidden{ display:none; }
    #extraDetails{
      width:100%;
      min-height:118px;
      resize:vertical;
      border:1px solid rgba(255,255,255,.12);
      border-radius:22px;
      background:rgba(2,6,23,.64);
      color:#fff;
      outline:none;
      padding:16px;
      font-size:14px;
      line-height:1.45;
    }
    #extraDetails:focus{
      border-color:rgba(255,37,200,.58);
      box-shadow:0 0 0 4px rgba(255,37,200,.12);
    }
    .action-row{
      width:min(720px,100%);
      margin:8px auto 0;
      display:grid;
      grid-template-columns:1fr 220px;
      gap:12px;
      align-items:center;
    }
    .status-line{
      min-height:48px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.09);
      background:rgba(255,255,255,.04);
      color:rgba(255,255,255,.68);
      display:flex;
      align-items:center;
      padding:10px 14px;
      font-size:12px;
      line-height:1.35;
    }
    .status-line.success{ color:#bbf7d0; border-color:rgba(34,197,94,.28); background:rgba(34,197,94,.08); }
    .status-line.error{ color:#fecaca; border-color:rgba(248,113,113,.28); background:rgba(248,113,113,.08); }
    .run-btn{
      position:relative;
      min-height:54px;
      border:0;
      border-radius:18px;
      background:linear-gradient(135deg,#ff25c8,#8b5cf6);
      color:#fff;
      font-size:15px;
      font-weight:950;
      letter-spacing:-.02em;
      cursor:pointer;
      box-shadow:0 17px 46px rgba(255,37,200,.34), inset 0 1px 0 rgba(255,255,255,.24);
      overflow:hidden;
      transition:transform .18s ease, filter .18s ease, opacity .18s ease;
    }
    .run-btn::before{
      content:"";
      position:absolute;
      inset:-1px;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);
      transform:translateX(-120%);
      animation:shine 3.2s ease-in-out infinite;
    }
    @keyframes shine{ 55%,100%{ transform:translateX(120%); } }
    .run-btn:hover:not(:disabled){ transform:translateY(-2px); filter:saturate(1.18); }
    .run-btn:disabled{ opacity:.45; cursor:not-allowed; filter:saturate(.5); }
    .processing-card{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      text-align:center;
    }
    .processing-orb{
      width:48px;
      height:48px;
      border-radius:18px;

    function escapeHtml(value){
      return String(value || '').replace(/[&<>"']/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));

        value.task_id ||
        value.id ||
        value.data?.taskId ||
        value.data?.task_id ||
        value.data?.id ||
        value.result?.taskId ||
        value.result?.task_id ||

      ).trim();

    function renderProgress(){

      const activeIndex = Math.min(state.stepIndex, CHARACTER_STEPS.length);

      els.progressFill.style.width = percent + '%';

      const labels = [...CHARACTER_STEPS.map(step => step.label), 'Details'];
      els.progressSteps.innerHTML = labels.map((label, index) => {
        const cls = index < activeIndex ? 'done' : (index === activeIndex ? 'active' : '');
        return `<div class="step-dot ${cls}"><i></i><span>${escapeHtml(label)}</span></div>`;
      }).join('');
    }

    function renderSelectedTokens(){
      const selected = CHARACTER_STEPS

        .filter(item => item.option);

      if (!selected.length) {
        els.selectedZone.innerHTML = '<span class="selected-empty">Your selected character DNA appears here.</span>';
        return;
      }

      els.selectedZone.innerHTML = selected.map(({ step, option }) => `
        <div class="choice-token" data-step-id="${escapeHtml(step.id)}">

    function renderOptions(){
      const step = currentStep();
      const details = isDetailsStep();
      els.creatorStage.classList.toggle('details-mode', details);

      els.optionsFrame.style.display = details ? 'none' : '';
      els.detailsPanel.classList.toggle('hidden', !details);

      if (details) {

      els.stepTitle.textContent = step.title;

          return `

        return `
          <button class="option-card ${selected ? 'selected' : ''}" type="button" data-option-id="${escapeHtml(option.id)}" aria-label="${escapeHtml(option.title)}">

              ${imageUrl ? `<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(option.title)} card image" loading="lazy" />` : `<span class="art-icon">${escapeHtml(option.icon || '✦')}</span>`}
            </div>

      }).join('');

      requestAnimationFrame(() => { els.optionRail.scrollLeft = 0; });

    function renderRunState(){
      const readyByPrompt = typedPrompt().length > 3 && !hasSelections();
      const readyByCards = hasSelections() && isDetailsStep();
      const ready = !state.busy && !!state.currentUser && (readyByPrompt || readyByCards);
      const loginRequiredMessage = 'Log in first, then this page can create and show your last 12 characters.';

      els.runBtn.disabled = !ready;
      if (!state.currentUser) {
        setStatus(loginRequiredMessage, 'error');
      } else if (state.busy) {
        setStatus('Creating your character. The result icon is added to your last 12 row.', 'success');
      } else if (els.statusLine.textContent.trim() === loginRequiredMessage) {
        setStatus('', '');
      }
    }

    function renderAll(){
      renderProgress();
      renderSelectedTokens();
      renderOptions();
      updatePromptMode();
    }

    function selectOption(optionId){
      if (state.promptMode || typedPrompt()) return;
      const step = currentStep();
      if (!step) return;
      const option = step.options.find(item => item.id === optionId);
      if (!option) return;

      state.selections[step.id] = option;
      renderSelectedTokens();

      const clicked = els.optionRail.querySelector(`[data-option-id="${CSS.escape(optionId)}"]`);
      if (clicked) {
        clicked.classList.add('selected');
        clicked.animate([
          { transform:'translateY(-5px) scale(1)' },
          { transform:'translateY(-10px) scale(1.035)' },
          { transform:'translateY(-5px) scale(1)' }
        ], { duration: 360, easing:'cubic-bezier(.2,1.2,.36,1)' });
      }

      setTimeout(() => {
        if (state.stepIndex < CHARACTER_STEPS.length) {
          state.stepIndex += 1;
          renderAll();
        }
      }, 300);

    function applyCustomEthnicity(value){
      if (state.busy || state.promptMode || typedPrompt()) return;
      const clean = String(value || '').trim().replace(/\s+/g, ' ');
      if (clean.length < 2) return;
      const step = currentStep();
      if (!step || step.id !== 'ethnicity') return;
      state.selections.ethnicity = {
        id: 'custom',
        title: clean,
        icon: '✎',
        colors: ['#94a3b8', '#e879f9', '#111827'],
        customValue: clean,
        prompt: `Ethnicity direction: ${clean}. Represent this naturally and respectfully with believable facial structure, skin undertones, and realistic human variation.`
        };
      renderSelectedTokens();
      setTimeout(() => {
        if (currentStep() && currentStep().id === 'ethnicity') {
          state.stepIndex += 1;
          renderAll();
        }
      }, 220);
    }

    function clearSelectionsFrom(startIndex){
      for (let i = startIndex; i < CHARACTER_STEPS.length; i += 1) {
        delete state.selections[CHARACTER_STEPS[i].id];
      }
    }

    function removeSelection(stepId){
      const index = CHARACTER_STEPS.findIndex(step => step.id === stepId);
      if (index < 0 || state.busy) return;
      clearSelectionsFrom(index);
      state.stepIndex = index;
      renderAll();
    }

    function goBack(){
      if (state.stepIndex <= 0 || state.busy) return;
      const targetIndex = state.stepIndex - 1;
      clearSelectionsFrom(targetIndex);
      state.stepIndex = targetIndex;
      renderAll();
    }

    function skipStep(){
      if (state.busy) return;
      if (state.stepIndex < CHARACTER_STEPS.length) {
        state.stepIndex += 1;
        renderAll();
      } else {
        renderRunState();
      }
    }

    function buildPrompt(){
      const direct = typedPrompt();
      if (direct && !hasSelections()) {
        return `${CUSTOM_PROMPT_WRAP}\n${direct}`;
      }

      const parts = [BASE_PROMPT];
      for (const step of CHARACTER_STEPS) {
        const selected = state.selections[step.id];
        if (selected && selected.prompt) {
          parts.push(`${step.label}: ${selected.title}. ${selected.prompt}`);
        }
      }

      const extra = (els.extraDetails.value || '').trim();
      if (extra) {
        parts.push(`Additional user detail: ${extra}`);
      }

      parts.push('Final output: one polished PNG image in vertical 3:4 format, character framed from above the legs, super photorealistic, no text, no watermark, no UI frame.');
      return parts.join('\n\n');
    }

    function addProcessingCard(runId){
      const empty = els.historyRail.querySelector('.history-empty');
      if (empty) empty.remove();

      const card = document.createElement('div');
      card.className = 'history-card processing-card';
      card.dataset.runId = runId;
      card.innerHTML = `
        <div class="processing-orb"></div>
        <div class="history-label" style="position:static;display:block;color:rgba(255,255,255,.82);">Creating...</div>
      `;
      els.historyRail.prepend(card);
      requestAnimationFrame(() => {
        els.historyRail.scrollTo({ left:0, behavior:'smooth' });
        card.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'start' });
      });

      while (els.historyRail.children.length > 12) {
        els.historyRail.lastElementChild.remove();
      }
      return card;
    }

    function processingCardHtml(row){
      const meta = row && row.meta ? row.meta : {};
      const runId = meta.run_id || '';
      const taskId = meta.task_id || meta.taskId || '';
      return `
        <article class="history-card processing-card" data-run-id="${escapeHtml(runId)}" data-task-id="${escapeHtml(taskId)}" aria-label="Character processing">
          <div class="processing-orb"></div>
          <div class="history-label" style="position:static;display:block;color:rgba(255,255,255,.82);">Creating...</div>
        </article>
      `;
    }

    function failedCardHtml(row){
      const meta = row && row.meta ? row.meta : {};
      const reason = meta.error || 'Failed';
      return `
        <article class="history-card processing-card" aria-label="Character failed" title="${escapeHtml(reason)}">
          <div class="history-empty" style="min-height:100%;height:100%;border:0;background:transparent;color:#fecaca;">Failed</div>
        </article>
      `;
    }

    function setHistoryEmpty(message){
      els.historyRail.classList.add('is-empty');
      els.historyRail.innerHTML = `<div class="history-empty">${escapeHtml(message)}</div>`;
    }

    function renderHistoryRows(rows){
      if (!rows || !rows.length) {
        setHistoryEmpty('No character results yet. Generate one and it will appear here.');
        return;
      }

      els.historyRail.classList.remove('is-empty');
      els.historyRail.innerHTML = rows.slice(0,12).map((row, index) => {
        const meta = row.meta || {};
        const status = String(meta.status || (row.result_url ? 'ready' : 'processing')).toLowerCase();
        if (!row.result_url && (status.includes('fail') || status.includes('error'))) return failedCardHtml(row);
        if (!row.result_url) return processingCardHtml(row);
        const date = row.created_at ? new Date(row.created_at) : null;
        const label = date && !Number.isNaN(date.getTime()) ? date.toLocaleDateString(undefined, { month:'short', day:'numeric' }) : 'Character';
        return `
          <article class="history-card" data-url="${escapeHtml(row.result_url)}" aria-label="Open character ${index + 1}">
            <img src="${escapeHtml(row.result_url)}" alt="Generated character ${index + 1}" loading="lazy" />
            <div class="history-label"><span>Character</span><span>${escapeHtml(label)}</span></div>
            <a class="history-get" href="${escapeHtml(row.result_url)}" target="_blank" rel="noopener" download>Get</a>
          </article>
        `;
      }).join('');
    }

    function resumeProcessingRows(rows){
      if (!state.currentUser || !rows || !rows.length) return;
      rows.forEach((row)=>{
        const meta = row.meta || {};
        const runId = meta.run_id || '';
        const taskId = meta.task_id || meta.taskId || '';
        const status = String(meta.status || (row.result_url ? 'ready' : 'processing')).toLowerCase();
        if (!runId || row.result_url || status.includes('fail') || status.includes('error')) return;
        const card = els.historyRail.querySelector(`[data-run-id="${CSS.escape(runId)}"]`);
        if (card) pollGeneration({ uid:state.currentUser.id, runId, taskId, card, resumed:true });
      });
    }

    async function loadRecentCharacters(){
      if (!state.currentUser) {
        setHistoryEmpty('Log in to see the last 12 characters created from this page.');
        return;
      }

      const { data, error } = await supabaseClient
        .from('user_generations')
        .select('id,prompt,result_url,created_at,provider,kind,meta')
        .eq('user_id', state.currentUser.id)
        .eq('provider', 'Nano Banana 2')
        .eq('kind', 'image')
        .ilike('prompt', '%HANSORA_CHARACTER_CREATOR%')
        .order('created_at', { ascending:false })
        .limit(12);

      if (error) {
        console.warn('loadRecentCharacters failed', error);
        setHistoryEmpty('Could not load character history right now.');
        return;
      }

      renderHistoryRows(data || []);
      resumeProcessingRows(data || []);
    }

    async function refreshCredits(){
      try {
        if (!state.currentUser) return;
        const { data } = await supabaseClient
          .from('profiles')
          .select('credits')
          .eq('user_id', state.currentUser.id)
          .maybeSingle();
        const credits = Number(data && data.credits ? data.credits : 0);
        if (window.HansoraHeader && typeof window.HansoraHeader.setCredits === 'function') {
          window.HansoraHeader.setCredits(credits);
        }
      } catch (error) {
        console.warn('refreshCredits failed', error);
      }
    }

    function startCreditPolling(){
      if (window.HansoraHeader && typeof window.HansoraHeader.startCreditsPolling === 'function') {
        window.HansoraHeader.startCreditsPolling(120000, 1500);
      }
    }

    async function pollGeneration({ uid, runId, taskId, card, resumed = false }){
      if (!uid || !runId || !card) return;
      if (activePolls.has(runId)) return;
      activePolls.add(runId);
      const maxTries = 48;
      try {
        for (let attempt = 0; attempt < maxTries; attempt += 1) {
          if (!(resumed && attempt === 0)) await new Promise(resolve => setTimeout(resolve, attempt < 2 ? 2600 : 4200));
          try {
            const url = `/.netlify/functions/kie-check?uid=${encodeURIComponent(uid)}&run_id=${encodeURIComponent(runId)}&taskId=${encodeURIComponent(taskId || '')}`;
            const res = await fetch(url, { cache:'no-store' });
            const data = await res.json().catch(() => null);
            if (data && data.status === 'done' && (data.result_url || data.image_url)) {
              const imageUrl = data.result_url || data.image_url;
              card.className = 'history-card';
              card.dataset.url = imageUrl;
              card.innerHTML = `
                <img src="${escapeHtml(imageUrl)}" alt="Generated character" />
                <div class="history-label"><span>Character</span><span>Ready</span></div>
                <a class="history-get" href="${escapeHtml(imageUrl)}" target="_blank" rel="noopener" download>Get</a>
              `;
              setStatus('Character is ready. It is now in your last 12 characters row.', 'success');
              await refreshCredits();
              await loadRecentCharacters();
              return;
            }
            if (data && (data.status === 'failed' || data.failed)) {
              card.innerHTML = '<div class="history-empty" style="min-height:100%;height:100%;border:0;background:transparent;color:#fecaca;">Generation failed. Credits refunded if the provider charged.</div>';
              setStatus(`Generation failed: ${data.error || 'provider error'}`, 'error');
              await refreshCredits();
              return;
            }
          } catch (error) {
            console.warn('pollGeneration failed', error);
          }
        }
        setStatus('Still processing. Use Refresh in a moment to pull the result when KIE finishes.', '');
        await refreshCredits();
      } finally {
        activePolls.delete(runId);
      }
    }

    async function runGeneration(){
      if (state.busy) return;

      const readyByPrompt = typedPrompt().length > 3 && !hasSelections();
      const readyByCards = hasSelections() && isDetailsStep();
      if (!readyByPrompt && !readyByCards) {
        setStatus('Finish the card path, skip to Details, or type a prompt-only idea first.', 'error');
        return;
      }

      // Lock before the first asynchronous call so even rapid double-clicks submit only once.
      state.busy = true;
      renderRunState();

      let userData;
      try {
        const response = await supabaseClient.auth.getUser();
        userData = response && response.data ? response.data : null;
      } catch (error) {
        setStatus(`Could not verify your account: ${error && error.message ? error.message : error}`, 'error');
        state.busy = false;
        renderRunState();
        return;
      }
      const user = userData && userData.user ? userData.user : null;
      if (!user) {
        setStatus('Please log in first. The real site header login button is loaded from your shared header.', 'error');
        state.busy = false;
        renderRunState();
        return;
      }
      state.currentUser = user;

      const prompt = buildPrompt();
      const runId = `character_${user.id}_${Date.now()}_${Math.random().toString(16).slice(2)}`;
      const card = addProcessingCard(runId);

      let accessToken = '';
      try {
        const { data: sessionData } = await supabaseClient.auth.getSession();
        accessToken = sessionData && sessionData.session && sessionData.session.access_token ? sessionData.session.access_token : '';
      } catch (_) {}

      try {
        const res = await fetch('/.netlify/functions/run-nano-banana-2', {
          method:'POST',
          headers:Object.assign(
            { 'Content-Type':'application/json', 'X-USER-ID': user.id },
            accessToken ? { 'Authorization': `Bearer ${accessToken}` } : {}
          ),
          body:JSON.stringify({
            uid: user.id,
            run_id: runId,
            prompt,
            size:'3:4',
            resolution:'2K',
            format:'png'
          })
        });

        const json = await res.json().catch(() => null);
        if (!res.ok || !json || !json.ok) {
          const msg = json && (json.error || json.message) ? (json.error || json.message) : `status ${res.status}`;
          card.innerHTML = '<div class="history-empty" style="min-height:100%;border:0;background:transparent;">Not submitted</div>';
          setStatus(`Error from model: ${msg}`, 'error');
          await refreshCredits();
          return;
        }

        startCreditPolling();
        setStatus('Request submitted to Nano Banana 2 in 2K. Creating the result icon in the last 12 row.', 'success');
        await refreshCredits();
        pollGeneration({ uid:user.id, runId, taskId: taskIdFrom(json), card });
      } catch (error) {
        console.error(error);
        card.innerHTML = '<div class="history-empty" style="min-height:100%;border:0;background:transparent;">Submit error</div>';
        setStatus(`Submit error: ${error && error.message ? error.message : error}`, 'error');
      } finally {
        state.busy = false;
        renderRunState();
      }
    }

    async function loadUser(){
      try {
        const { data } = await supabaseClient.auth.getUser();
        state.currentUser = data && data.user ? data.user : null;
        await loadRecentCharacters();
        renderRunState();
      } catch (error) {
        console.warn('loadUser failed', error);
        renderRunState();
      }
    }

    function openPreview(url){
      if (!url) return;
      els.previewImage.src = url;
      els.previewOverlay.classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closePreview(){
      els.previewOverlay.classList.remove('show');
      els.previewImage.src = '';
      document.body.style.overflow = '';
    }

    els.optionRail.addEventListener('input', (event) => {
      const customInput = event.target.closest('[data-custom-ethnicity-input]');
      if (!customInput) return;
      clearTimeout(state.customEthnicityTimer);
      state.customEthnicityTimer = setTimeout(() => applyCustomEthnicity(customInput.value), 650);
    });

    els.optionRail.addEventListener('keydown', (event) => {
      const customInput = event.target.closest('[data-custom-ethnicity-input]');
      if (!customInput || event.key !== 'Enter' || event.shiftKey) return;
      event.preventDefault();
      clearTimeout(state.customEthnicityTimer);
      applyCustomEthnicity(customInput.value);
    });

    els.optionRail.addEventListener('click', (event) => {
      const card = event.target.closest('.option-card');
      if (!card || !card.dataset.optionId) return;
      selectOption(card.dataset.optionId);
    });

    els.historyRail.addEventListener('click', (event) => {
      if (event.target.closest('.history-get')) return;
      const card = event.target.closest('.history-card[data-url]');
      if (!card) return;
      openPreview(card.dataset.url);
    });

    els.backBtn.addEventListener('click', goBack);
    els.skipBtn.addEventListener('click', skipStep);
    els.railPrev.addEventListener('click', () => els.optionRail.scrollBy({ left:-380, behavior:'smooth' }));
    els.railNext.addEventListener('click', () => els.optionRail.scrollBy({ left:380, behavior:'smooth' }));
    els.promptOnly.addEventListener('input', updatePromptMode);
    els.extraDetails.addEventListener('input', renderRunState);
    els.runBtn.addEventListener('click', runGeneration);
    els.refreshHistoryBtn.addEventListener('click', loadRecentCharacters);
    els.previewOverlay.addEventListener('click', (event) => { if (event.target === els.previewOverlay) closePreview(); });
    document.querySelector('.preview-close').addEventListener('click', closePreview);
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closePreview(); });

    supabaseClient.auth.onAuthStateChange((_event, session) => {
      state.currentUser = session && session.user ? session.user : null;
      loadRecentCharacters();
      renderRunState();
    });

    renderAll();
    loadUser();
  </script>
</body>
</html>
