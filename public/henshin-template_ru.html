<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Добавить шаблон Henshin | Hansora AI</title>
<link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/header.css"><link rel="stylesheet" href="/henshin.css?v=20261006-locales1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="/henshin-i18n.js?v=20261006-locales1"></script>
<script defer src="/header.js"></script><script defer src="/kie-upload-bridge.js"></script><script defer src="/henshin-config.js"></script>
  <script defer src="/henshin-media.js?v=20261006-locales1"></script><script defer src="/henshin-template.js?v=20261006-locales1"></script>
</head>
<body><div id="sharedHeader"></div>
<main class="template-editor">
<div class="template-editor-head"><div><span class="eyebrow">БИБЛИОТЕКА ДВИЖЕНИЙ</span><h1>Добавить шаблон</h1></div><a href="/henshin_ru.html">Назад в Henshin ↗</a></div>
<p id="editorAccess" role="status">Проверяем доступ…</p>
<form id="editorForm" hidden>
<div class="template-editor-grid">
<div>
<label class="editor-field"><span>Видео с примером результата</span><input id="editorResult" class="editor-file" type="file" accept="video/*,.mp4,.mov,.webm,.mkv,.avi,.m4v" required></label>
<div id="editorResultMedia" class="editor-media" hidden><button id="editorResultRemove" class="remove-media" type="button" aria-label="Удалить видео с примером результата"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button><video id="editorResultPreview" class="editor-video" controls playsinline></video></div>
<p id="editorResultStatus" class="upload-status" role="status" aria-live="polite"></p>
<p class="library-status">Это видео отображается в библиотеке и окне просмотра.</p>
<label class="editor-field"><span>Исходное видео</span><input id="editorSource" class="editor-file" type="file" accept="video/*,.mp4,.mov,.webm,.mkv,.avi,.m4v" required></label>
<div id="editorSourceMedia" class="editor-media" hidden><button id="editorSourceRemove" class="remove-media" type="button" aria-label="Удалить исходное видео"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button><video id="editorSourcePreview" class="editor-video" controls playsinline></video></div>
<p id="editorSourceStatus" class="upload-status" role="status" aria-live="polite"></p>
<p class="library-status">Кнопка «Воссоздать» загружает этот исходник в генератор. Длительность каждого видео должна быть 4–30 секунд.</p>
</div>
<div>
<label class="editor-field"><span>Изображения-референсы</span><input id="editorReferences" type="file" accept="image/*,.heic,.heif,.tif,.tiff" multiple required></label>
<div id="editorImages"></div>
<p id="editorImageStatus" class="upload-status" role="status" aria-live="polite"></p>
<label class="editor-field"><span>Режим преобразования</span><select id="editorMode"><option value="motion">Перенос движения</option><option value="swap">Замена объекта</option><option value="edit">Редактирование видео</option></select></label>
<label class="editor-field"><span>Промпт · необязательно</span><textarea id="editorPrompt" maxlength="2000" placeholder="Например: замените обоих танцоров моими персонажами, сделайте куртку красной."></textarea></label>
<label class="editor-field"><span>Разрешение</span><select id="editorQuality"><option value="480p">480p</option><option value="720p" selected>720p</option><option value="1080p">1080p</option></select></label>
<label class="audio-option"><input id="editorAudio" type="checkbox" checked>Сохранить исходный звук</label>
</div>
</div>
<p id="editorStatus" role="status" aria-live="polite" class="library-status"></p>
<button id="editorPublish" class="primary editor-publish" type="submit">Опубликовать шаблон</button>
</form>
</main></body></html>
