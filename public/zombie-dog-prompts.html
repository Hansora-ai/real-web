      {title:'Shot 1. Taking aim',image:A.shot1,refs:[A.woman,A.market],duration:8,prompt:`Continuous single take, no cuts, close-up of the same woman from the uploaded reference image, preserve her exact identity, face, facial structure, hairstyle, hair color, age appearance, skin tone, proportions, clothing, accessories, and overall look exactly as shown in the uploaded image, do not redesign or reinterpret her appearance, aiming a bolt-action hunting rifle down a @Image 1 place, sweat running down her temple, strands of hair stuck to her face, dirt and soot, a fresh scrape on her cheekbone, split lip, natural realistic micro-expressions throughout: she holds the aim with her jaw clenched, nostrils flaring as she breathes hard through her nose, eyes glassy with welling tears that she blinks back, her hands and the rifle barrel visibly trembling as she tries to steady herself, then she exhales, holds her breath and slowly closes her eyes ready to fire, a single tear rolls through the dirt on her cheek leaving a clean streak, then her eyes snap open at a sound, her expression breaking from cold determination into heartbreak, she does not sob, her chin trembles and her breathing goes ragged, she slowly lowers the rifle out of the bottom of the frame, her shoulders drop, she looks at him, then lowers her head and shakes it slightly, restrained emotion held back the whole time, interior of an abandoned overgrown supermarket flooded with sunlight, tall shelves packed with rusted cans on both sides thrown far out of focus, hanging ivy and vines, thick overlapping volumetric sunbeams pouring in behind her from torn-open boarded windows and caved-in roof sections, hot rim light on her hair and shoulders, heavy floating dust and pollen catching the light, open airy bounced shadows, bright exposure, warm ochre and gold with grey-green and rust in the midtones, handheld camera with organic breathing shake, no zoom, 50mm, T1.8, shallow depth of field, shot on ARRI Alexa 35, natural highlight rolloff, filmic color science, no HDR, subtle grain, ultra realistic, photorealistic skin texture, cinematic, location.`},
      {title:'Shot 2. Zombie dog',image:A.cover,refs:[A.woman,A.market,A.infected],duration:8,prompt:`Over-the-shoulder shot past the shoulder of the same young woman from the uploaded reference image and the barrel of her lowered rifle, the same infected dog from the uploaded reference image @Image 3 sitting on the concrete six meters away facing her, preserve the dog’s exact appearance and visual details from the uploaded reference image. He whimpers and growls at the same time, ears twitching between flat and upright, trembling, a dog fighting something inside himself, abandoned, location @Image 2. Focus on the dog, handheld camera with organic shake, no zoom, 35mm, desaturated grey-blue with orange spill, ultra realistic, photorealistic, cinematic.`},
      {title:'Shot 3. Putting the 🔫',image:A.shot3,refs:[A.woman,A.market,A.infected],duration:8,prompt:`Medium shot of a young woman @Image 1 slowly crouching down onto her heels in the location exactly as shown in @Image 2, the camera descending with her to floor level. She carefully lays her bolt-action rifle down flat on the floor, wipes her tears with the back of her gloved hand, breathes out shakily and gives a small broken smile, speaking softly to the infected dog as @Image 3. Then she reaches into her jacket pocket and takes out a worn yellow-green tennis ball, holds it up for a moment and rolls it gently down the aisle toward him. Her appearance is exactly as shown in the uploaded woman reference image, interior exactly as shown in the location reference, handheld camera descending with her, 35mm, shallow depth of field, shot on ARRI Alexa 35, natural highlight rolloff, filmic color science, ultra realistic, photorealistic, cinematic.`},
      {title:'Shot 4. Ball rolling / past',image:A.shot4,refs:[A.infected,A.market,A.court,A.healthy],duration:8,prompt:`Extreme low-angle close-up at floor level, locked camera height throughout. First half: a worn yellow-green tennis ball rolling down the location exactly as shown in @Image 2, the camera tracking alongside it. The ball slows and comes to a complete stop right in front of the infected dog’s @Image 1 front paws exactly as shown in the reference, his face not in shot. The frame goes completely still for a beat, then a hard match cut on the motionless ball. Second half: identical framing and identical camera height, the same ball now sitting still in the location exactly as shown in @Image 3, and instantly the healthy dog @Image 4 exactly as shown in the reference snaps his head down into frame and grabs the ball in his mouth, then tosses it, bites it and shakes it playfully, paws dancing. The ball is the only element that stays identical across the cut; everything else changes instantly. Hard cut, not a dissolve, no morphing, no blending. Handheld camera with organic shake throughout, 50mm, shallow depth of field, shot on ARRI Alexa 35, natural highlight rolloff, filmic color science, first half warm ochre and grey-green, second half warm grade with lifted blacks and soft bloom, ultra realistic, photorealistic, cinematic. Ball is bouncing.`},
      {title:'Shot 5. Playing on the court',image:A.shot5,refs:[A.healthy,A.court,A.portrait],duration:8,prompt:`High-angle wide shot looking down over an entire place exactly as shown in @Image 1 from an elevated position, the whole place visible exactly as shown in @Image 1. A young woman exactly as @Image 2 is standing small at one end. She winds up and throws a worn yellow-green tennis ball low across the place, the ball skips and bounces away along the ground, and her healthy dog @Image 3 exactly as shown in the reference explodes into a sprint after it, tearing diagonally across the place, claws scrabbling on the ground. He snatches the ball up on the bounce, wheels around in a wide arc and sprints all the way back to her, drops the ball at her feet and drops onto his front paws waiting, one continuous action. The dog exactly as shown in @Image 3, the woman exactly as shown in her reference, handheld camera with slow organic drift, no zoom, 24mm wide angle from height, shot on ARRI Alexa 35, natural highlight rolloff, filmic color science, no HDR, subtle grain, warm grade, lifted blacks, soft bloom, ultra realistic, photorealistic, cinematic, vertical.`},
      {title:'Shot 6. Cuddling',image:A.shot6,refs:[A.healthy,A.court,A.portrait],duration:5,prompt:`Close-up of a young woman exactly as shown in the reference image @Image 2 laughing openly. She is sitting in the place exactly as shown in @Image 1, playing with her dog exactly as shown in @Image 3, reaching out and tickling and ruffling his chest and neck. Genuine unguarded laughter, natural realistic expression, place exactly as shown in @Image 1, handheld camera moving with the play, 35mm, shot on ARRI Alexa 35, warm grade, lifted blacks, soft bloom, ultra realistic, photorealistic skin texture, cinematic.`},
      {title:'Shot 7. On the van',image:A.shot7,refs:[A.portrait,A.healthy,A.van],duration:5,prompt:`Extreme wide shot from far away across the place exactly as shown in @Image 1. A young woman exactly as shown in the reference @Image 2 and her dog exactly as shown in the reference are sitting together on the roof of the car exactly as shown in @Image 3, both small in the frame. She sits cross-legged eating out of an open tin can with her fingers, picks something out and holds it out to him. The dog leans in and takes it gently from her hand then licks her fingers. She wipes her hand on her trousers and keeps eating, unhurried and quiet, nobody moves much. Open sky, late high sun, long soft dappled shade from overhanging branches, backlit glowing leaves, warm still air, 135mm telephoto compression, atmospheric haze between camera and subject, handheld camera with slow organic drift, shot on ARRI Alexa 35, natural highlight rolloff, filmic color science, warm grade, lifted blacks, soft bloom, ultra realistic, photorealistic, cinematic.`},
      {title:'Additional shot',image:A.additional,refs:[A.market,A.infected],duration:4,aspectRatio:'9:16',prompt:`close-up cinematic shot, [attach Image 1 as the location reference] [attach Image 2 as the dog appearance reference], the same dog from Image 2 sitting alone inside the exact location from Image 1.

Preserve the dog’s appearance exactly as shown in Image 2 with maximum accuracy and recognizability. Keep the exact same breed appearance, body build, proportions, head shape, muzzle, ears, cloudy infected eyes, nose, coat color, coat length and texture, wet and matted fur, bald patches, facial details, scarf, tactical harness, side pouch, yellow bone-shaped charm, and every individual visual characteristic exactly as in Image 2. Do not redesign, beautify, change, or reinterpret the dog.

The dog is sitting still and facing toward the camera in a close-up composition, looking deeply sad, exhausted, lonely, and emotionally broken. The expression is restrained and realistic, not exaggerated: quiet sadness in the eyes and posture, slightly lowered head, subtle tension around the mouth, tired stillness, vulnerable expression. The dog should feel abandoned and emotionally defeated while still remaining calm and disciplined. No aggressive pose, no snarling, no exaggerated monster expression.

Place the dog naturally in the central aisle of the location. Strong soft light enters from behind and above, creating cinematic volumetric rays through suspended dust, subtle rim light around the dog’s ears and fur, and natural separation from the background. Keep the location darker and atmospheric while the dog remains clearly visible. Background softly out of focus but still recognizable as the exact place from Image 1.

close-up framing, dog as the dominant subject, camera approximately at the dog’s eye level, centered composition, slow zoom in throughout the shot, slow cinematic push-in, 50mm lens, shallow depth of field, realistic optical falloff, natural perspective, ARRI Alexa 35 look, natural highlight rolloff, filmic color science, subtle grain, realistic fur detail, realistic skin and wet-fur texture, no HDR look, no artificial sharpening, ultra realistic, photorealistic, cinematic, emotionally heavy,`}

    function itemMarkup(item,index,type){return `<article class="item"><h3>${esc(item.title)}</h3><div class="media"><img src="${esc(item.image)}" alt="${esc(item.title)}" loading="lazy"><button class="preview-btn" type="button" data-preview aria-label="Open image preview">↗</button></div><div class="prompt"><div class="prompt-top"><strong>Prompt</strong><div class="actions"><button class="btn" type="button" data-copy="${type}-${index}">Copy</button><button class="btn recreate" type="button" data-recreate="${type}-${index}">Recreate</button></div></div><pre class="prompt-text">${esc(item.prompt)}</pre></div></article>`}

    const modal=document.getElementById('modal'),modalImage=document.getElementById('modalImage'),toast=document.getElementById('toast');let toastTimer=0;

    function activeSiteLanguage(){const declared=String(document.documentElement.lang||'').toLowerCase();if(declared==='hy'||declared.startsWith('hy-'))return'hy';if(declared==='ru'||declared.startsWith('ru-'))return'ru';try{const saved=localStorage.getItem('hansora.language.v1');if(saved==='hy'||saved==='ru')return saved}catch(_){}return'en'}
    function localizedSearchModels(){const lang=activeSiteLanguage();return lang==='hy'?'search-models_arm.html':lang==='ru'?'search-models_ru.html':'search-models.html'}
    function notify(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1600)}

    document.addEventListener('click',(event)=>{const button=event.target.closest('[data-language-code]');if(!button)return;event.preventDefault();event.stopImmediatePropagation();const selected=button.getAttribute('data-language-code');const language=selected==='hy'||selected==='ru'?selected:'en';try{localStorage.setItem('hansora.language.v1',language)}catch(_){}document.documentElement.lang=language;window.location.reload()},true);
    function closeModal(){modal.classList.remove('open');document.body.style.overflow='';modalImage.removeAttribute('src')}document.getElementById('close').addEventListener('click',closeModal);modal.addEventListener('click',(event)=>{if(event.target===modal)closeModal()});document.addEventListener('keydown',(event)=>{if(event.key==='Escape')closeModal()});
