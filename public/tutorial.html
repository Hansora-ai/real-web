.tutorial-app #gallery{gap:22px}
.tutorial-app #gallery .gallery-column{gap:22px}

.tutorial-app .trend-media{position:relative;display:block;overflow:hidden;aspect-ratio:16/9;background:radial-gradient(circle at 30% 20%,rgba(146,100,237,.34),transparent 42%),linear-gradient(145deg,#292b32,#101114)}
.tutorial-app .trend-media::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.08) 42%,transparent 60%);transform:translateX(-100%);animation:trend-shimmer 1.8s infinite}

.tutorial-app .trend-media.is-video::after{display:grid}
.tutorial-app .trend-media.is-portrait{aspect-ratio:9/16}
.tutorial-app .trend-media.is-landscape{aspect-ratio:16/9}
.tutorial-app .trend-video{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s ease,transform .6s ease}
.tutorial-app .trend-video.is-ready{opacity:1}
.tutorial-app .trend-image{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.tutorial-app #gallery .card .trend-image{width:100%;height:100%;max-height:none;aspect-ratio:auto;object-fit:cover}
.tutorial-app #gallery .card:hover .trend-video,.tutorial-app #gallery .card:hover .trend-image{transform:scale(1.025)}
.tutorial-app #gallery .card h2{margin:0;padding:17px 18px 4px;font-size:19px;line-height:1.25}
.tutorial-app #gallery .card .badge{display:block;padding:0 18px 16px}
.tutorial-app .video-placeholder{display:grid;place-items:center;min-height:280px;padding:24px;text-align:center;color:var(--muted);background:radial-gradient(circle at 50% 30%,rgba(146,100,237,.24),transparent 50%),#15161a}
.tutorial-app .cover.media{width:40%;margin-left:auto;margin-right:auto}
.tutorial-app .cover.media.has-portrait{width:24%}
.tutorial-app .cover.media .trend-media{aspect-ratio:16/9;border-radius:16px}
.tutorial-app .cover.media .trend-media.is-portrait{aspect-ratio:9/16}
.tutorial-app .cover.media .trend-media.is-landscape{aspect-ratio:16/9}
.tutorial-app .cover.media .trend-image,.tutorial-app .cover.media .trend-video{object-fit:contain;background:#0b0c0e}
.tutorial-app .visual.media:has(>video){width:40%!important}
.tutorial-app .visual.media>video{max-height:440px!important;object-fit:contain!important}
.tutorial-app .image-group{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
.tutorial-app .image-group.is-multiple{grid-template-columns:repeat(2,minmax(0,1fr))}
.tutorial-app .image-item{position:relative;min-width:0}
.tutorial-app .image-item img{width:100%;height:auto;object-fit:contain}
.tutorial-app .cover.media .trend-media::after{display:none}
.tutorial-app .cover.media .trend-video{max-height:540px;object-fit:contain}
.tutorial-app .editor-cover-media{display:block;width:min(100%,420px);max-height:260px;object-fit:cover;border-radius:12px;background:#0b0c0e}
.tutorial-app .video-help{display:block;margin-top:7px;color:var(--muted);font-size:12px;line-height:1.45}
@keyframes trend-shimmer{to{transform:translateX(100%)}}

</script><script>(() => {
'use strict';
const OWNER='45c5cfc7-090e-491f-a304-05f863bbdf85', BUCKET='tutorial-media', PAGE=12;
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=v=>{try{const u=new URL(v);return u.protocol==='https:'?u.href:''}catch{return ''}};
const models=window.TUTORIAL_MODELS, modelFor=b=>models.find(m=>m.id===b.model);
let sb,owner=false,record=null,dirty=false,busy=false,offset=0,toastTimer,authId=null;
const status=(message,error=false)=>{const el=$('#status');el.textContent=message;el.classList.toggle('error',error)};
const toast=message=>{$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,2400)};
function mark(){dirty=true;const s=$('#save-state');if(s)s.textContent='Unsaved changes'}
function image(url,alt,cls=''){const u=safeUrl(url);return u?`<img class="${cls}" src="${esc(u)}" alt="${esc(alt)}" loading="lazy" decoding="async">`:''}
function isVideoUrl(value){const u=safeUrl(value);if(!u)return false;try{return /\.(?:mp4|webm|mov|m4v)$/i.test(new URL(u).pathname)}catch{return false}}
function trendVideo(url,label,cls=''){const u=safeUrl(url);return u&&isVideoUrl(u)?`<span class="trend-media is-video"><video class="trend-video ${cls}" data-video-src="${esc(u)}" muted loop playsinline preload="none" aria-label="${esc(label)}"></video></span>`:''}
function trendImage(url,label,cls=''){const u=safeUrl(url);return u&&!isVideoUrl(u)?`<span class="trend-media is-image"><img class="trend-image ${cls}" src="${esc(u)}" alt="${esc(label)}" loading="lazy" decoding="async"></span>`:''}
function trendCover(url,label,cls=''){return trendVideo(url,label,cls)||trendImage(url,label,cls)||'<div class="video-placeholder">Upload an image or short video preview</div>'}
function coverMarkup(url,title){return '<div class="cover media">'+trendCover(url,title,'cover-media')+'</div>'}
const activeTrendVideos=new Set();
const trendLoadQueue=[];
const MAX_TREND_LOADS=3;
let activeTrendLoads=0;
function playTrendVideo(video){
 if(!video.src){queueTrendVideo(video);return}
 if(document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 video.play().then(()=>activeTrendVideos.add(video)).catch(()=>{});
}
function pumpTrendLoads(){while(activeTrendLoads<MAX_TREND_LOADS&&trendLoadQueue.length){const video=trendLoadQueue.shift();delete video.dataset.queued;if(!video.isConnected||video.dataset.near!=='1'||video.src)continue;activeTrendLoads++;let settled=false;const finish=()=>{if(settled)return;settled=true;activeTrendLoads--;if(video.dataset.near==='1')playTrendVideo(video);pumpTrendLoads()};video.addEventListener('canplay',finish,{once:true});video.addEventListener('error',finish,{once:true});video.src=video.dataset.videoSrc;video.load()}}
function queueTrendVideo(video){if(video.src){playTrendVideo(video);return}if(video.dataset.queued)return;video.dataset.queued='1';trendLoadQueue.push(video);pumpTrendLoads()}
const trendObserver='IntersectionObserver'in window?new IntersectionObserver(entries=>{for(const entry of entries){const video=entry.target;if(entry.isIntersecting&&entry.intersectionRatio>=.08){video.dataset.near='1';queueTrendVideo(video)}else{video.dataset.near='0';video.pause();activeTrendVideos.delete(video)}}},{rootMargin:'120px 0px',threshold:[0,.08,.55]}):null;
function setTrendRatio(media){const frame=media?.closest('.trend-media');if(!frame)return;const width=media.videoWidth||media.naturalWidth||0,height=media.videoHeight||media.naturalHeight||0;if(!width||!height)return;const portrait=width/height<1;frame.classList.toggle('is-portrait',portrait);frame.classList.toggle('is-landscape',!portrait);const cover=frame.closest('.cover.media');if(cover){cover.classList.toggle('has-portrait',portrait);cover.classList.toggle('has-landscape',!portrait)}}
function hydrateTrendVideos(scope=document){scope.querySelectorAll('.trend-image').forEach(image=>{if(image.complete)setTrendRatio(image)});scope.querySelectorAll('video[data-video-src]').forEach(video=>{if(video.dataset.observed)return;video.dataset.observed='1';video.addEventListener('loadedmetadata',()=>{setTrendRatio(video);scheduleGalleryLayout()},{once:true});video.addEventListener('loadeddata',()=>video.classList.add('is-ready'),{once:true});if(trendObserver)trendObserver.observe(video);else{video.dataset.near='1';queueTrendVideo(video)}})}
document.addEventListener('visibilitychange',()=>{if(document.hidden)activeTrendVideos.forEach(video=>video.pause());else document.querySelectorAll('.trend-video.is-ready').forEach(video=>{const r=video.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight)playTrendVideo(video)})});
function imageUrls(b){return [...new Set([...(Array.isArray(b.urls)?b.urls:[]),b.url].map(safeUrl).filter(Boolean))]}
function media(b){const width=Math.max(25,Math.min(100,Number(b.width)||100));if(b.type==='video'){const u=safeUrl(b.url);return u?`<figure class="visual media" style="width:${width}%"><video src="${esc(u)}" controls playsinline preload="none"></video>${b.caption?`<figcaption class="muted">${esc(b.caption)}</figcaption>`:''}</figure>`:''}const urls=imageUrls(b);if(!urls.length)return '';return `<figure class="visual media image-set" style="width:${width}%"><div class="image-group ${urls.length>1?'is-multiple':''}">${urls.map((u,i)=>`<div class="image-item">${image(u,(b.caption||'Tutorial image')+(urls.length>1?' '+(i+1):''))}<button class="preview-btn" type="button" data-preview aria-label="Open image ${i+1}">↗</button></div>`).join('')}</div>${b.caption?`<figcaption class="muted">${esc(b.caption)}</figcaption>`:''}</figure>`}
function blocksMarkup(blocks){const visible=blocks.filter(b=>b.type!=='headline');return visible.map((b,i)=>`<section class="block ${b.type==='image'&&visible[i+1]?.type==='prompt'?'before-prompt':''}">${b.type==='image'||b.type==='video'?media(b):b.type==='prompt'?`<div class="prompt-box"><div class="prompt-bar"><strong><span class="prompt-icon">✦</span>${esc(modelFor(b)?.name||'Prompt')}</strong><div class="actions"><button data-copy="${esc(b.id)}">Copy</button><button class="purple" data-recreate="${esc(b.id)}">Recreate ↗</button></div></div><pre class="prompt-text">${esc(b.text)}</pre>${(b.refs||[]).length?`<div class="refs">${b.refs.map((u,i)=>`<div class="ref">${image(u,'Reference '+(i+1))}<span>Image ${i+1}</span></div>`).join('')}</div>`:''}</div>`:''}</section>`).join('')}
// Like Search Models: place the next card in the shortest column.
function layoutGallery(){
 const host=$('#gallery');if(!host)return;
 const cards=Array.from(host.querySelectorAll('.card')).sort((a,b)=>Number(a.dataset.galleryOrder)-Number(b.dataset.galleryOrder));
 if(!cards.length)return;
 const count=window.innerWidth<=760?2:3;
 const columns=Array.from({length:count},()=>{const column=document.createElement('div');column.className='gallery-column';return column});
 host.replaceChildren(...columns);
 const heights=Array(count).fill(0);
 for(const card of cards){let target=0;for(let i=1;i<count;i++)if(heights[i]<heights[target])target=i;columns[target].appendChild(card);heights[target]+=card.getBoundingClientRect().height+28}
}
let galleryFrame=0;
function scheduleGalleryLayout(){if(galleryFrame)cancelAnimationFrame(galleryFrame);galleryFrame=requestAnimationFrame(()=>{galleryFrame=0;layoutGallery()})}
document.addEventListener('load',event=>{if((event.target.tagName==='IMG'||event.target.tagName==='VIDEO')&&event.target.closest('#gallery')){setTrendRatio(event.target);scheduleGalleryLayout()}},true);
document.addEventListener('error',event=>{if((event.target.tagName==='IMG'||event.target.tagName==='VIDEO')&&event.target.closest('#gallery'))scheduleGalleryLayout()},true);
window.addEventListener('resize',scheduleGalleryLayout);

async function gallery(reset=false){
 if(busy)return;busy=true;$('#more').disabled=true;
 try{if(reset){offset=0;$('#gallery').innerHTML=''}status('Loading examples…');
 let q=sb.from('tutorials').select('id,title,cover_url,published,created_at').order('created_at',{ascending:false}).order('id',{ascending:false}).range(offset,offset+PAGE);
 if(!owner)q=q.eq('published',true);
 const {data,error}=await q;if(error)throw error;
 $('#gallery').insertAdjacentHTML('beforeend',data.slice(0,PAGE).map((t,i)=>`<a class="card" data-gallery-order="${offset+i}" aria-label="Open tutorial: ${esc(t.title)}" href="tutorial.html?id=${encodeURIComponent(t.id)}">${trendCover(t.cover_url,t.title,'card-media')}${!t.published?'<span class="badge">Draft · Only you</span>':''}</a>`).join(''));
 hydrateTrendVideos($('#gallery'));layoutGallery();offset+=Math.min(data.length,PAGE);$('#more').hidden=data.length<=PAGE;status('');
 if(!offset)$('#gallery').innerHTML='<div class="empty">No tutorials published yet.</div>';
 }catch(e){status('Could not load examples. '+e.message,true)}finally{busy=false;$('#more').disabled=false}
}
function renderReader(){document.title=record.title+' · Hansora';$('#reader').innerHTML=`${owner?'<div class="top"><button id="edit">Edit tutorial</button></div>':''}${!record.published?'<p class="badge">Draft · Only you</p>':''}${coverMarkup(record.cover_url,record.title)}${blocksMarkup(record.blocks)}`;$('#editor').hidden=true;$('#reader').hidden=false;hydrateTrendVideos($('#reader'));$('#edit')?.addEventListener('click',editor)}

function blockEditor(b,i){return `<section class="editor-block" data-block="${esc(b.id)}"><div class="block-tools"><strong>${i+1}. ${esc(b.type==='prompt'?'Prompt':b.type==='video'?'Video':'Image group')}</strong><div class="actions"><button data-move="-1" ${!i?'disabled':''} aria-label="Move section up">↑</button><button data-move="1" ${i===record.blocks.length-1?'disabled':''} aria-label="Move section down">↓</button><button data-remove aria-label="Remove section">×</button></div></div>${b.type==='prompt'?modelSettings(b):`<label>Upload ${b.type==='image'?'one or more images':'video'}<input type="file" data-upload="media" accept="${b.type==='video'?'video/mp4,video/webm,video/quicktime':'image/jpeg,image/png,image/webp,image/gif,image/avif'}" ${b.type==='image'?'multiple':''}></label>${b.type==='image'?'<span class="video-help">Select several images at once, or choose more later to append them to this group.</span>':''}${media(b)}<label>Display width: <span data-width-label>${b.width}%</span><input type="range" min="25" max="100" step="5" data-field="width" value="${b.width}"></label><label>Caption (optional)<input data-field="caption" value="${esc(b.caption||'')}"></label>`}</section>`}

async function optimizeCoverImage(file){
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Use a JPEG, PNG, or WebP cover image.');
 if(file.size>20*1024*1024)throw Error('Cover image must be smaller than 20 MB.');
 const bitmap=await createImageBitmap(file);try{const scale=Math.min(1,1200/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.82));if(!blob)throw Error('Could not optimize the cover image.');return new File([blob],'cover.webp',{type:blob.type})}finally{bitmap.close()}
}
async function videoMetadata(file){
 const url=URL.createObjectURL(file),video=document.createElement('video');video.preload='metadata';video.muted=true;video.playsInline=true;video.src=url;
 try{await new Promise((resolve,reject)=>{video.onloadedmetadata=resolve;video.onerror=()=>reject(Error('This video cannot be read. Use MP4, WebM, or MOV.'))});return{duration:Number(video.duration)||0,width:video.videoWidth||0,height:video.videoHeight||0}}
 finally{video.removeAttribute('src');video.load();URL.revokeObjectURL(url)}
}
async function transcodePreview(file,meta){
 if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)throw Error('This browser cannot compress this video. Upload a preview already under 1.6 MB.');
 const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/mp4;codecs=avc1'].find(type=>MediaRecorder.isTypeSupported(type));
 if(!mime)throw Error('This browser cannot compress this video. Upload a preview already under 1.6 MB.');
 const url=URL.createObjectURL(file),video=document.createElement('video'),canvas=document.createElement('canvas');video.src=url;video.muted=true;video.playsInline=true;video.preload='auto';
 try{
  await new Promise((resolve,reject)=>{video.onloadeddata=resolve;video.onerror=()=>reject(Error('This video cannot be decoded. Try an MP4 video.'))});
  const maxEdge=1080,scale=Math.min(1,maxEdge/Math.max(meta.width,meta.height));canvas.width=Math.max(2,Math.round(meta.width*scale/2)*2);canvas.height=Math.max(2,Math.round(meta.height*scale/2)*2);
  const ctx=canvas.getContext('2d',{alpha:false}),stream=canvas.captureStream(20),recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1400000}),chunks=[];
  recorder.ondataavailable=event=>{if(event.data.size)chunks.push(event.data)};
  const stopped=new Promise((resolve,reject)=>{recorder.onstop=resolve;recorder.onerror=()=>reject(Error('Video compression failed.'))});
  const limit=Math.min(meta.duration,8);let frame=0;
  function draw(){ctx.drawImage(video,0,0,canvas.width,canvas.height);if(!video.ended&&video.currentTime<limit)frame=requestAnimationFrame(draw);else recorder.state==='recording'&&recorder.stop()}
  recorder.start(500);await video.play();draw();await stopped;cancelAnimationFrame(frame);stream.getTracks().forEach(track=>track.stop());
  const blob=new Blob(chunks,{type:mime.split(';')[0]}),ext=blob.type==='video/mp4'?'mp4':'webm';if(!blob.size)throw Error('Video compression produced an empty file.');return new File([blob],'cover.'+ext,{type:blob.type});
 }finally{video.pause();video.removeAttribute('src');video.load();URL.revokeObjectURL(url)}
}
async function optimizeCoverVideo(file){
 if(!['video/mp4','video/webm','video/quicktime'].includes(file.type))throw Error('Use an MP4, WebM, or MOV cover video.');
 if(file.size>250*1024*1024)throw Error('The original video must be smaller than 250 MB.');
 const meta=await videoMetadata(file);if(!meta.duration||!meta.width||!meta.height)throw Error('The video has invalid dimensions or duration.');
 if(file.size<=1600*1024&&meta.duration<=8&&Math.max(meta.width,meta.height)<=1080)return file;
 const optimized=await transcodePreview(file,meta);return optimized.size<file.size||meta.duration>8?optimized:file;
}
async function upload(file,kind,maxMB=100){if(!owner)throw Error('Sign in with the owner account.');const allowed=kind==='video'?['video/mp4','video/webm','video/quicktime']:['image/jpeg','image/png','image/webp','image/gif','image/avif'];if(!allowed.includes(file.type))throw Error('Unsupported file type. Use a supported image or MP4/WebM video.');if(file.size>maxMB*1024*1024)throw Error('File must be smaller than '+maxMB+' MB.');const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','image/avif':'avif','video/mp4':'mp4','video/webm':'webm','video/quicktime':'mov'}[file.type];const path=record.id+'/'+crypto.randomUUID()+'.'+ext;const {error}=await sb.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:false});if(error)throw Error('Upload failed. '+error.message);return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}
function validate(){if(!record.title.trim())throw Error('Add a tutorial title.');if(!safeUrl(record.cover_url))throw Error('Upload a cover image or video.');if(!record.blocks.length&&record.published)throw Error('Add a section before publishing.');for(const [i,b] of record.blocks.entries()){const label='Section '+(i+1)+': ';if(b.type==='prompt'&&!b.text.trim())throw Error(label+'add text.');if(b.type==='image'&&!imageUrls(b).length)throw Error(label+'upload at least one image.');if(b.type==='video'&&!safeUrl(b.url))throw Error(label+'upload your video.');if(b.type==='prompt'){const m=modelFor(b);if(!m)throw Error(label+'choose a model.');if(b.refs.length>m.maxFiles)throw Error(label+'too many reference images for this model.');if(m.needsImage&&!b.refs.length)throw Error(label+'this model requires a reference image.')}}}
