<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ավելացնել Henshin-ի ձևանմուշ | Hansora AI</title>
<link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/header.css"><link rel="stylesheet" href="/henshin.css?v=20261006-trendy1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="/henshin-i18n.js?v=20261006-trendy1"></script>
<script defer src="/header.js"></script><script defer src="/kie-upload-bridge.js"></script><script defer src="/henshin-config.js"></script>
  <script defer src="/henshin-media.js?v=20261006-trendy1"></script><script defer src="/henshin-template.js?v=20261006-trendy1"></script>
</head>
<body><div id="sharedHeader"></div>
<main class="template-editor">
<div class="template-editor-head"><div><span class="eyebrow">ԹՐԵՆԴԱՅԻՆ ՕՐԻՆԱԿՆԵՐ</span><h1>Ավելացնել ձևանմուշ</h1></div><a href="/henshin_arm.html">Վերադառնալ Henshin ↗</a></div>
<p id="editorAccess" role="status">Մուտքի իրավունքը ստուգվում է…</p>
<form id="editorForm" hidden>
<div class="template-editor-grid">
<div>
<label class="editor-field"><span>Արդյունքի օրինակային տեսանյութ</span><input id="editorResult" class="editor-file" type="file" accept="video/*,.mp4,.mov,.webm,.mkv,.avi,.m4v" required></label>
<div id="editorResultMedia" class="editor-media" hidden><button id="editorResultRemove" class="remove-media" type="button" aria-label="Հեռացնել արդյունքի օրինակային տեսանյութը"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button><video id="editorResultPreview" class="editor-video" controls playsinline></video></div>
<p id="editorResultStatus" class="upload-status" role="status" aria-live="polite"></p>
<p class="library-status">Այս տեսանյութը ցուցադրվում է գրադարանում և մանրամասների պատուհանում։</p>
<label class="editor-field"><span>Սկզբնական տեսանյութ</span><input id="editorSource" class="editor-file" type="file" accept="video/*,.mp4,.mov,.webm,.mkv,.avi,.m4v" required></label>
<div id="editorSourceMedia" class="editor-media" hidden><button id="editorSourceRemove" class="remove-media" type="button" aria-label="Հեռացնել սկզբնական տեսանյութը"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button><video id="editorSourcePreview" class="editor-video" controls playsinline></video></div>
<p id="editorSourceStatus" class="upload-status" role="status" aria-live="polite"></p>
<p class="library-status">«Վերստեղծել» կոճակը այս սկզբնական տեսանյութը բեռնում է ստեղծման գործիքի մեջ։ Երկու տեսանյութերի տևողությունը պետք է լինի 4–30 վայրկյան։</p>
</div>
<div>
<label class="editor-field"><span>Օրինակային պատկերներ</span><input id="editorReferences" type="file" accept="image/*,.heic,.heif,.tif,.tiff" multiple required></label>
<div id="editorImages"></div>
<p id="editorImageStatus" class="upload-status" role="status" aria-live="polite"></p>
<label class="editor-field"><span>Փոխակերպման եղանակ</span><select id="editorMode"><option value="motion">Շարժման փոխանցում</option><option value="swap">Օբյեկտի փոխարինում</option><option value="edit">Տեսանյութի խմբագրում</option></select></label>
<label class="editor-field"><span>Հրահանգ · ըստ ցանկության</span><textarea id="editorPrompt" maxlength="2000" placeholder="Օրինակ՝ երկու պարողներին փոխարինեք իմ կերպարներով, բաճկոնը դարձրեք կարմիր։"></textarea></label>
<label class="editor-field"><span>Լուծաչափ</span><select id="editorQuality"><option value="480p">480p</option><option value="720p" selected>720p</option><option value="1080p">1080p</option></select></label>
<label class="audio-option"><input id="editorAudio" type="checkbox" checked>Պահպանել սկզբնական ձայնը</label>
</div>
</div>
<p id="editorStatus" role="status" aria-live="polite" class="library-status"></p>
<button id="editorPublish" class="primary editor-publish" type="submit">Հրապարակել ձևանմուշը</button>
</form>
</main></body></html>
