<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HANSORA • Seedance 2 Prompt Builder</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%235b5ce2'/%3E%3Ctext x='50' y='60' font-size='54' text-anchor='middle' fill='white' font-family='Arial'%3EH%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://qmaealblegvcwodlmeht.supabase.co" />
  <link rel="dns-prefetch" href="//cdn.jsdelivr.net" />
  <link rel="dns-prefetch" href="//qmaealblegvcwodlmeht.supabase.co" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="/header.css" rel="stylesheet" />
  <script defer src="/header.js"></script>
  <style>
    :root{
      --bg:#070912;
      --panel:#10131d;
      --panel2:#151927;
      --line:rgba(255,255,255,.10);
      --line2:rgba(255,255,255,.16);
      --text:#f4f7ff;
      --muted:rgba(232,238,255,.62);
      --soft:rgba(232,238,255,.42);
      --brand:#7c3aed;
      --brand2:#6366f1;
      --cyan:#38bdf8;
      --green:#34d399;
      --danger:#fb7185;
    }
    *{ box-sizing:border-box; }
    html,body{ min-height:100%; }
    body{
      margin:0;
      padding-top:var(--header-height, 68px);
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Arial,sans-serif;
      background:
        radial-gradient(900px 520px at 12% 0%, rgba(124,58,237,.22), transparent 60%),
        radial-gradient(1000px 560px at 100% 100%, rgba(56,189,248,.12), transparent 62%),
        radial-gradient(760px 420px at 54% 20%, rgba(99,102,241,.10), transparent 58%),
        var(--bg);
      overflow:hidden;
    }
    button,textarea{ font:inherit; }
    button{ cursor:pointer; }
    button:disabled{ cursor:not-allowed; }

    .page{
      width:min(1540px, calc(100% - 16px));
      height:calc(100vh - var(--header-height, 68px));
      min-height:0;
      margin:0 auto;
      padding:0;
      display:flex;
    }
    .chat-panel{
      width:100%;
      min-width:0;
      min-height:0;
      display:flex;
      flex-direction:column;
      border:1px solid var(--line);
      border-radius:24px;
      background:linear-gradient(180deg, rgba(17,20,31,.95), rgba(8,11,21,.92));
      box-shadow:0 22px 70px rgba(0,0,0,.36);
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
      overflow:hidden;
    }
    .chat-top{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      padding:18px 20px;
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.025);
      text-align:center;
    }
    .chat-title{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      min-width:0;
    }
    .avatar-ai{
      flex:0 0 auto;
      width:46px;
      height:46px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      background:linear-gradient(135deg,#7c3aed,#6366f1,#38bdf8);
      box-shadow:0 14px 34px rgba(99,102,241,.30);
      font-size:22px;
      font-weight:900;
    }
    .avatar-ai img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:none;
    }
    .avatar-ai.has-logo img{ display:block; }
    .avatar-ai.has-logo span{ display:none; }
    .chat-title strong{
      display:block;
      font-size:17px;
      letter-spacing:-.02em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      color:#fff;
      text-align:left;
    }
    .chat-title small{
      display:block;
      color:var(--muted);
      font-size:12px;
      margin-top:2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      text-align:left;
    }
    .chat-list{
      flex:1;
      min-height:0;
      padding:24px;
      overflow:auto;
      scroll-behavior:auto;
    }
    .welcome-card{
      width:min(980px, 100%);
      margin:52px auto 28px;
      border:1px solid var(--line);
      border-radius:30px;
      background:
        radial-gradient(520px 220px at 20% 0%, rgba(124,58,237,.18), transparent 65%),
        rgba(255,255,255,.04);
      padding:28px;
      text-align:center;
    }
    .welcome-icon{
      width:76px;
      height:76px;
      margin:0 auto 18px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      border-radius:25px;
      background:linear-gradient(135deg,rgba(124,58,237,.9),rgba(56,189,248,.75));
      box-shadow:0 18px 50px rgba(99,102,241,.35);
      font-size:31px;
    }
    .welcome-icon img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:none;
    }
    .welcome-icon.has-logo{ background:transparent; box-shadow:none; }
    .welcome-icon.has-logo img{ display:block; }
    .welcome-icon.has-logo span{ display:none; }
    .welcome-card h1{
      margin:0;
      font-size:clamp(25px,3.2vw,38px);
      line-height:1.05;
      letter-spacing:-.05em;
      font-weight:950;
    }
    .welcome-card p{
      max-width:590px;
      margin:12px auto 0;
      color:var(--muted);
      line-height:1.65;
      font-size:14px;
    }
    .example-videos{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
      margin:22px auto 0;
      max-width:900px;
    }
    .example-video-card{
      position:relative;
      width:100%;
      aspect-ratio:16 / 9;
      overflow:hidden;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.13);
      background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(56,189,248,.08));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
    }
    .example-video-card video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:none;
    }
    .example-video-card.has-video video{ display:block; }
    .example-video-placeholder{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:8px;
      color:rgba(255,255,255,.70);
      font-size:12px;
      font-weight:800;
      text-align:center;
    }
    .example-video-card.has-video .example-video-placeholder{ display:none; }
    .example-video-placeholder b{
      width:42px;
      height:42px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.09);
      color:#fff;
      font-size:18px;
    }
    .history-note{
      width:min(780px, 100%);
      margin:0 auto 18px;
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }
    .message-row{
      display:flex;
      margin:0 auto 18px;
      gap:10px;
      width:min(1120px, 100%);
    }
    .message-row.user{ justify-content:flex-end; }
    .message-row.assistant{ justify-content:flex-start; }
    .message-bubble{
      max-width:min(980px, 88%);
      border:1px solid var(--line);
      border-radius:24px;
      padding:15px 16px;
      line-height:1.6;
      font-size:14px;
      white-space:pre-wrap;
      word-break:break-word;
    }
    .message-row.user .message-bubble{
      border-color:rgba(129,140,248,.40);
      background:linear-gradient(135deg,rgba(99,102,241,.82),rgba(124,58,237,.74));
      color:#fff;
      border-bottom-right-radius:8px;
      box-shadow:0 16px 34px rgba(99,102,241,.18);
    }
    .message-row.assistant .message-bubble{
      background:rgba(255,255,255,.055);
      border-bottom-left-radius:8px;
    }
    .message-bubble.error{
      border-color:rgba(251,113,133,.35);
      background:rgba(251,113,133,.10);
      color:#ffe4e6;
    }
    .prompt-output{
      display:flex;
      flex-direction:column;
      gap:14px;
      padding-bottom:12px;
    }
    .prompt-output-text{
      white-space:pre-wrap;
    }
    .copy-btn{
      align-self:flex-end;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:30px;
      padding:0 12px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(15,23,42,.72);
      color:#fff;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
    }
    .copy-btn:hover{ border-color:rgba(129,140,248,.65); background:rgba(99,102,241,.28); }
    .thinking-wrap{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:260px;
      white-space:normal;
    }
    .thinking-orb{
      flex:0 0 auto;
      width:44px;
      height:44px;
      border-radius:16px;
      background:linear-gradient(135deg,#ff25c8,#8b5cf6,#38bdf8);
      box-shadow:0 0 32px rgba(139,92,246,.56);
      animation:orbSpin 1.2s linear infinite;
    }
    @keyframes orbSpin{ to{ transform:rotate(360deg); } }
    .thinking-text strong{ display:block; font-size:14px; color:#fff; }
    .thinking-text span{ display:block; color:var(--muted); font-size:12px; margin-top:2px; }
    .dots{ display:inline-flex; gap:3px; margin-left:3px; }
    .dots i{
      width:4px;
      height:4px;
      border-radius:999px;
      background:rgba(255,255,255,.72);
      animation:dotPulse 1s infinite ease-in-out;
    }
    .dots i:nth-child(2){ animation-delay:.15s; }
    .dots i:nth-child(3){ animation-delay:.30s; }
    @keyframes dotPulse{ 0%,80%,100%{ opacity:.25; transform:translateY(0); } 40%{ opacity:1; transform:translateY(-3px); } }
    .composer{
      border-top:1px solid var(--line);
      padding:16px 16px 0;
      background:rgba(3,6,18,.52);
    }
    .composer-inner{
      width:min(1120px, 100%);
      margin:0 auto;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:12px;
      align-items:end;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(2,6,23,.68);
      border-radius:24px;
      padding:12px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
    }
    #ideaInput{
      width:100%;
      min-height:76px;
      max-height:190px;
      resize:vertical;
      border:0;
      outline:0;
      background:transparent;
      color:#fff;
      font-size:15px;
      line-height:1.55;
      padding:4px 2px;
    }
    #ideaInput::placeholder{ color:rgba(255,255,255,.38); }
    .run-area{
      display:flex;
      align-items:flex-end;
      justify-content:flex-end;
    }
    #runBtn{
      min-width:142px;
      min-height:50px;
      border:0;
      border-radius:17px;
      color:white;
      background:linear-gradient(135deg,#6366f1,#8b5cf6);
      box-shadow:0 16px 40px rgba(99,102,241,.38);
      font-size:15px;
      font-weight:900;
      letter-spacing:-.01em;
      transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    }
    #runBtn:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 22px 52px rgba(99,102,241,.48); }
    #runBtn:disabled{ opacity:.56; box-shadow:none; }
    .status-line{
      width:min(1120px, 100%);
      min-height:18px;
      margin:0 auto 9px;
      color:var(--muted);
      font-size:12px;
    }
    .status-line.error{ color:#fecdd3; }
    .status-line.success{ color:#bbf7d0; }
    @media (max-width:900px){
      body{ overflow:auto; }
      .page{
        width:100%;
        height:auto;
        min-height:calc(100vh - var(--header-height, 68px));
        padding:0 8px;
      }
      .chat-panel{ min-height:calc(100vh - var(--header-height, 68px)); border-radius:22px; }
      .chat-list{ padding:14px; }
      .message-bubble{ max-width:92%; font-size:13px; border-radius:20px; }
      .welcome-card{ margin:20px auto; padding:20px; border-radius:24px; }
      .example-videos{ gap:10px; }
      .composer{ padding:12px 12px 0; }
      .composer-inner{ grid-template-columns:1fr; border-radius:20px; }
      .run-area{ justify-content:flex-end; }
      #runBtn{ width:150px; min-height:48px; }
      #ideaInput{ min-height:92px; }
    }
    @media (max-width:560px){
      .example-videos{ grid-template-columns:1fr; }
      .chat-title small{ display:none; }
      .welcome-card h1{ font-size:25px; }
    }
  </style>
</head>
<body>
  <div id="sharedHeader"></div>

  <main class="page">
    <section class="chat-panel" aria-label="Seedance 2 prompt builder chat">
      <div id="chatList" class="chat-list">
        <div id="welcomeCard" class="welcome-card">
          <div id="welcomeLogo" class="welcome-icon">
            <img id="welcomeLogoImg" alt="" />
            <span>🎬</span>
          </div>
          <h1>Type your short idea here</h1>
          <p>Describe the scene in one place. The builder will protect your original idea and expand it into a clear cinematic 3D prompt.</p>
          <div class="example-videos" aria-label="Example videos">
            <button id="exampleVideoCard1" type="button" class="example-video-card" aria-label="Example video 1">
              <video id="exampleVideo1" muted playsinline loop preload="metadata"></video>
              <span class="example-video-placeholder"><b>▶</b>Example video 1</span>
            </button>
            <button id="exampleVideoCard2" type="button" class="example-video-card" aria-label="Example video 2">
              <video id="exampleVideo2" muted playsinline loop preload="metadata"></video>
              <span class="example-video-placeholder"><b>▶</b>Example video 2</span>
            </button>
          </div>
        </div>
      </div>

      <form id="promptForm" class="composer">
        <div id="statusLine" class="status-line"></div>
        <div class="composer-inner">
          <textarea id="ideaInput" maxlength="2500" placeholder="Type your short idea here…"></textarea>
          <div class="run-area">
            <button id="runBtn" type="submit">Run 0.5⚡</button>
          </div>
        </div>
      </form>
    </section>
  </main>

  <script>
    const SUPABASE_URL = 'https://qmaealblegvcwodlmeht.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtYWVhbGJsZWd2Y3dvZGxtZWh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg2MjkzNzMsImV4cCI6MjA3NDIwNTM3M30.bUV6W0zBtkd_6gtfPGBSpskybUmpLC-1znljoDpYy4c';

    /* Change only these URLs when you want your own Claude logo / example videos. */
    const BUILDER_LOGO_URL = 'https://qmaealblegvcwodlmeht.supabase.co/storage/v1/object/public/website%20content/Untitled%20design%20(31).png';
    const EXAMPLE_VIDEO_1_URL = 'https://qmaealblegvcwodlmeht.supabase.co/storage/v1/object/public/website%20content/02178057881717500000000000000000000ffffc0a8787bd42cc8%20(1).mp4';
    const EXAMPLE_VIDEO_2_URL = 'https://qmaealblegvcwodlmeht.supabase.co/storage/v1/object/public/website%20content/veo.mp4';

    const supabaseClient = window.__HANSORA_SB__ || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    window.__HANSORA_SB__ = supabaseClient;
    window.hansoraSupabase = supabaseClient;

    const COST = 0.5;
    const RUN_ENDPOINT = '/.netlify/functions/run-video-prompt-builder';
    const CHECK_ENDPOINT = '/.netlify/functions/video-prompt-builder-check';
    const BUILDER_MODEL = 'claude-opus-4-8';
    const HISTORY_LIMIT = 7;
    const OUTPUT_LIMIT = 3800;
    const LOCAL_KEY = 'hansora_video_prompt_builder_recent_v3';
    const copies = {};
    let copySeq = 0;
    let currentUser = null;
    let currentCredits = 0;
    let runLocked = false;
    let renderingHistory = false;

    const els = {
      form: document.getElementById('promptForm'),
      input: document.getElementById('ideaInput'),
      runBtn: document.getElementById('runBtn'),
      status: document.getElementById('statusLine'),
      chat: document.getElementById('chatList'),
      welcome: document.getElementById('welcomeCard')
    };

    function updateHeaderHeightVar() {
      const header = document.getElementById('siteHeader') || document.getElementById('sharedHeader');
      const height = header ? Math.max(64, Math.round(header.getBoundingClientRect().height || 68)) : 68;
      document.documentElement.style.setProperty('--header-height', `${height}px`);
    }

    function isUsableUrl(value) {
      return /^https?:\/\//i.test(String(value || '').trim());
    }

    function setupVisualUrls() {
      if (isUsableUrl(BUILDER_LOGO_URL)) {
        const img = document.getElementById('builderLogoImg');
        const avatar = document.getElementById('builderLogoAvatar');
        const welcomeImg = document.getElementById('welcomeLogoImg');
        const welcomeLogo = document.getElementById('welcomeLogo');
        if (img && avatar) {
          img.src = BUILDER_LOGO_URL;
          avatar.classList.add('has-logo');
        }
        if (welcomeImg && welcomeLogo) {
          welcomeImg.src = BUILDER_LOGO_URL;
          welcomeLogo.classList.add('has-logo');
        }
      }

      const examples = [
        { url: EXAMPLE_VIDEO_1_URL, video: document.getElementById('exampleVideo1'), card: document.getElementById('exampleVideoCard1') },
        { url: EXAMPLE_VIDEO_2_URL, video: document.getElementById('exampleVideo2'), card: document.getElementById('exampleVideoCard2') }
      ];

      examples.forEach((item) => {
        if (!item.video || !item.card || !isUsableUrl(item.url)) return;
        item.video.src = item.url;
        item.card.classList.add('has-video');
        item.card.addEventListener('mouseenter', () => item.video.play().catch(() => {}));
        item.card.addEventListener('mouseleave', () => { item.video.pause(); item.video.currentTime = 0; });
        item.card.addEventListener('click', () => {
          if (item.video.paused) item.video.play().catch(() => {});
          else item.video.pause();
        });
      });
    }

    function parseCredits(value) {
      const n = Number(String(value ?? '').replace(/[^\d.-]/g, ''));
      return Number.isFinite(n) ? n : 0;
    }

    function formatCredits(value) {
      const n = parseCredits(value);
      return `${Number.isInteger(n) ? n : String(Number(n.toFixed(2)))}⚡`;
    }

    function setCreditsEverywhere(value) {
      const n = parseCredits(value);
      currentCredits = n;
      document.querySelectorAll('#navCredits').forEach((node) => {
        node.textContent = formatCredits(n);
      });
      if (window.HansoraHeader && typeof window.HansoraHeader.setCredits === 'function') {
        window.HansoraHeader.setCredits(n);
      }
    }

    function watchCreditsLive(durationMs = 90000) {
      if (window.HansoraHeader && typeof window.HansoraHeader.startCreditsPolling === 'function') {
        window.HansoraHeader.startCreditsPolling(durationMs, 1500);
      }
    }

    async function readSupabaseCredits() {
      const { data: userRes } = await supabaseClient.auth.getUser();
      const user = userRes && userRes.user ? userRes.user : null;
      if (!user) return { user: null, profile: null, credits: 0 };

      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('credits, avatar_url')
        .eq('user_id', user.id)
        .maybeSingle();

      if (error) throw error;
      return { user, profile, credits: parseCredits(profile && profile.credits) };
    }

    async function refreshCredits() {
      try {
        const { user, profile, credits } = await readSupabaseCredits();
        currentUser = user;
        if (!user) {
          setCreditsEverywhere(0);
          return 0;
        }

        setCreditsEverywhere(credits);

        const navUser = document.getElementById('navUser');
        const btnLogin = document.getElementById('btnLoginSignup');
        if (btnLogin && navUser) {
          btnLogin.classList.add('hidden');
          navUser.classList.remove('hidden');
          navUser.classList.add('flex');
        }

        const avatarImg = document.getElementById('navAvatarImg');
        if (avatarImg && profile && profile.avatar_url) {
          avatarImg.src = profile.avatar_url;
          avatarImg.classList.remove('hidden');
        }

        return parseCredits(credits);
      } catch (error) {
        console.warn('refreshCredits failed', error);
        return parseCredits(currentCredits);
      }
    }

    async function loadUser() {
      try {
        const { data } = await supabaseClient.auth.getUser();
        currentUser = data && data.user ? data.user : null;
        if (!currentUser) {
          setCreditsEverywhere(0);
          renderSavedHistory(getLocalRecent());
          return;
        }
        await refreshCredits();
        await loadRecentRequests();
      } catch (error) {
        console.warn('loadUser failed', error);
        renderSavedHistory(getLocalRecent());
      }
    }

    document.addEventListener('click', async (event) => {
      const logoutBtn = event.target.closest ? event.target.closest('#btnLogout') : null;
      if (logoutBtn) {
        try {
          await supabaseClient.auth.signOut();
          currentUser = null;
          currentCredits = 0;
          setCreditsEverywhere(0);
          renderSavedHistory(getLocalRecent());
        } catch (error) {
          console.warn('logout failed', error);
        }
        return;
      }

      const avatar = document.getElementById('navAvatar');
      const menu = document.getElementById('navMenu');
      if (!avatar || !menu) return;
      if (avatar.contains(event.target)) {
        menu.classList.toggle('hidden');
      } else if (!menu.contains(event.target)) {
        menu.classList.add('hidden');
      }
    });

    function setStatus(text, type = '') {
      els.status.textContent = text || '';
      els.status.className = `status-line ${type || ''}`;
    }

    function setRunButtonLabel(text) {
      els.runBtn.textContent = `${text} ${formatCredits(COST)}`;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function dedupeOutputText(text) {
      let value = String(text || '').trim();
      const markers = ['IDEA LOCK:', '**IDEA LOCK:**', 'STYLE:', '**STYLE:**'];
      for (const marker of markers) {
        const first = value.indexOf(marker);
        if (first < 0) continue;
        const second = value.indexOf(marker, first + marker.length);
        if (second > first) {
          value = value.slice(0, second).trim();
          break;
        }
      }
      return value;
    }

    function capOutputText(text) {
      return Array.from(dedupeOutputText(text)).slice(0, OUTPUT_LIMIT).join('');
    }

    function scrollChatBottom() {
      if (renderingHistory) return;
      els.chat.scrollTop = els.chat.scrollHeight;
    }

    function clearWelcome() {
      if (els.welcome) {
        els.welcome.remove();
        els.welcome = null;
      }
    }

    function showWelcome() {
      if (els.welcome || !els.chat) return;
      els.chat.innerHTML = `
        <div id="welcomeCard" class="welcome-card">
          <div id="welcomeLogo" class="welcome-icon">
            <img id="welcomeLogoImg" alt="" />
            <span>🎬</span>
          </div>
          <h1>Type your short idea here</h1>
          <p>Describe the scene in one place. The builder will protect your original idea and expand it into a clear cinematic 3D prompt.</p>
          <div class="example-videos" aria-label="Example videos">
            <button id="exampleVideoCard1" type="button" class="example-video-card" aria-label="Example video 1">
              <video id="exampleVideo1" muted playsinline loop preload="metadata"></video>
              <span class="example-video-placeholder"><b>▶</b>Example video 1</span>
            </button>
            <button id="exampleVideoCard2" type="button" class="example-video-card" aria-label="Example video 2">
              <video id="exampleVideo2" muted playsinline loop preload="metadata"></video>
              <span class="example-video-placeholder"><b>▶</b>Example video 2</span>
            </button>
          </div>
        </div>`;
      els.welcome = document.getElementById('welcomeCard');
      setupVisualUrls();
    }

    function addUserMessage(text) {
      clearWelcome();
      const row = document.createElement('div');
      row.className = 'message-row user';
      row.innerHTML = `<div class="message-bubble">${escapeHtml(text)}</div>`;
      els.chat.appendChild(row);
      scrollChatBottom();
      return row;
    }

    function addThinkingMessage() {
      clearWelcome();
      const row = document.createElement('div');
      row.className = 'message-row assistant';
      row.innerHTML = `
        <div class="message-bubble">
          <div class="thinking-wrap">
            <div class="thinking-orb"></div>
            <div class="thinking-text">
              <strong>Claude is thinking<span class="dots"><i></i><i></i><i></i></span></strong>
              <span>Building timing, camera, acting, lighting, audio, and negative instructions.</span>
            </div>
          </div>
        </div>`;
      els.chat.appendChild(row);
      scrollChatBottom();
      return row;
    }

    function setAssistantResult(row, text) {
      text = capOutputText(text);
      const id = `copy_${Date.now()}_${copySeq++}`;
      copies[id] = text;
      row.className = 'message-row assistant';
      row.innerHTML = `
        <div class="message-bubble prompt-output">
          <div class="prompt-output-text">${escapeHtml(text)}</div>
          <button type="button" class="copy-btn" data-copy-id="${id}">Copy</button>
        </div>`;
      scrollChatBottom();
    }

    function setAssistantError(row) {
      row.className = 'message-row assistant';
      row.innerHTML = '<div class="message-bubble error">Sorry, your request failed. Please try again.</div>';
      scrollChatBottom();
    }

    function setAssistantErrorText(row, message) {
      row.className = 'message-row assistant';
      row.innerHTML = `<div class="message-bubble error">${escapeHtml(message || 'Sorry, your request failed. Please try again.')}</div>`;
      scrollChatBottom();
    }

    function getLocalRecent() {
      try {
        const arr = JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]');
        return Array.isArray(arr) ? arr.filter((item) => item && item.idea).slice(0, HISTORY_LIMIT) : [];
      } catch (_) {
        return [];
      }
    }

    function saveLocalRecent(item) {
      if (!item || !item.idea) return;
      const current = getLocalRecent();
      const next = [item, ...current.filter((x) => x.run_id !== item.run_id)].slice(0, HISTORY_LIMIT);
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify(next)); } catch (_) {}
    }

    function normalizeRecentRow(row) {
      const meta = row && row.meta && typeof row.meta === 'object' ? row.meta : {};
      return {
        run_id: meta.run_id || row.run_id || '',
        idea: row.prompt || row.idea || '',
        text: capOutputText(meta.result_text || row.text || ''),
        status: meta.status || row.status || (meta.result_text ? 'done' : 'processing'),
        created_at: row.created_at || new Date().toISOString()
      };
    }

    async function loadRecentRequests() {
      if (!currentUser) {
        renderSavedHistory(getLocalRecent());
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from('user_generations')
          .select('provider, kind, prompt, result_url, meta, created_at')
          .eq('user_id', currentUser.id)
          .order('created_at', { ascending: false })
          .limit(40);

        if (error) throw error;
        const serverRows = (data || [])
          .filter((row) => row && row.meta && row.meta.source === 'video-prompt-builder')
          .map(normalizeRecentRow)
          .filter((row) => row && row.idea);
        const byRun = new Map();
        [...serverRows, ...getLocalRecent()].forEach((row) => {
          if (!row || !row.idea) return;
          const key = row.run_id || `${row.idea}_${row.created_at || ''}`;
          const existing = byRun.get(key);
          if (!existing || (!existing.text && row.text)) byRun.set(key, row);
        });
        const rows = Array.from(byRun.values())
          .sort((a, b) => Date.parse(b.created_at || 0) - Date.parse(a.created_at || 0))
          .slice(0, HISTORY_LIMIT)
          .reverse();
        renderSavedHistory(rows);
      } catch (error) {
        console.warn('loadRecentRequests failed', error);
        renderSavedHistory(getLocalRecent().slice().reverse());
      }
    }

    function renderSavedHistory(items) {
      const list = Array.isArray(items) ? items.filter((item) => item && item.idea).slice(-HISTORY_LIMIT) : [];
      renderingHistory = true;
      els.chat.innerHTML = '';
      els.welcome = null;

      if (!list.length) {
        renderingHistory = false;
        showWelcome();
        return;
      }

      const note = document.createElement('div');
      note.className = 'history-note';
      note.textContent = 'Last 7 requests';
      els.chat.appendChild(note);

      list.forEach((item) => {
        addUserMessage(item.idea || 'Saved request');
        if (item.text) {
          const row = document.createElement('div');
          row.className = 'message-row assistant';
          els.chat.appendChild(row);
          setAssistantResult(row, item.text);
        } else if (String(item.status || '').toLowerCase() === 'failed') {
          const row = document.createElement('div');
          row.className = 'message-row assistant';
          els.chat.appendChild(row);
          setAssistantError(row);
        } else {
          addThinkingMessage();
        }
      });
      renderingHistory = false;
      requestAnimationFrame(() => {
        els.chat.scrollTop = els.chat.scrollHeight;
      });
    }

    async function getAccessToken() {
      try {
        const { data } = await supabaseClient.auth.getSession();
        return data && data.session && data.session.access_token ? data.session.access_token : '';
      } catch (_) {
        return '';
      }
    }

    function delay(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function pollPromptResult({ uid, runId, taskId, row }) {
      const maxAttempts = 3600;
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        await delay(attempt < 8 ? 1800 : 2600);
        const url = `${CHECK_ENDPOINT}?uid=${encodeURIComponent(uid)}&run_id=${encodeURIComponent(runId)}${taskId ? `&taskId=${encodeURIComponent(taskId)}` : ''}`;
        const res = await fetch(url, { method: 'GET', headers: { Accept: 'application/json' } });
        const js = await res.json().catch(() => ({}));

        if (js && js.ok && js.status === 'done' && (js.text || js.result_text)) {
          const text = capOutputText(js.text || js.result_text || '');
          setAssistantResult(row, text);
          saveLocalRecent({ run_id: runId, idea: row.dataset.idea || '', text, status: 'done', created_at: new Date().toISOString() });
          setStatus('');
          await refreshCredits();
          return true;
        }

        if (js && (js.failed || js.status === 'failed')) {
          setAssistantError(row);
          saveLocalRecent({ run_id: runId, idea: row.dataset.idea || '', text: '', status: 'failed', created_at: new Date().toISOString() });
          await refreshCredits();
          return false;
        }
      }

      await refreshCredits();
      return false;
    }

    async function runPromptBuilder(idea) {
      const credits = await refreshCredits();
      if (!currentUser) {
        setStatus('Please log in first.', 'error');
        document.getElementById('btnLoginSignup')?.click();
        return;
      }
      if (credits < COST) {
        setStatus('Not enough credits.', 'error');
        return;
      }

      const uid = currentUser.id;
      const runId = `${uid}-${Date.now()}`;
      addUserMessage(idea);
      const thinkingRow = addThinkingMessage();
      thinkingRow.dataset.idea = idea;
      saveLocalRecent({ run_id: runId, idea, text: '', status: 'processing', created_at: new Date().toISOString() });

      setStatus('Submitting request…');
      runLocked = true;
      els.runBtn.disabled = true;
      setRunButtonLabel('Running…');

      try {
        const token = await getAccessToken();
        const res = await fetch(RUN_ENDPOINT, {
          method: 'POST',
          headers: Object.assign(
            { 'Content-Type': 'application/json', 'X-USER-ID': uid },
            token ? { Authorization: `Bearer ${token}` } : {}
          ),
          body: JSON.stringify({ uid, run_id: runId, user_idea: idea, model: BUILDER_MODEL })
        });

        const text = await res.text();
        let js;
        try { js = JSON.parse(text); } catch { js = { raw: text }; }

        if (!res.ok || !js.ok) {
          if (js && js.error === 'not_enough_credits') {
            setStatus('Not enough credits.', 'error');
            setAssistantErrorText(thinkingRow, 'Not enough credits.');
          } else if (js && js.error === 'worker_enqueue_failed') {
            setStatus('Sorry, your request failed. Please try again.', 'error');
            setAssistantErrorText(thinkingRow, 'Could not start the Claude worker. Your credit was refunded.');
          } else {
            setStatus('Sorry, your request failed. Please try again.', 'error');
            setAssistantError(thinkingRow);
          }
          await refreshCredits();
          return;
        }

        watchCreditsLive(120000);
        setCreditsEverywhere(js.credits != null ? js.credits : Math.max(0, currentCredits - COST));
        refreshCredits().catch(() => {});
        const immediateText = capOutputText(js.text || js.result_text || '');
        if (immediateText) {
          setAssistantResult(thinkingRow, immediateText);
          saveLocalRecent({ run_id: runId, idea, text: immediateText, status: 'done', created_at: new Date().toISOString() });
          setStatus('');
        } else {
          setStatus('Claude is thinking through the scene…', 'success');
          await pollPromptResult({ uid, runId, taskId: js.taskId || js.id || '', row: thinkingRow });
        }
      } catch (error) {
        console.error(error);
        setStatus('Sorry, your request failed. Please try again.', 'error');
        setAssistantError(thinkingRow);
        await refreshCredits();
      } finally {
        runLocked = false;
        els.runBtn.disabled = false;
        setRunButtonLabel('Run');
      }
    }

    els.form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (runLocked || els.runBtn.disabled) return;
      const idea = String(els.input.value || '').trim();
      if (idea.length < 3) {
        setStatus('Type your short idea first.', 'error');
        els.input.focus();
        return;
      }
      els.input.value = '';
      setStatus('');
      await runPromptBuilder(idea);
    });

    document.addEventListener('click', async (event) => {
      const btn = event.target.closest('[data-copy-id]');
      if (!btn) return;
      const text = copies[btn.dataset.copyId] || '';
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        const old = btn.textContent;
        btn.textContent = 'Copied';
        setTimeout(() => { btn.textContent = old; }, 1200);
      } catch (_) {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        area.remove();
        btn.textContent = 'Copied';
        setTimeout(() => { btn.textContent = 'Copy'; }, 1200);
      }
    });

    supabaseClient.auth.onAuthStateChange(() => {
      setTimeout(() => { loadUser().catch((error) => console.warn('auth refresh failed', error)); }, 50);
    });

    window.addEventListener('resize', updateHeaderHeightVar);

    window.addEventListener('load', () => {
      updateHeaderHeightVar();
      setTimeout(updateHeaderHeightVar, 100);
      setTimeout(updateHeaderHeightVar, 500);
      setupVisualUrls();
      setRunButtonLabel('Run');
      loadUser().catch((error) => console.warn('initial load failed', error));
      setTimeout(() => refreshCredits().catch(() => {}), 900);
    });
  </script>
</body>
</html>
