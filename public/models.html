          </div>

    function renderSections(){
      const vg = document.getElementById('videoGrid');

      if(vg) vg.innerHTML = VIDEO_MODELS.map(tile).join('');
      if(ig) ig.innerHTML = IMAGE_MODELS.map(tile).join('');

    // Filters
    function setupFilters(){
      const btns = Array.from(document.querySelectorAll('.filter-btn'));
      const videoSection = document.getElementById('videoSection');
      const imageSection = document.getElementById('imageSection');
      function activate(btn){
        btns.forEach(b => b.classList.remove('btn-brand'));
        btns.forEach(b => b.classList.add('btn'));
        btn.classList.remove('btn');
        btn.classList.add('btn-brand');
      }
      btns.forEach(btn => {
        btn.addEventListener('click', () => {
          const f = btn.getAttribute('data-filter');
          activate(btn);
          if(f === 'all'){ videoSection.style.display=''; imageSection.style.display=''; }
          if(f === 'video'){ videoSection.style.display=''; imageSection.style.display='none'; }
          if(f === 'image'){ videoSection.style.display='none'; imageSection.style.display=''; }
        });
      });
      if(btns[0]) activate(btns[0]);
    }

    // Run immediately so models show even if other scripts bail
    renderSections();
    setupFilters();

      // Desktop: model tiles are display-only (not clickable)
  function applyDesktopModelTileLock(){
    const links = Array.from(document.querySelectorAll('a[data-model-link="1"]'));
    links.forEach((a) => {
      // preserve original href in case you ever want to restore later
      if(!a.dataset.origHref) a.dataset.origHref = a.getAttribute('href') || '';
      a.setAttribute('href', 'javascript:void(0)');
      a.setAttribute('aria-disabled', 'true');
      a.setAttribute('tabindex', '-1');
      a.style.pointerEvents = 'none';
      a.style.cursor = 'default';
    });
  }

// Run once now, and on resize

      if(authMode!=='signup'){ setAuthMode('signup'); $msg.textContent=''; return; }
      if(!$emailIn.value || !$passIn.value){ $msg.textContent='Enter email & password.'; return; }
      if($passIn.value !== $pass2In.value){ $msg.textContent='Passwords do not match.'; return; }
      $msg.textContent = 'Creating account…';
      const { data, error } = await sb.auth.signUp({ email: $emailIn.value.trim(), password: $passIn.value.trim() });
      if(error){ $msg.textContent = error.message; return; }
      $msg.textContent = 'Check your email to confirm, then Log in.';
      setAuthMode('login');
    });
    // Log in
    $doLogin.addEventListener('click', async ()=>{
      if(!$emailIn.value || !$passIn.value){ $msg.textContent='Enter email & password.'; return; }
      $msg.textContent = 'Signing in…';
      try{
        const { data, error } = await sb.auth.signInWithPassword({ email: $emailIn.value.trim(), password: $passIn.value.trim() });
        if(error){ $msg.textContent = error.message; return; }
        const user = data.user;
        const prof = await getOrCreateProfile(user);
        showLoggedInUI(prof, user);
        closeAuth();
      }catch(e){ $msg.textContent = e.message || 'Login failed.'; }
    });
    // Logout
    document.getElementById('btnLogout').addEventListener('click', async ()=>{
      await sb.auth.signOut();
      showLoggedOutUI();
    });
    
    // === Credit helpers (pure Supabase; no Make.com) ===
    async function getUserId() {
      const { data } = await sb.auth.getUser();
      return data.user?.id || null;
    }
    async function setCredits(value) {
      const uid = await getUserId();
      if (!uid) throw new Error('Not logged in');
      const { error } = await sb
        .from('profiles')
        .update({ credits: value })
        .eq('user_id', uid);
      if (error) throw error;
      await window.refreshCredits();
    }
    async function addCredits(delta) {
      const uid = await getUserId();
      if (!uid) throw new Error('Not logged in');
      const { data, error } = await sb
        .from('profiles')
        .select('credits')
        .eq('user_id', uid)
        .maybeSingle();
      if (error) throw error;
      const next = (data?.credits ?? 0) + delta;
      await setCredits(next);
    }
    async function useCredits(cost) {
      const uid = await getUserId();
      if (!uid) throw new Error('Not logged in');
      const { data, error } = await sb
        .from('profiles')
        .select('credits')
        .eq('user_id', uid)
        .maybeSingle();
      if (error) throw error;
      const current = data?.credits ?? 0;
      if (current < cost) throw new Error('Not enough credits');
      await setCredits(current - cost);
    }
    window.hansoraCredits = { addCredits, useCredits, setCredits };

    // Restore session
    (async ()=>{
      const { data } = await sb.auth.getUser();
      const user = data.user;
      if(user){
        try{
          const prof = await getOrCreateProfile(user);
          showLoggedInUI(prof, user);
        }catch{ showLoggedOutUI(); }
      }else{
        showLoggedOutUI();
      }
    })();
  </script>
<script>
  (function(){ 
    function ready(fn){ if(document.readyState!=='loading') fn(); else document.addEventListener('DOMContentLoaded', fn); }
    ready(async function(){ 
      try {
        if (typeof sb === 'undefined' || !sb.auth) return;
        const navCreditsEl = document.getElementById('navCredits');
        const runBtn = document.getElementById('runBtn');
        const R = (c)=>{ 
          if (navCreditsEl) navCreditsEl.textContent = (c ?? 0) + '⚡';
          if (runBtn) {
            const ok = (c ?? 0) > 0;
            runBtn.disabled = !ok;
            runBtn.classList.toggle('opacity-50', !ok);
            runBtn.classList.toggle('cursor-not-allowed', !ok);
          }
        };

        const ures = await sb.auth.getUser();
        const user = ures?.data?.user;
        if(!user) return;

        async function loadCreditsOnce(){ 
          try {
            const { data: prof } = await sb.from('profiles')
              .select('credits').eq('user_id', user.id).maybeSingle();
            const c = prof?.credits ?? 0;
            R(c);
            return c;
          } catch(e) { console.warn('credits poll read failed', e); return null; }
        }

        // Long polling burst (3 minutes) every 2s
        function startCreditsPolling(durationMs=180000, intervalMs=2000){
          if (window.__creditsPoll) clearInterval(window.__creditsPoll);
          const t0 = Date.now();
          window.__creditsPoll = setInterval(async ()=>{
            await loadCreditsOnce();
            if (Date.now() - t0 > durationMs) clearInterval(window.__creditsPoll);
          }, intervalMs);
        }

        // Initial load -> reflect current value
        await loadCreditsOnce();

        // If __run exists, wrap it so we start long polling right after Run
        if (typeof window.__run === 'function') {
          const __origRun = window.__run;
          window.__run = async function(){ 
            const c = await loadCreditsOnce();
            if ((c ?? 0) <= 0) { alert('No credits left.'); return; }
            startCreditsPolling(180000, 2000); // 3 minutes polling
            return __origRun();
          }
        }
      } catch(e){ console.warn('credits polling v2 error', e); }
    });
  })();
  </script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const el = document.getElementById('btnLoginSignup');
  if (!el || !window.supabase) return;
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session && data.session.user) {
      el.style.display = 'none';
    }
    sb.auth.onAuthStateChange((_e, session) => {
      if (session && session.user) {
        el.style.display = 'none';
      } else {
        el.style.display = '';
      }
    });
  } catch (_) { /* silent */ }
});
</script>
