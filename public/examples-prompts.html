<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Examples & Prompts — HANSORA AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --base-line: rgba(255,255,255,0.08); }
    body { background: #0b0b0f; color: #e5e7eb; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    .glass { background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02)); backdrop-filter: blur(8px); }
    .border-line { border-color: var(--base-line); }
    .card { border:1px solid var(--base-line); border-radius: 16px; overflow: hidden; background: #0e0f14; }
    .media { background:#0a0a0f; position:relative; }
    .media video, .media img { width: 100%; height: auto; display:block; object-fit: contain; background:#000; }
    .badge { position:absolute; top:10px; right:10px; background:#11132a; border:1px solid #242847; color:#c9ccff; font-size:11px; padding:5px 8px; border-radius:999px; }
    .btn { background: #1c1e2a; border:1px solid #2a2d3e; color:#eaeafa; border-radius:12px; padding:10px 14px; font-size:14px; }
    .btn:hover { background:#242844; }
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items:center; justify-content:center; z-index: 50; }
    .modal { width: min(1100px, 94vw); background: #0e0f14; border: 1px solid var(--base-line); border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    .modal .body { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; padding: 18px; }
    @media (max-width: 980px){ .modal .body { grid-template-columns: 1fr; } }
    .poster { background: #000; border-radius: 12px; border:1px solid var(--base-line); overflow:hidden; display:flex; align-items:center; justify-content:center; }
    .poster video, .poster img { max-width:100%; max-height:70vh; width:auto; height:auto; object-fit: contain; display:block; }
    .prompt-box { border:1px solid var(--base-line); background:#0b0c10; border-radius:12px; }
    .prompt-body { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; white-space: pre-wrap; word-break: break-word; }
    a.inline-link { color:#a9b4ff; border-bottom:1px dotted #3b3f68; }
  </style>
</head>
<body class="min-h-full flex flex-col">
  <header class="border-b border-line">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
      <a href="index.html" class="font-semibold">HANSORA AI</a>
      <div class="text-sm text-zinc-300">Examples & Prompts</div>
    </div>
  </header>

  <main class="flex-1">
    <section>
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8 md:py-12">
        <h1 class="text-2xl sm:text-3xl font-bold">Examples & Prompts</h1>
        <p class="mt-2 text-zinc-400 max-w-2xl">Tap any example to see the prompt and media. Copy only the prompt and jump to the right generator link in the same tab.</p>

        <div class="mt-6 flex items-center gap-3 text-sm">
          <button data-filter="all" class="btn">All</button>
          <button data-filter="veo3" class="btn">Veo 3</button>
          <button data-filter="kling" class="btn">Kling</button>
          <button data-filter="imagen" class="btn">Imagen</button>
        </div>

        <div id="grid" class="mt-6 grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
        <p id="err" class="mt-3 text-sm text-rose-300"></p>
      </div>
    </section>
  </main>

  <!-- modal -->
  <div id="mask" class="modal-mask">
    <div class="modal">
      <div class="body">
        <div class="poster">
          <video id="mVideo" controls playsinline muted loop style="display:none"></video>
          <img id="mImg" alt="example image" style="display:none"/>
        </div>
        <div>
          <h3 id="mTitle" class="text-lg font-semibold mb-1"></h3>
          <div id="mHighlight" class="text-[15px] text-zinc-200 font-semibold mb-2"></div>
          <div class="text-xs text-zinc-500 mb-3">Tip: Click the model link below to open the generator in the <b>same tab</b>.</div>

          <div class="prompt-box p-3">
            <div class="text-xs text-zinc-400 mb-1">Prompt</div>
            <div id="mPrompt" class="prompt-body text-[13px] leading-5"></div>
          </div>

          <div class="mt-4 flex flex-wrap gap-3">
            <button id="btnCopy" class="btn">Copy prompt</button>
            <a id="modelLink" class="btn" href="#" >Open generator</a>
            <button id="mClose" class="btn">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- Supabase (reuse same project as templates page) ---
    const SUPABASE_URL  = 'https://qmaealblegvcwodlmeht.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtYWVhbGJsZWd2Y3dvZGxtZWh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg2MjkzNzMsImV4cCI6MjA3NDIwNTM3M30.bUV6W0zBtkd_6gtfPGBSpskybUmpLC-1znljoDpYy4c';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    // Map model slug to internal page URL (same tab)
    const MODEL_LINKS = {
      veo3: "veo3.html",
      kling: "kling.html",
      imagen: "imagen.html"
    };

    const mask   = document.getElementById('mask');
    const mVideo = document.getElementById('mVideo');
    const mImg   = document.getElementById('mImg');
    const mTitle = document.getElementById('mTitle');
    const mHi    = document.getElementById('mHighlight');
    const mPr    = document.getElementById('mPrompt');
    const mLink  = document.getElementById('modelLink');
    const mClose = document.getElementById('mClose');
    const $err   = document.getElementById('err');

    mClose.onclick = () => { try { mVideo.pause(); } catch {} mask.style.display = 'none'; mVideo.removeAttribute('src'); mVideo.load(); mImg.removeAttribute('src'); mImg.style.display='none'; mVideo.style.display='none'; };

    mask.addEventListener('click', e => { if (e.target === mask) mClose.click(); });

    // Turn [[VEO3]] tokens into internal links in the highlight text
    function linkifyHighlight(text, modelSlug){
      if (!text) return "";
      let html = text.replace(/\[\[VEO3\]\]/gi, '<a class="inline-link" href="veo3.html">VEO 3</a>')
                     .replace(/\[\[KLING\]\]/gi, '<a class="inline-link" href="kling.html">Kling</a>')
                     .replace(/\[\[IMAGEN\]\]/gi, '<a class="inline-link" href="imagen.html">Imagen</a>');
      // Also append a default link if no token present
      if (!/\[\[(VEO3|KLING|IMAGEN)\]\]/i.test(text) && MODEL_LINKS[modelSlug]) {
        html += ` — <a class="inline-link" href="${MODEL_LINKS[modelSlug]}">${(modelSlug||'').toUpperCase()}</a>`;
      }
      return html;
    }

    function makeCard(row){
      const card = document.createElement('article');
      card.className = 'card glass hover:border-white/20 transition cursor-pointer';

      const media = document.createElement('div');
      media.className = 'media';

      let badgeText = (row.media_type || '').toLowerCase() === 'image' ? 'Image' : 'Video';
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = badgeText;
      media.appendChild(badge);

      if ((row.media_type || '').toLowerCase() === 'image') {
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.src = row.media_url;
        media.appendChild(img);
      } else {
        const v = document.createElement('video');
        v.setAttribute('preload','metadata');
        v.muted = true;
        v.playsInline = true;
        v.setAttribute('loop','');
        if (row.poster_url) v.setAttribute('poster', row.poster_url);
        v.src = row.media_url || '';
        media.appendChild(v);
      }

      card.appendChild(media);

      const meta = document.createElement('div');
      meta.className = 'p-4';
      meta.innerHTML = '<h3 class="font-semibold">'+(row.title || 'Example')+'</h3><div class="text-xs text-zinc-400 mt-1">'+(row.model_slug || '').toUpperCase()+'</div>';
      card.appendChild(meta);

      // Click -> open modal with prompt & media
      card.addEventListener('click', () => {
        mTitle.textContent = row.title || 'Example';
        mHi.innerHTML      = linkifyHighlight(row.highlight || '', row.model_slug || '');
        mPr.textContent    = row.prompt || '';

        // media
        const isImg = (row.media_type || '').toLowerCase() === 'image';
        mImg.style.display = isImg ? 'block' : 'none';
        mVideo.style.display = isImg ? 'none' : 'block';
        if (isImg) {
          mImg.src = row.media_url || '';
        } else {
          try { mVideo.pause(); } catch {}
          mVideo.src = row.media_url || '';
          mVideo.load();
          mVideo.play().catch(()=>{});
        }

        // same-tab link to model page
        const page = MODEL_LINKS[(row.model_slug || '').toLowerCase()] || '#';
        mLink.setAttribute('href', page);

        mask.style.display = 'flex';
      });

      return card;
    }

    async function loadExamples(filter='all'){
      try{
        let q = supabase.from('prompt_examples')
          .select('id,title,model_slug,media_type,media_url,poster_url,highlight,prompt,sort_order')
          .order('sort_order', { ascending: true });

        if (filter && filter !== 'all') q = q.eq('model_slug', filter);

        const { data, error } = await q;
        const grid = document.getElementById('grid');
        if (error){ console.error(error); $err.textContent = error.message || 'Failed to load examples.'; return; }
        if (!data || data.length === 0){ grid.innerHTML = '<p class="text-zinc-400">No examples yet.</p>'; return; }

        grid.innerHTML = '';
        data.forEach(row => grid.appendChild(makeCard(row)));
      }catch(e){
        console.error(e);
        $err.textContent = 'Failed to load examples (exception).';
      }
    }

    // Filters
    document.querySelectorAll('button[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => loadExamples(btn.getAttribute('data-filter')));
    });

    // Copy prompt
    document.getElementById('btnCopy').addEventListener('click', async () => {
      const text = (mPr.textContent || '').trim();
      try{
        await navigator.clipboard.writeText(text);
        const btn = document.getElementById('btnCopy');
        const prev = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = prev, 900);
      }catch{}
    });

    loadExamples();
  </script>
</body>
</html>
